set_schedule:
  name: Set mowing schedule (day)
  description: >-
    Overwrite the mowing plan for one weekday: enable/disable it and provide one
    or more time periods, each optionally restricted to specific zones. This
    replaces that weekday's schedule.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower
    day:
      name: Day
      description: Weekday to program.
      required: true
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    enabled:
      name: Enabled
      description: Whether the mower mows on this day.
      default: true
      selector:
        boolean:
    periods:
      name: Periods
      description: >-
        List of time windows. Each item: start "HH:MM", end "HH:MM", and an
        optional zones list of internal map zone IDs (empty = all zones). Multiple items =
        multiple mowing sessions that day.
      required: false
      example: '[{"start": "09:45", "end": "17:15", "zones": []}]'
      selector:
        object:

mow:
  name: Mow now
  description: >-
    Start mowing immediately in the chosen zones, with a restart-vs-continue
    choice. Models that support custom sequencing follow the listed zone order.
    First-generation H-series mowers mow the selected zones in their own order.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower
    zones:
      name: Zones
      description: >-
        Internal map zone IDs to mow (for example [13,24]). On models that support
        custom sequencing, the list order is used. First-generation H-series
        mowers still restrict mowing to the selected zones but choose their order
        automatically. Leave empty to mow all zones.
      required: false
      example: "[1]"
      selector:
        object:
    reset:
      name: Restart from scratch
      description: >-
        On clears retained mowing progress and re-mows the whole selected area.
        Off continues by mowing only the area not yet cut.
      default: true
      selector:
        boolean:


continue_last_ordered_run:
  name: Continue last ordered run
  description: >-
    Continue the most recent successfully sent ordered mowing run without
    re-sending zones that Navimower has already confirmed complete. The original
    zone order is retained across Dock/Home and Home Assistant restarts.
    Only unfinished zones are sent to the mower, using the normal Mow command with
    reset=false so retained per-zone mowing progress can continue.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower

resume:
  name: Resume interrupted mowing
  description: >-
    Ask the mower to resume its vendor-retained interrupted task. This sends the
    dedicated Resume command and does not select zones, send a new Mow command,
    reset mowing progress or start a new Navimower mowing cycle. Paused resume is
    already known to work. Resume from docked/charging state may depend on mower
    model, firmware and whether the mower still retains an interrupted task.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower

set_gate_area:
  name: Create or update gate area
  description: >-
    Persist one integration-owned gate-area polygon in mower-local X/Y metres.
    Omit gate_area_id to create a new area. When editing an existing area, pass
    its current slug from the map payload as gate_area_id. The polygon must have
    3 to 64 unique points, must not intersect itself, and its compatibility
    x_min/x_max/y_min/y_max bounds are calculated automatically. The Navimower
    config entry reloads after a successful save.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower
    gate_area_id:
      name: Existing gate area ID
      description: >-
        Current gate-area slug when editing. Leave empty when creating a new area.
      required: false
      selector:
        text:
    name:
      name: Name
      description: Display name for the gate area.
      required: true
      selector:
        text:
    polygon:
      name: Polygon
      description: >-
        Ordered mower-local X/Y points, for example
        [[-28.48,9.08],[-23.63,6.5],[-20.87,10.5],[-25.7,13.7]].
      required: true
      selector:
        object:

delete_gate_area:
  name: Delete gate area
  description: >-
    Delete one integration-owned gate area by its slug from the map payload. The
    Navimower config entry reloads after a successful delete.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower
    gate_area_id:
      name: Gate area ID
      description: Current gate-area slug from the map payload.
      required: true
      selector:
        text:

mark_notification_read:
  name: Mark notification as read
  description: >-
    Mark one row from Latest notification as read. Vendor rows keep the official
    encrypted Navimow detail-open flow and are confirmed by a refreshed Device
    feed. Navimower-generated rows use a local navimower: message ID and are
    marked read only in Home Assistant's persistent Navimower notification Store.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower
    message_id:
      name: Message ID
      description: message_id from the Latest notification recent list.
      required: true
      selector:
        text:

mark_all_notifications_read:
  name: Mark all notifications as read
  description: >-
    Mark both retained Navimower-generated notifications and the vendor Device
    notification feed read. Local rows are updated in Home Assistant storage;
    vendor rows use the official Navimow Mark all as read request and are then
    refreshed from the cloud.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower

set_schedule_queue:
  name: Set Navimower custom schedule queue
  description: Persist the ordered Custom queue without enabling or starting Navimower Schedule. Zones may repeat.
  fields:
    device_id:
      name: Mower
      required: false
      selector:
        device:
          integration: navimower
    zones:
      name: Ordered zones
      description: Selected, previously completed schedule zone IDs in mowing order. IDs may repeat.
      required: true
      selector:
        object:

reset_schedule:
  name: Reset Navimower schedule
  description: >-
    Clear the integration-owned scheduler's current round, queue position and
    retained task ownership. This action does not itself send Mow, Resume or Dock.
    If Navimower Schedule is enabled, its next eligible zone is treated as a new
    mowing cycle and may therefore start from scratch. Reset is refused while the
    mower is mowing or returning; pause or dock it first.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower

relearn_georeference:
  name: Relearn map georeference
  description: >-
    Clear only this mower's learned local-map to WGS84 calibration and immediately
    start learning it again from fresh location samples. Map geometry, mowing
    history, Schedule state and other integration data are not reset.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower

refresh_map_snapshot:
  name: Refresh map snapshot
  description: >-
    Render a fresh backend PNG for this mower's Map snapshot image entity and
    return only after the cached image has been replaced. This is intended for
    automations and Node-RED flows that want to send the latest map in a
    notification without keeping a Lovelace dashboard open.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower

export_raw_data:
  name: Export raw development data
  description: >-
    Write an explicit unredacted development capture under
    /config/navimower_diagnostics/raw/. The file preserves fresh private-cloud
    responses, full map-detail data, decoded map/calibration state and the latest
    exact MQTT payload per observed topic. This is separate from Home Assistant
    Download diagnostics, which remains sanitized for user sharing. Raw exports
    contain sensitive coordinates and identifiers and must not be published.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower

probe_private_api:
  name: Probe private API (development)
  description: >-
    Run an explicit read-only private-cloud field probe for selected endpoint
    families and write the result under /config/navimower_diagnostics/probes/.
    The terrain_deep option additionally inspects H2-style dynamic-map data,
    downloads the vendor type-2 artifact when a signed URL is returned, and
    creates a ZIP bundle containing the JSON plus downloaded binary file. The
    action never accepts an arbitrary endpoint or payload. RTK account/password
    values and signed artifact URLs are redacted from the JSON output.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower
    probe:
      name: Probe
      description: Endpoint family to test. All runs the normal read-only probes; terrain_deep is explicit because it downloads an artifact.
      required: false
      default: all
      selector:
        select:
          options:
            - all
            - trail
            - reports
            - terrain
            - terrain_deep
            - weather
            - rtk