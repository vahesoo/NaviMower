name: Beta36 PR builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'release/0.4.3-beta36'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply beta36 builder
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          text=Path('.github/workflows/build-beta36-custom-order.yml').read_text()
          body=text.split('      - name: Apply beta36 scheduler changes\n        shell: python\n        run: |\n',1)[1].split('      - name: Run tests\n',1)[0]
          exec(textwrap.dedent(body))
      - name: Commit beta36
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/navimower tests .github/release-notes/0.4.3-beta36.md
          git commit -m 'Add custom Navimower schedule order' || exit 0
          git push origin HEAD:${{ github.head_ref }}
