name: Beta31 Custom Area UI hotfix builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'release/0.4.3-beta31'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.4.3-beta31
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Apply beta31 UI hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def patch_strings(path: Path) -> None:
              data = json.loads(path.read_text(encoding='utf-8'))
              options = data.setdefault('options', {})
              steps = options.setdefault('step', {})

              init = steps.setdefault('init', {})
              init['description'] = (
                  'Configure retained trail history, Navimower Schedule, zone-pair gates, '
                  'virtual Custom Areas and optional legacy local X/Y gate areas.'
              )
              init.setdefault('menu_options', {})['custom_areas'] = 'Custom areas'

              steps['custom_areas'] = {
                  'title': 'Custom areas',
                  'description': (
                      'Create NaviMower-owned virtual polygon areas from a temporary '
                      'off-limit area drawn in the Navimow app. Imported Custom Areas remain '
                      'in Home Assistant after the temporary off-limit area is deleted.'
                  ),
                  'menu_options': {
                      'custom_area_add': 'Add custom area',
                      'custom_area_delete': 'Delete custom area',
                  },
              }

              steps['custom_area_add'] = {
                  'title': 'Add custom area',
                  'description': (
                      'Before continuing, make sure the temporary off-limit area does not '
                      'exist in the Navimow map. Press Submit now to capture the current map '
                      'as the baseline. Do not create the temporary off-limit area until the '
                      'next step.'
                  ),
                  'data': {},
              }

              steps['custom_area_detect'] = {
                  'title': 'Create the temporary off-limit area',
                  'description': (
                      'Baseline captured (map revision {baseline_revision}). Now open the '
                      'Navimow app and Map editor, create exactly one new off-limit area in '
                      'the shape of the Custom Area you want, and save the map. Leave that '
                      'temporary off-limit area in place, return here, then press Submit. '
                      'NaviMower will detect the new polygon automatically.'
                  ),
                  'data': {},
              }

              steps['custom_area_name'] = {
                  'title': 'Name the custom area',
                  'description': (
                      'New polygon detected: {area} m², {points} boundary points, centroid '
                      '{centroid}. Give the area a name and press Submit to copy it into '
                      'NaviMower. After it is saved, you can delete the temporary off-limit '
                      'area from the Navimow app; the Custom Area will remain in Home Assistant.'
                  ),
                  'data': {'name': 'Name'},
              }

              steps['custom_area_delete'] = {
                  'title': 'Delete custom area',
                  'description': (
                      'Delete only the NaviMower virtual Custom Area. This does not change '
                      'the robot map or any Navimow off-limit area.'
                  ),
                  'data': {'custom_area': 'Custom area'},
              }

              errors = options.setdefault('error', {})
              errors.update({
                  'custom_area_map_not_available': (
                      'The current Navimow map is not loaded yet. Wait for the integration '
                      'to refresh and try again.'
                  ),
                  'custom_area_refresh_failed': (
                      'The Navimow map could not be refreshed. Try again.'
                  ),
                  'custom_area_not_detected': (
                      'No new off-limit polygon was detected. Make sure you created exactly '
                      'one new off-limit area in the Navimow app and saved the map, then try again.'
                  ),
                  'custom_area_multiple_detected': (
                      'More than one new off-limit polygon was detected. Keep only the single '
                      'temporary area you want to import, save the map, and try again.'
                  ),
                  'custom_area_invalid': 'The detected polygon or Custom Area name is invalid.',
                  'custom_area_duplicate': 'A Custom Area with the same name already exists.',
              })
              options.setdefault('abort', {})['no_custom_areas'] = 'No Custom Areas are configured.'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          patch_strings(root / 'custom_components/navimower/strings.json')
          patch_strings(root / 'custom_components/navimower/translations/en.json')

          manifest_path = root / 'custom_components/navimower/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.4.3-beta31'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          beta30_test = root / 'tests/test_v043_beta30.py'
          source = beta30_test.read_text(encoding='utf-8')
          old = '''def test_manifest_is_beta30() -> None:\n    manifest = json.loads((COMPONENT / "manifest.json").read_text(encoding="utf-8"))\n    assert manifest["version"] == "0.4.3-beta30"\n'''
          new = '''def test_beta30_release_notes_remain_available() -> None:\n    notes = (ROOT / ".github" / "release-notes" / "0.4.3-beta30.md").read_text(encoding="utf-8")\n    assert "0.4.3-beta30" in notes\n'''
          if old not in source:
              raise SystemExit('beta30 manifest assertion block not found')
          beta30_test.write_text(source.replace(old, new, 1), encoding='utf-8')

          beta31_test = '''"""Regression guards for 0.4.3-beta31 Custom Area UI hotfix."""\nfrom __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nCOMPONENT = ROOT / "custom_components" / "navimower"\n\n\ndef _load(path: Path):\n    return json.loads(path.read_text(encoding="utf-8"))\n\n\ndef test_custom_area_flow_has_visible_guidance_in_strings_and_english_translation() -> None:\n    for path in (COMPONENT / "strings.json", COMPONENT / "translations" / "en.json"):\n        data = _load(path)\n        options = data["options"]\n        steps = options["step"]\n        assert steps["init"]["menu_options"]["custom_areas"] == "Custom areas"\n        assert steps["custom_areas"]["menu_options"]["custom_area_add"] == "Add custom area"\n        assert "Press Submit now to capture the current map as the baseline" in steps["custom_area_add"]["description"]\n        assert "Now open the Navimow app and Map editor" in steps["custom_area_detect"]["description"]\n        assert "{baseline_revision}" in steps["custom_area_detect"]["description"]\n        assert "After it is saved, you can delete the temporary off-limit area" in steps["custom_area_name"]["description"]\n        for key in (\n            "custom_area_map_not_available",\n            "custom_area_refresh_failed",\n            "custom_area_not_detected",\n            "custom_area_multiple_detected",\n            "custom_area_invalid",\n            "custom_area_duplicate",\n        ):\n            assert options["error"][key]\n        assert options["abort"]["no_custom_areas"]\n\n\ndef test_manifest_is_beta31() -> None:\n    manifest = _load(COMPONENT / "manifest.json")\n    assert manifest["version"] == "0.4.3-beta31"\n'''
          (root / 'tests/test_v043_beta31.py').write_text(beta31_test, encoding='utf-8')

          notes = '''# Navimower 0.4.3-beta31\n\n- Fixes the beta30 Custom Area options UI so every new menu item, step title, instruction and error message is visible.\n- The Add Custom Area flow now explicitly tells the user when the baseline is captured and when to create/save the temporary off-limit area in the Navimow app.\n- No Custom Area detection/import logic is changed from beta30.\n'''
          (root / '.github/release-notes/0.4.3-beta31.md').write_text(notes, encoding='utf-8')
          PY

          python -m compileall -q custom_components/navimower
          python -m pytest -q
          git diff --check

          git rm .github/workflows/beta31-ui-hotfix-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/navimower/strings.json \
                  custom_components/navimower/translations/en.json \
                  custom_components/navimower/manifest.json \
                  tests/test_v043_beta30.py \
                  tests/test_v043_beta31.py \
                  .github/release-notes/0.4.3-beta31.md
          git commit -m "Fix Custom Area options UI guidance"
          git push origin HEAD:release/0.4.3-beta31
