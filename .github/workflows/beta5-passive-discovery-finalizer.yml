name: Temporary Navimower beta5 passive discovery release

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.number == 27 && github.event.comment.body == 'RUN-BETA5-RELEASE'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Patch beta5 passive discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          COMPONENT = ROOT / 'custom_components' / 'navimower'

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              COMPONENT / 'const.py',
              'OPT_DIAGNOSTICS_DETAIL: Final = "diagnostics_detail"\n',
              'OPT_DIAGNOSTICS_DETAIL: Final = "diagnostics_detail"\n'
              'OPT_PASSIVE_DISCOVERY: Final = "passive_discovery"\n',
          )
          replace_once(
              COMPONENT / 'const.py',
              'DEFAULT_DIAGNOSTICS_DETAIL: Final = "standard"\n',
              'DEFAULT_DIAGNOSTICS_DETAIL: Final = "standard"\n'
              'DEFAULT_PASSIVE_DISCOVERY: Final = False\n',
          )

          (COMPONENT / 'discovery.py').write_text(r'''"""Safe helpers for temporary passive vendor-protocol discovery."""
          from __future__ import annotations

          from collections.abc import Mapping
          import hashlib
          import json
          from typing import Any
          from urllib.parse import urlsplit, urlunsplit

          _SENSITIVE_EXACT = {
              "access_token", "refresh_token", "token", "password", "pwd", "pwdinfo",
              "secret", "authorization", "cookie", "email", "phone", "uid", "uuid",
              "auth_uid", "user_id", "userid", "username", "user_name", "vehicle_sn",
              "serial", "serial_number", "sn", "device_id", "oauth_device_id", "client_id",
              "ssid", "bssid", "mac", "ip", "ip_address", "iccid", "pin", "pin_code",
              "pincode", "latitude", "longitude", "anchor", "anti_theft_point",
              "antitheftpoint", "origin_gps", "center_gps", "ne_gps", "sw_gps",
          }
          _OBSERVED_VALUE_KEYS = {
              "type", "action", "subAction", "vehicleState", "eventCode", "code", "status",
              "state", "messageType", "notificationType",
          }
          _MAX_DEPTH = 8
          _MAX_ITEMS = 50
          _MAX_STRING = 512


          def mqtt_discovery_topic(device_id: str) -> str:
              """Return the current mower-only downlink wildcard used in discovery mode."""
              return f"/downlink/vehicle/{device_id}/#"


          def _is_sensitive_key(key: str) -> bool:
              normalized = str(key).strip().lower().replace("-", "_")
              return (
                  normalized in _SENSITIVE_EXACT
                  or "token" in normalized
                  or "password" in normalized
                  or "secret" in normalized
                  or normalized.endswith("_uid")
                  or normalized.endswith("_uuid")
                  or "latitude" in normalized
                  or "longitude" in normalized
                  or normalized.endswith("_gps")
                  or normalized.startswith("gps_")
              )


          def _safe_url(value: str) -> str:
              try:
                  parsed = urlsplit(value)
              except ValueError:
                  return "<redacted-url>"
              if parsed.scheme not in {"http", "https", "ws", "wss", "rtsp", "rtsps"} or not parsed.netloc:
                  return value
              host = parsed.hostname or ""
              port = f":{parsed.port}" if parsed.port else ""
              return urlunsplit((parsed.scheme, f"{host}{port}", parsed.path, "", ""))


          def _large_summary(raw: bytes, kind: str) -> dict[str, Any]:
              return {
                  "_omitted": kind,
                  "length": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }


          def sanitize_discovery_value(value: Any, *, key: str = "", depth: int = 0) -> Any:
              """Return a bounded JSON-safe sample with credentials/location IDs redacted."""
              if key and _is_sensitive_key(key):
                  return "<redacted>"
              if depth >= _MAX_DEPTH:
                  return "<max-depth>"
              if isinstance(value, Mapping):
                  out = {}
                  for index, (raw_key, child) in enumerate(value.items()):
                      if index >= _MAX_ITEMS:
                          out["_truncated_keys"] = len(value) - _MAX_ITEMS
                          break
                      child_key = str(raw_key)
                      out[child_key] = sanitize_discovery_value(
                          child, key=child_key, depth=depth + 1
                      )
                  return out
              if isinstance(value, (list, tuple)):
                  out = [
                      sanitize_discovery_value(child, depth=depth + 1)
                      for child in value[:_MAX_ITEMS]
                  ]
                  if len(value) > _MAX_ITEMS:
                      out.append({"_truncated_items": len(value) - _MAX_ITEMS})
                  return out
              if isinstance(value, (bytes, bytearray)):
                  return _large_summary(bytes(value), "binary")
              if isinstance(value, str):
                  safe = _safe_url(value)
                  if safe != value:
                      return safe
                  raw = value.encode("utf-8", errors="replace")
                  if len(raw) > _MAX_STRING:
                      return _large_summary(raw, "large_string")
                  return value
              if value is None or isinstance(value, (bool, int, float)):
                  return value
              rendered = repr(value).encode("utf-8", errors="replace")
              if len(rendered) > _MAX_STRING:
                  return _large_summary(rendered, "repr")
              return rendered.decode("utf-8", errors="replace")


          def sanitize_discovery_payload(payload: bytes) -> Any:
              """Decode one MQTT payload and retain only a safe bounded sample."""
              raw = bytes(payload or b"")
              try:
                  parsed = json.loads(raw.decode("utf-8", errors="replace"))
              except (TypeError, ValueError):
                  return _large_summary(raw, "non_json")
              return sanitize_discovery_value(parsed)


          def structure_summary(value: Any) -> dict[str, list[str]]:
              """Describe JSON structure without retaining ordinary field values."""
              parsed_types: set[str] = set()
              top_level_keys: set[str] = set()
              key_paths: set[str] = set()
              observed_values: set[str] = set()

              def walk(current: Any, path: str = "", depth: int = 0) -> None:
                  if depth >= _MAX_DEPTH:
                      return
                  parsed_types.add(type(current).__name__)
                  if isinstance(current, Mapping):
                      for index, (raw_key, child) in enumerate(current.items()):
                          if index >= _MAX_ITEMS:
                              break
                          key = str(raw_key)
                          child_path = f"{path}.{key}" if path else key
                          key_paths.add(child_path)
                          if not path:
                              top_level_keys.add(key)
                          if key in _OBSERVED_VALUE_KEYS and isinstance(child, (str, int, float, bool)):
                              observed_values.add(f"{key}={child}")
                          walk(child, child_path, depth + 1)
                  elif isinstance(current, (list, tuple)):
                      for child in current[:_MAX_ITEMS]:
                          walk(child, f"{path}[]" if path else "[]", depth + 1)

              walk(value)
              return {
                  "parsed_types": sorted(parsed_types),
                  "top_level_keys": sorted(top_level_keys),
                  "key_paths": sorted(key_paths),
                  "observed_type_values": sorted(observed_values),
              }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          mqtt_path = COMPONENT / 'mqtt.py'
          mqtt = mqtt_path.read_text(encoding='utf-8')
          mqtt = mqtt.replace(
              '    CONF_OAUTH_TOKEN,\n    MQTT_BROKER,\n',
              '    CONF_OAUTH_TOKEN,\n    DEFAULT_PASSIVE_DISCOVERY,\n    MQTT_BROKER,\n',
              1,
          )
          mqtt = mqtt.replace(
              '    MQTT_USERNAME,\n)\nfrom .location import',
              '    MQTT_USERNAME,\n    OPT_PASSIVE_DISCOVERY,\n)\n'
              'from .discovery import mqtt_discovery_topic, sanitize_discovery_payload, structure_summary\n'
              'from .location import',
              1,
          )
          mqtt = mqtt.replace(
              '        self._message_inventory: dict[str, dict[str, Any]] = {}\n',
              '        self._message_inventory: dict[str, dict[str, Any]] = {}\n'
              '        self._discovery_enabled = bool(\n'
              '            entry.options.get(OPT_PASSIVE_DISCOVERY, DEFAULT_PASSIVE_DISCOVERY)\n'
              '        )\n'
              '        self._discovery_inventory: dict[str, dict[str, Any]] = {}\n'
              '        self._discovery_markers: list[dict[str, Any]] = []\n'
              '        self._discovery_dropped_topics = 0\n'
              '        cloud_client = getattr(coordinator, "client", None)\n'
              '        if hasattr(cloud_client, "set_discovery_enabled"):\n'
              '            cloud_client.set_discovery_enabled(self._discovery_enabled)\n',
              1,
          )
          mqtt = mqtt.replace(
              '    @property\n    def configured(self) -> bool:\n        return bool(self.entry.data.get(CONF_OAUTH_TOKEN))\n',
              '    @property\n    def configured(self) -> bool:\n        return bool(self.entry.data.get(CONF_OAUTH_TOKEN))\n\n'
              '    @property\n    def discovery_enabled(self) -> bool:\n'
              '        """Return whether temporary passive discovery is enabled."""\n'
              '        return self._discovery_enabled\n',
              1,
          )
          old_subscribe = '''        try:\n            sdk._mqtt.client.subscribe(location_topic(device_id))\n        except Exception as err:  # noqa: BLE001\n            self._set_recovery_state("subscribe_failed", str(err))\n            _LOGGER.warning("Could not subscribe to Navimow location: %s", err)\n            return False\n        self._subscribed_mono = time.monotonic()\n'''
          new_subscribe = '''        try:\n            sdk._mqtt.client.subscribe(location_topic(device_id))\n        except Exception as err:  # noqa: BLE001\n            self._set_recovery_state("subscribe_failed", str(err))\n            _LOGGER.warning("Could not subscribe to Navimow location: %s", err)\n            return False\n        if self._discovery_enabled:\n            try:\n                sdk._mqtt.client.subscribe(mqtt_discovery_topic(device_id))\n            except Exception as err:  # noqa: BLE001\n                _LOGGER.warning("Could not subscribe to Navimower passive discovery: %s", err)\n        self._subscribed_mono = time.monotonic()\n'''
          if old_subscribe not in mqtt:
              raise SystemExit('mqtt subscribe anchor missing')
          mqtt = mqtt.replace(old_subscribe, new_subscribe, 1)

          start = mqtt.index('    def _record_message_inventory(')
          end = mqtt.index('    def diagnostic_inventory(', start)
          new_inventory_block = r'''    def _record_message_inventory(
              self,
              topic: str,
              payload: bytes,
              incoming_device_id: str,
          ) -> None:
              """Keep account-wide schema inventory plus opt-in current-device samples."""
              safe_topic = str(topic)
              for candidate in {str(incoming_device_id or ""), str(self._device_id or "")}:
                  if candidate:
                      safe_topic = safe_topic.replace(candidate, "<device>")
              self._record_inventory_item(
                  self._message_inventory,
                  safe_topic,
                  payload,
                  include_samples=False,
              )
              current_device = bool(
                  incoming_device_id == self._device_id
                  or (self._device_id and f"/vehicle/{self._device_id}/" in str(topic))
              )
              if not self._discovery_enabled or not current_device:
                  return
              if (
                  safe_topic not in self._discovery_inventory
                  and len(self._discovery_inventory) >= 64
              ):
                  self._discovery_dropped_topics += 1
                  return
              self._record_inventory_item(
                  self._discovery_inventory,
                  safe_topic,
                  payload,
                  include_samples=True,
              )

          @staticmethod
          def _record_inventory_item(
              store: dict[str, dict[str, Any]],
              safe_topic: str,
              payload: bytes,
              *,
              include_samples: bool,
          ) -> None:
              now = datetime.now(UTC).isoformat()
              item = store.setdefault(
                  safe_topic,
                  {
                      "count": 0,
                      "first_seen_utc": now,
                      "last_seen_utc": now,
                      "max_payload_bytes": 0,
                      "parsed_types": set(),
                      "top_level_keys": set(),
                      "key_paths": set(),
                      "observed_type_values": set(),
                  },
              )
              item["count"] += 1
              item["last_seen_utc"] = now
              item["max_payload_bytes"] = max(
                  item["max_payload_bytes"],
                  len(payload or b""),
              )
              try:
                  parsed = json.loads((payload or b"").decode("utf-8", errors="replace"))
              except (TypeError, ValueError):
                  item["parsed_types"].add("non_json")
              else:
                  summary = structure_summary(parsed)
                  item["parsed_types"].update(summary["parsed_types"])
                  item["top_level_keys"].update(summary["top_level_keys"])
                  item["key_paths"].update(summary["key_paths"])
                  item["observed_type_values"].update(summary["observed_type_values"])
              if include_samples:
                  samples = item.setdefault("samples", [])
                  sample = sanitize_discovery_payload(payload)
                  if not samples or samples[-1].get("payload") != sample:
                      samples.append({"seen_utc": now, "payload": sample})
                      del samples[:-3]

          def mark_discovery_event(self, name: str) -> dict[str, Any]:
              """Add a timestamp marker for correlating an app action with traffic."""
              label = " ".join(str(name or "marker").split())[:80] or "marker"
              marker = {
                  "name": label,
                  "created_utc": datetime.now(UTC).isoformat(),
                  "mqtt_message_total": sum(
                      int(item.get("count", 0)) for item in self._discovery_inventory.values()
                  ),
              }
              self._discovery_markers.append(marker)
              del self._discovery_markers[:-50]
              return deepcopy(marker)

          def diagnostic_discovery(self) -> dict[str, Any]:
              """Return current-device-only passive discovery data."""
              topics: dict[str, Any] = {}
              for topic, item in deepcopy(self._discovery_inventory).items():
                  topics[topic] = {
                      **item,
                      "parsed_types": sorted(item["parsed_types"]),
                      "top_level_keys": sorted(item["top_level_keys"]),
                      "key_paths": sorted(item["key_paths"]),
                      "observed_type_values": sorted(item["observed_type_values"]),
                  }
              wildcard = mqtt_discovery_topic(self._device_id) if self._device_id else None
              if wildcard and self._device_id:
                  wildcard = wildcard.replace(self._device_id, "<device>")
              return {
                  "enabled": self._discovery_enabled,
                  "scope": "current_device_only",
                  "wildcard_topic": wildcard,
                  "topic_limit": 64,
                  "sample_limit_per_topic": 3,
                  "marker_limit": 50,
                  "dropped_topic_messages": self._discovery_dropped_topics,
                  "markers": deepcopy(self._discovery_markers),
                  "topics": topics,
              }

          '''.replace('\n          ', '\n')
          mqtt = mqtt[:start] + new_inventory_block + mqtt[end:]
          mqtt = mqtt.replace(
              '            "last_any_message_scope": "current_device",\n',
              '            "last_any_message_scope": "current_device",\n'
              '            "passive_discovery_enabled": self._discovery_enabled,\n',
              1,
          )
          mqtt_path.write_text(mqtt, encoding='utf-8')

          client_path = COMPONENT / 'api' / 'client.py'
          client = client_path.read_text(encoding='utf-8')
          client = client.replace(
              'from __future__ import annotations\n\nimport hashlib\n',
              'from __future__ import annotations\n\nfrom copy import deepcopy\nfrom datetime import UTC, datetime\nimport hashlib\n',
              1,
          )
          client = client.replace(
              'from . import crypto, passport\n',
              'from ..discovery import structure_summary\nfrom . import crypto, passport\n',
              1,
          )
          client = client.replace(
              '        self._lock = threading.RLock()\n',
              '        self._lock = threading.RLock()\n'
              '        self._discovery_enabled = False\n'
              '        self._discovery_inventory: dict[str, dict[str, Any]] = {}\n',
              1,
          )
          marker = '    # ------------------------------------------------------------------ auth\n'
          discovery_methods = r'''    def set_discovery_enabled(self, enabled: bool) -> None:
              """Enable bounded value-free request schema discovery."""
              self._discovery_enabled = bool(enabled)

          def discovery_inventory(self) -> dict[str, Any]:
              """Return private-cloud request paths and response structures."""
              out: dict[str, Any] = {}
              for path, item in deepcopy(self._discovery_inventory).items():
                  out[path] = {
                      **item,
                      "parsed_types": sorted(item["parsed_types"]),
                      "top_level_keys": sorted(item["top_level_keys"]),
                      "key_paths": sorted(item["key_paths"]),
                      "observed_type_values": sorted(item["observed_type_values"]),
                  }
              return out

          def _record_discovery(self, path: str, value: Any, code: Any) -> None:
              if not self._discovery_enabled:
                  return
              now = datetime.now(UTC).isoformat()
              item = self._discovery_inventory.setdefault(
                  str(path),
                  {
                      "count": 0,
                      "first_seen_utc": now,
                      "last_seen_utc": now,
                      "last_business_code": None,
                      "parsed_types": set(),
                      "top_level_keys": set(),
                      "key_paths": set(),
                      "observed_type_values": set(),
                  },
              )
              item["count"] += 1
              item["last_seen_utc"] = now
              item["last_business_code"] = code
              if value is None:
                  return
              summary = structure_summary(value)
              item["parsed_types"].update(summary["parsed_types"])
              item["top_level_keys"].update(summary["top_level_keys"])
              item["key_paths"].update(summary["key_paths"])
              item["observed_type_values"].update(summary["observed_type_values"])

          '''.replace('\n          ', '\n')
          if marker not in client:
              raise SystemExit('client auth marker missing')
          client = client.replace(marker, discovery_methods + marker, 1)
          client = client.replace(
              '            if code == CODE_OK:\n                return result.get("data")\n',
              '            if code == CODE_OK:\n'
              '                data = result.get("data")\n'
              '                self._record_discovery(path, data, code)\n'
              '                return data\n',
              1,
          )
          client = client.replace(
              '                if isinstance(result, dict) and result.get("code") == CODE_OK:\n                    return result.get("data")\n',
              '                if isinstance(result, dict) and result.get("code") == CODE_OK:\n'
              '                    data = result.get("data")\n'
              '                    self._record_discovery(path, data, result.get("code"))\n'
              '                    return data\n',
              1,
          )
          client = client.replace(
              '            desc = str(result.get("desc", "")) if isinstance(result, dict) else str(result)\n',
              '            self._record_discovery(path, None, code)\n'
              '            desc = str(result.get("desc", "")) if isinstance(result, dict) else str(result)\n',
              1,
          )
          client_path.write_text(client, encoding='utf-8')

          flow_path = COMPONENT / 'config_flow.py'
          flow = flow_path.read_text(encoding='utf-8')
          flow = flow.replace(
              '    DEFAULT_INCLUDE_RETURN_TRAIL,\n',
              '    DEFAULT_INCLUDE_RETURN_TRAIL,\n    DEFAULT_PASSIVE_DISCOVERY,\n',
              1,
          )
          flow = flow.replace(
              '    OPT_INCLUDE_RETURN_TRAIL,\n',
              '    OPT_INCLUDE_RETURN_TRAIL,\n    OPT_PASSIVE_DISCOVERY,\n',
              1,
          )
          flow = flow.replace(
              '                    OPT_DIAGNOSTICS_DETAIL: str(user_input[OPT_DIAGNOSTICS_DETAIL]),\n',
              '                    OPT_DIAGNOSTICS_DETAIL: str(user_input[OPT_DIAGNOSTICS_DETAIL]),\n'
              '                    OPT_PASSIVE_DISCOVERY: bool(user_input[OPT_PASSIVE_DISCOVERY]),\n',
              1,
          )
          anchor = '''                    vol.Required(
                        OPT_DIAGNOSTICS_DETAIL,
                        default=str(
                            options.get(
                                OPT_DIAGNOSTICS_DETAIL,
                                DEFAULT_DIAGNOSTICS_DETAIL,
                            )
                        ),
                    ): vol.In(
                        {
                            "standard": "Standard",
                            "extended": "Extended",
                        }
                    ),
'''
          addition = anchor + '''                    vol.Required(
                        OPT_PASSIVE_DISCOVERY,
                        default=bool(
                            options.get(
                                OPT_PASSIVE_DISCOVERY,
                                DEFAULT_PASSIVE_DISCOVERY,
                            )
                        ),
                    ): bool,
'''
          if anchor not in flow:
              raise SystemExit('general options schema anchor missing')
          flow = flow.replace(anchor, addition, 1)
          flow_path.write_text(flow, encoding='utf-8')

          services_path = COMPONENT / 'services.py'
          services = services_path.read_text(encoding='utf-8')
          services = services.replace(
              'SERVICE_EXPORT_DIAGNOSTICS = "export_diagnostics"\n',
              'SERVICE_EXPORT_DIAGNOSTICS = "export_diagnostics"\n'
              'SERVICE_MARK_DISCOVERY_EVENT = "mark_discovery_event"\n',
              1,
          )
          services = services.replace(
              'EXPORT_DIAGNOSTICS_SCHEMA = vol.Schema(\n    {\n        vol.Optional("device_id"): cv.string,\n        vol.Optional("include_compressed_map", default=True): cv.boolean,\n    }\n)\n',
              'EXPORT_DIAGNOSTICS_SCHEMA = vol.Schema(\n    {\n        vol.Optional("device_id"): cv.string,\n        vol.Optional("include_compressed_map", default=True): cv.boolean,\n    }\n)\n\n'
              'MARK_DISCOVERY_EVENT_SCHEMA = vol.Schema(\n    {\n        vol.Optional("device_id"): cv.string,\n        vol.Required("name"): cv.string,\n    }\n)\n',
              1,
          )
          handler_anchor = '    async def _mow(call: ServiceCall) -> None:\n'
          marker_handler = '''    async def _mark_discovery_event(call: ServiceCall) -> None:
        coordinator = _resolve_coordinator(call)
        bridge = getattr(coordinator, "mqtt_bridge", None)
        if bridge is None or not hasattr(bridge, "mark_discovery_event"):
            raise ServiceValidationError("MQTT discovery bridge is not available")
        if not getattr(bridge, "discovery_enabled", False):
            raise ServiceValidationError(
                "Passive discovery is disabled; enable it in Navimower options first"
            )
        bridge.mark_discovery_event(str(call.data["name"]))

'''
          if handler_anchor not in services:
              raise SystemExit('services mow handler anchor missing')
          services = services.replace(handler_anchor, marker_handler + handler_anchor, 1)
          register_anchor = '''    hass.services.async_register(
        DOMAIN,
        SERVICE_EXPORT_DIAGNOSTICS,
        _export_diagnostics,
        schema=EXPORT_DIAGNOSTICS_SCHEMA,
    )
'''
          register_new = register_anchor + '''    hass.services.async_register(
        DOMAIN,
        SERVICE_MARK_DISCOVERY_EVENT,
        _mark_discovery_event,
        schema=MARK_DISCOVERY_EVENT_SCHEMA,
    )
'''
          if register_anchor not in services:
              raise SystemExit('services register anchor missing')
          services = services.replace(register_anchor, register_new, 1)
          services_path.write_text(services, encoding='utf-8')

          yaml_path = COMPONENT / 'services.yaml'
          yaml_text = yaml_path.read_text(encoding='utf-8')
          yaml_text += '''

mark_discovery_event:
  name: Mark passive discovery event
  description: >-
    Add a timestamp marker to the current mower's passive discovery diagnostics.
    Use this immediately before or after an action in the Navimow app so new MQTT
    topics or private-cloud schema changes can be correlated with that action.
  fields:
    device_id:
      name: Mower
      description: Target mower (only required if more than one is configured).
      required: false
      selector:
        device:
          integration: navimower
    name:
      name: Marker name
      description: Short label such as before_camera, after_notification, or lidar_view.
      required: true
      example: before_camera
      selector:
        text:
'''
          yaml_path.write_text(yaml_text, encoding='utf-8')

          diag_path = COMPONENT / 'diagnostics_export.py'
          diag = diag_path.read_text(encoding='utf-8')
          diag = diag.replace('    "angle",\n', '    "alert",\n    "angle",\n', 1)
          diag = diag.replace('    "edge",\n', '    "edge",\n    "event",\n', 1)
          diag = diag.replace('    "network",\n', '    "message",\n    "network",\n    "notification",\n    "notify",\n', 1)
          diag = diag.replace('    "resource",\n', '    "push",\n    "resource",\n', 1)
          diag = diag.replace('    "snapshot",\n', '    "snapshot",\n    "stream",\n', 1)
          diag = diag.replace('    "trail",\n', '    "trail",\n    "webrtc",\n    "rtsp",\n', 1)
          diag = diag.replace(
              '    mqtt_inventory = None\n    mqtt_health = None\n',
              '    mqtt_inventory = None\n    mqtt_health = None\n    mqtt_discovery = None\n    cloud_request_inventory = None\n',
              1,
          )
          diag = diag.replace(
              '    if mqtt_bridge is not None and hasattr(mqtt_bridge, "diagnostic_health"):\n        mqtt_health = mqtt_bridge.diagnostic_health()\n',
              '    if mqtt_bridge is not None and hasattr(mqtt_bridge, "diagnostic_health"):\n'
              '        mqtt_health = mqtt_bridge.diagnostic_health()\n'
              '    if mqtt_bridge is not None and hasattr(mqtt_bridge, "diagnostic_discovery"):\n'
              '        mqtt_discovery = mqtt_bridge.diagnostic_discovery()\n'
              '    if hasattr(coordinator.client, "discovery_inventory"):\n'
              '        cloud_request_inventory = coordinator.client.discovery_inventory()\n',
              1,
          )
          diag = diag.replace(
              '        "mqtt_inventory": sanitize(deepcopy(mqtt_inventory)),\n',
              '        "mqtt_inventory": sanitize(deepcopy(mqtt_inventory)),\n'
              '        "mqtt_discovery": sanitize(deepcopy(mqtt_discovery)),\n'
              '        "cloud_request_inventory": sanitize(deepcopy(cloud_request_inventory)),\n',
              1,
          )
          diag = diag.replace(
              '            "command_status_at_export is a read-only status lookup for the stored command number.",\n',
              '            "command_status_at_export is a read-only status lookup for the stored command number.",\n'
              '            "Passive discovery is opt-in and current-mower scoped; samples are bounded and sanitized.",\n'
              '            "Private-cloud request inventory covers only calls made by this integration and does not intercept mobile-app traffic.",\n',
              1,
          )
          diag_path.write_text(diag, encoding='utf-8')

          for name in ('strings.json', 'translations/en.json'):
              path = COMPONENT / name
              data = json.loads(path.read_text(encoding='utf-8'))
              general = data['options']['step']['general']
              general['data']['passive_discovery'] = 'Passive protocol discovery'
              general['data_description']['passive_discovery'] = (
                  'Temporarily subscribe to all MQTT downlink topics for this mower and retain '
                  'bounded sanitized samples plus private-cloud response schemas in diagnostics. '
                  'Enable only while investigating vendor notifications, camera or LiDAR features.'
              )
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest_path = COMPONENT / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.4.1-beta5'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          changelog = (ROOT / 'CHANGELOG.md').read_text(encoding='utf-8')
          entry = '''## 0.4.1-beta5 - passive protocol discovery

- Add an opt-in Passive protocol discovery option for temporary vendor-protocol investigation.
- Subscribe to the current mower's `/downlink/vehicle/<device>/#` MQTT wildcard while discovery is enabled.
- Keep current-device-only topic/key inventory and up to three bounded sanitized samples per topic.
- Add `navimower.mark_discovery_event` timestamps for correlating app actions such as notifications, camera and LiDAR views.
- Record value-free private-cloud request/response schema inventory for calls made by Navimower.
- Add notification, event, push, stream, WebRTC, RTSP and LiDAR-oriented diagnostics keywords.
- Preserve the existing account-wide MQTT inventory separately; discovery never makes stale pose appear fresh and does not change mower control.

'''
          if entry not in changelog:
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          (ROOT / 'CHANGELOG.md').write_text(changelog, encoding='utf-8')

          notes_path = ROOT / '.github' / 'release-notes' / '0.4.1-beta5.md'
          notes_path.write_text('''title: Navimower 0.4.1-beta5

## Passive protocol discovery

This beta adds a temporary opt-in discovery mode for investigating vendor features that are not yet mapped, especially cloud notifications, camera endpoints and possible LiDAR/obstacle data.

- Enable **Passive protocol discovery** in Navimower options. The options flow reloads the integration so the MQTT bridge can subscribe to the current mower's `/downlink/vehicle/<device>/#` wildcard.
- Existing account-wide MQTT inventory is preserved. A separate **current-device-only** discovery inventory records topic counts, key paths, observed type/event values and up to three bounded sanitized payload samples per topic.
- Credentials, account/device identifiers, GPS fields, URL query strings and large opaque values are redacted or summarized before samples reach diagnostics.
- New service `navimower.mark_discovery_event` stores a named UTC marker. Use labels such as `before_notification`, `opened_camera`, `after_camera` or `lidar_view`, then download diagnostics after the test.
- Private-cloud calls made by Navimower now keep a value-free response schema inventory while discovery is enabled. This does **not** sniff or intercept traffic generated only by the mobile app.
- Diagnostics keyword discovery now also highlights notification/event/push and camera-stream related names.

Discovery is **off by default** and does not change mower commands, telemetry selection, pose freshness or gate safety. Beta4 pose-degraded recovery behaviour remains unchanged.

This is a prerelease intended for targeted protocol discovery before stable 0.4.1.
''', encoding='utf-8')

          beta4 = ROOT / 'tests' / 'test_v041_beta4.py'
          beta4_text = beta4.read_text(encoding='utf-8')
          beta4_text = beta4_text.replace(
              '    assert manifest["version"] == "0.4.1-beta4"\n',
              '    assert manifest["version"].startswith("0.4.1-beta")\n',
              1,
          )
          beta4.write_text(beta4_text, encoding='utf-8')

          (ROOT / 'tests' / 'test_v041_beta5.py').write_text(r'''"""Regression contracts for Navimower 0.4.1-beta5 passive discovery."""
          from __future__ import annotations

          import importlib.util
          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          COMPONENT = ROOT / "custom_components" / "navimower"


          def _load_discovery():
              path = COMPONENT / "discovery.py"
              spec = importlib.util.spec_from_file_location("navimower_discovery_test", path)
              module = importlib.util.module_from_spec(spec)
              assert spec and spec.loader
              spec.loader.exec_module(module)
              return module


          def test_beta5_version_and_notes():
              manifest = json.loads((COMPONENT / "manifest.json").read_text())
              assert manifest["version"] == "0.4.1-beta5"
              notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta5.md").read_text()
              assert "Passive protocol discovery" in notes
              assert "current-device-only" in notes
              assert "off by default" in notes


          def test_discovery_topic_is_current_mower_only():
              discovery = _load_discovery()
              assert discovery.mqtt_discovery_topic("ABC123") == "/downlink/vehicle/ABC123/#"


          def test_discovery_samples_redact_secrets_and_url_queries():
              discovery = _load_discovery()
              payload = json.dumps({
                  "eventCode": 2102,
                  "token": "secret-token",
                  "device_id": "secret-device",
                  "url": "https://camera.example/live/path?signature=secret",
                  "message": "camera ready",
              }).encode()
              sample = discovery.sanitize_discovery_payload(payload)
              assert sample["eventCode"] == 2102
              assert sample["token"] == "<redacted>"
              assert sample["device_id"] == "<redacted>"
              assert sample["url"] == "https://camera.example/live/path"
              assert sample["message"] == "camera ready"


          def test_structure_summary_keeps_schema_not_ordinary_values():
              discovery = _load_discovery()
              summary = discovery.structure_summary({"type": 7, "nested": {"cameraUrl": "secret"}})
              assert "nested.cameraUrl" in summary["key_paths"]
              assert "type=7" in summary["observed_type_values"]
              assert "secret" not in repr(summary)


          def test_beta5_option_service_and_diagnostics_are_wired():
              const = (COMPONENT / "const.py").read_text()
              flow = (COMPONENT / "config_flow.py").read_text()
              mqtt = (COMPONENT / "mqtt.py").read_text()
              services = (COMPONENT / "services.py").read_text()
              diagnostics = (COMPONENT / "diagnostics_export.py").read_text()
              client = (COMPONENT / "api" / "client.py").read_text()
              assert 'OPT_PASSIVE_DISCOVERY: Final = "passive_discovery"' in const
              assert "DEFAULT_PASSIVE_DISCOVERY: Final = False" in const
              assert "OPT_PASSIVE_DISCOVERY" in flow
              assert "mqtt_discovery_topic(device_id)" in mqtt
              assert "diagnostic_discovery" in mqtt
              assert "mark_discovery_event" in services
              assert '"mqtt_discovery"' in diagnostics
              assert '"cloud_request_inventory"' in diagnostics
              assert "discovery_inventory" in client
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')
          PY

      - name: Validate full test suite
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/navimower
          python -m pip install --upgrade pytest voluptuous cryptography
          python -m pytest -q

      - name: Commit and publish beta5
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/beta5-passive-discovery-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Navimower 0.4.1-beta5"
          git push origin HEAD:main
          gh release create v0.4.1-beta5 \
            --prerelease \
            --title "Navimower 0.4.1-beta5" \
            --notes-file .github/release-notes/0.4.1-beta5.md
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Report beta5 result
        if: always()
        shell: bash
        run: |
          {
            echo "beta5 passive discovery workflow: ${{ job.status }}"
            echo "tests: ${{ steps.tests.outcome }}"
            echo "head: $(git rev-parse HEAD 2>/dev/null || true)"
          } | gh issue comment "${{ github.event.issue.number }}" --body-file - || true
