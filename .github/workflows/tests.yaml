name: Test Navimower

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: write

jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography

      - name: Compile integration
        run: python -m compileall -q custom_components/navimower

      - name: Run regression tests
        run: python -m pytest -q

  build_beta2:
    if: github.event_name == 'pull_request' && github.event.action == 'reopened' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/0.4.1-beta2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build clean beta2 from beta1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/0.4.1-beta2
          git show origin/release/0.4.1-beta2:.github/workflows/beta2-prep-temp.yaml > /tmp/beta2-patch.yaml
          git checkout -B release/0.4.1-beta2 75aa6ce2bdae2cc70f8335abefda61cf842109e4
          python - <<'PY'
          from pathlib import Path
          workflow = Path('/tmp/beta2-patch.yaml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(script, 'beta2-patch.yaml', 'exec'))
          PY
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_history_merge.py')
          s = p.read_text(encoding='utf-8')
          old = '''    # The vendor can publish the reset during the brief non-cutting handover
    # between two scheduled passes. The old route must still be finalized.
    assert manager.prepare_cycle(reset, pose_time=2_200_000_020) is True
    assert manager._active_id is None

    manager.process_pose(
        position={"x": 1.2, "y": 1.2},
        pose_time=2_200_000_021,
        heading=0.1,
        activity="mowing",
        cutting=True,
        docked=False,
        returning=False,
        zone_ids=[24],
    )
    second_id = manager._active_id
    assert second_id and second_id != first_id
    assert len(manager._sessions) == 2
    first = manager._cache[first_id]
    assert first["completed"] is True
    assert first["completion_reason"] == "vendor_cycle_reset"
    assert first["final_progress"] == {"24": 98}
    assert not history._sessions_can_merge(first, manager._cache[second_id])
    zone_history = manager.zone_history()["24"]
'''
          new = '''    reset["active_zone_progress_zone_id"] = 24
    assert manager.prepare_cycle(reset, pose_time=2_200_000_020) is True
    assert manager._active_id == first_id

    manager.process_pose(
        position={"x": 1.2, "y": 1.2},
        pose_time=2_200_000_021,
        heading=0.1,
        activity="mowing",
        cutting=True,
        docked=False,
        returning=False,
        zone_ids=[24],
    )
    assert manager._active_id == first_id
    assert len(manager._sessions) == 1
    first = manager._cache[first_id]
    assert first["completed"] is None
    assert first["completion_reason"] is None
    boundaries = first.get("zone_cycle_boundaries") or []
    assert len(boundaries) == 1
    assert boundaries[0]["zone_id"] == 24
    assert boundaries[0]["previous_peak"] == 98
    zone_history = manager.zone_history()["24"]
'''
          if old not in s:
              raise SystemExit('cycle reset regression block missing')
          s = s.replace(old, new, 1)
          old = '''    assert manager.prepare_cycle(high, pose_time=2_250_000_010) is False
    assert manager.prepare_cycle(low, pose_time=2_250_000_020) is True
    assert manager._active_id is None
    assert stub_id not in manager._cache
    assert manager._sessions == []
    manager.process_pose(
'''
          new = '''    assert manager.prepare_cycle(high, pose_time=2_250_000_010) is False
    low["active_zone_progress_zone_id"] = 24
    assert manager.prepare_cycle(low, pose_time=2_250_000_020) is True
    assert manager._active_id == stub_id
    assert stub_id in manager._cache
    assert len(manager._sessions) == 1
    manager.process_pose(
'''
          if old not in s:
              raise SystemExit('provisional reset regression block missing')
          s = s.replace(old, new, 1)
          old = '''    assert len(manager._sessions) == 1
    if hass.tasks:
'''
          new = '''    assert len(manager._sessions) == 1
    assert manager._active_id == stub_id
    assert (manager._cache[stub_id].get("zone_cycle_boundaries") or [])[0]["zone_id"] == 24
    if hass.tasks:
'''
          if old not in s:
              raise SystemExit('provisional final regression block missing')
          s = s.replace(old, new, 1)
          old = '''        active_zone_progress=97,
    )
'''
          new = '''        active_zone_progress=97,
        active_progress_zone_id=13,
    )
'''
          if old not in s:
              raise SystemExit('completion owner regression block missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/test_v041_beta2.py')
          s = p.read_text(encoding='utf-8')
          p.write_text(s.replace('split("snapshot["coverage"]", 1)', "split('snapshot[\"coverage\"]', 1)"), encoding='utf-8')
          PY
          python -m compileall -q custom_components/navimower
          python -m pip install --upgrade pytest voluptuous cryptography
          python -m pytest -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Navimower 0.4.1-beta2"
          git push --force origin HEAD:release/0.4.1-beta2
