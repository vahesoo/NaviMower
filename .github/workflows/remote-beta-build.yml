name: Remote beta build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA20 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta20
      BUILD_BASE: bc71aa93993b663ee7890a040b65132c727f7208
      HELPER_BRANCH: agent/prepare-0.4.3-beta20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Build and validate beta
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta-build.log) 2>&1
          set -euo pipefail

          git fetch origin "${HELPER_BRANCH}" "${BUILD_BRANCH}"
          git show "origin/${HELPER_BRANCH}:.github/scripts/prepare_beta20.py" > /tmp/prepare_beta20.py
          git show "origin/${HELPER_BRANCH}:.github/scripts/prepare_beta20_postpatch.py" > /tmp/prepare_beta20_postpatch.py

          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/prepare_beta20.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    dedent(new_zone_history).lstrip("\\n"),\n',
              '    new_zone_history.lstrip("\\n"),\n',
              1,
          )
          text = text.replace(
              '    dedent(beta20_runtime_tests).lstrip("\\n") + "\\n\\nasync def explicit_partial_reset_test() -> None:\\n",\n',
              '    dedent(beta20_runtime_tests).lstrip("\\n") + "\\n\\n",\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

          git checkout -B "${BUILD_BRANCH}" "${BUILD_BASE}"
          python /tmp/prepare_beta20.py
          python /tmp/prepare_beta20_postpatch.py

          python -m compileall -q custom_components/navimower
          python -m pytest -q
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          expected = {
              '.github/release-notes/0.4.3-beta20.md',
              'CHANGELOG.md',
              'custom_components/navimower/coordinator.py',
              'custom_components/navimower/diagnostics.py',
              'custom_components/navimower/history.py',
              'custom_components/navimower/location.py',
              'custom_components/navimower/manifest.json',
              'custom_components/navimower/zone_state.py',
              'tests/test_history_merge.py',
              'tests/test_mqtt_telemetry.py',
              'tests/test_v034_beta3.py',
              'tests/test_v043_beta19.py',
              'tests/test_v043_beta20.py',
          }
          changed = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          ) | set(
              subprocess.check_output(
                  ['git', 'ls-files', '--others', '--exclude-standard'], text=True
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(f'Unexpected beta20 diff scope: {sorted(changed)}')

          manifest = json.loads(Path('custom_components/navimower/manifest.json').read_text())
          assert manifest['version'] == '0.4.3-beta20'
          history = Path('custom_components/navimower/history.py').read_text()
          coordinator = Path('custom_components/navimower/coordinator.py').read_text()
          assert '_COMPLETION_EVIDENCE_MAX_AGE_SECONDS = 30.0' in history
          assert 'last_completed_source' in history
          assert 'last_completed_confirmation' in history
          assert 'guarded_large_progress_jump' in history
          assert 'waiting_for_second_fresh_sample' in history
          assert '_mqtt_work_progress_last_update' in coordinator
          assert '_mqtt_route_progress_last_update' in coordinator
          assert '_mqtt_task_progress_last_update' in coordinator
          assert 'completed=self._session_completed(snapshot) if docked else None' not in coordinator
          dock = history[
              history.index('            if docked and not cutting:'):
              history.index('    # Backward-compatible alias')
          ]
          assert 'last_completed_at' not in dock
          assert '_finish_active_locked' in dock
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes/0.4.3-beta20.md \
                  CHANGELOG.md \
                  custom_components/navimower/coordinator.py \
                  custom_components/navimower/diagnostics.py \
                  custom_components/navimower/history.py \
                  custom_components/navimower/location.py \
                  custom_components/navimower/manifest.json \
                  custom_components/navimower/zone_state.py \
                  tests/test_history_merge.py \
                  tests/test_mqtt_telemetry.py \
                  tests/test_v034_beta3.py \
                  tests/test_v043_beta19.py \
                  tests/test_v043_beta20.py
          git commit -m "Prepare Navimower 0.4.3-beta20 completion arbitration"
          git push --force origin "${BUILD_BRANCH}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "0.4.3-beta20 remote build succeeded. Full pytest, compileall, diff-check, exact diff-scope and focused completion/source-freshness checks passed; branch \`${BUILD_BRANCH}\` was pushed at \`${{ steps.build.outputs.commit }}\`."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Comment failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          tail -n 260 /tmp/remote-beta-build.log > /tmp/build-tail.txt || true
          {
            echo '0.4.3-beta20 remote build failed before publishing the completed release branch.'
            echo
            echo '```text'
            cat /tmp/build-tail.txt
            echo '```'
          } > /tmp/failure-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/failure-comment.md
          exit 1
