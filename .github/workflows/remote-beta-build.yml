name: Remote beta build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA18 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Build and validate beta
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta-build.log) 2>&1
          set -euo pipefail
          git checkout -B "${BUILD_BRANCH}" origin/main

          # Keep the beta18 retry correction build-local: generated methods must
          # retain their class indentation. The helper is restored before scope checks.
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/remote_beta_builder.py")
          text = path.read_text(encoding="utf-8")
          old = 'path.write_text(text[:a] + dedent(replacement).lstrip("\\n") + text[b:], encoding="utf-8")'
          new = 'path.write_text(text[:a] + replacement.lstrip("\\n") + text[b:], encoding="utf-8")'
          if text.count(old) != 1:
              raise SystemExit("beta18 replace_section retry marker changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python .github/scripts/remote_beta_builder.py

          # Preserve reset-boundary evidence until completion cleanup has used it.
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/navimower/history.py")
          text = path.read_text(encoding="utf-8")
          old = '''        await self._async_merge_adjacent_sessions()\n        await self._async_remove_empty_completed_sessions()\n        await self._async_repair_unverified_zone_completions()\n        await self._async_migrate_legacy_store()\n'''
          new = '''        await self._async_merge_adjacent_sessions()\n        await self._async_repair_unverified_zone_completions()\n        await self._async_remove_empty_completed_sessions()\n        await self._async_migrate_legacy_store()\n'''
          if text.count(old) != 1:
              raise SystemExit("beta18 generated completion repair order marker changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git checkout -- .github/scripts/remote_beta_builder.py
          python -m pytest -q
          python -m compileall -q custom_components/navimower
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              ".github/release-notes/0.4.3-beta18.md",
              "CHANGELOG.md",
              "custom_components/navimower/coordinator.py",
              "custom_components/navimower/history.py",
              "custom_components/navimower/manifest.json",
              "tests/test_history_merge.py",
              "tests/test_v043_beta17.py",
              "tests/test_v043_beta18.py",
          }
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          unstaged = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          changed = committed | unstaged | untracked
          if changed != expected:
              raise SystemExit(f"Unexpected beta18 diff scope: {sorted(changed)}")

          history = Path("custom_components/navimower/history.py").read_text(encoding="utf-8")
          coordinator = Path("custom_components/navimower/coordinator.py").read_text(encoding="utf-8")
          assert '"task_zone_seen_incomplete"' in history
          assert '"task_zone_completion_confirmed"' in history
          assert "_async_repair_unverified_zone_completions" in history
          assert '"vendor_completed_at": (' in coordinator
          start = history.index("    def prepare_cycle(\n")
          end = history.index("    def cycle_diagnostics", start)
          assert '"last_completed_at"' not in history[start:end]
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes/0.4.3-beta18.md \
                  CHANGELOG.md \
                  custom_components/navimower/coordinator.py \
                  custom_components/navimower/history.py \
                  custom_components/navimower/manifest.json \
                  tests/test_history_merge.py \
                  tests/test_v043_beta17.py \
                  tests/test_v043_beta18.py
          git commit -m "Prepare Navimower 0.4.3-beta18 completion safety"
          git push origin "${BUILD_BRANCH}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "0.4.3-beta18 remote build succeeded. Full tests, compileall, diff-check, exact diff-scope and focused completion-safety checks passed; branch \`${BUILD_BRANCH}\` was pushed at \`${{ steps.build.outputs.commit }}\`."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Comment failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          tail -n 260 /tmp/remote-beta-build.log > /tmp/build-tail.txt || true
          {
            echo '0.4.3-beta18 remote build failed before publishing the completed release branch.'
            echo
            echo '```text'
            cat /tmp/build-tail.txt
            echo '```'
          } > /tmp/failure-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/failure-comment.md
          exit 1
