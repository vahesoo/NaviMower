name: Remote beta build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA2 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build and validate beta
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta-build.log) 2>&1
          set -euo pipefail
          git checkout -B "${BUILD_BRANCH}" origin/main

          cat > /tmp/apply_beta.py <<'PY'
          from __future__ import annotations

          import json
          import textwrap
          from pathlib import Path

          ROOT = Path.cwd()
          COMPONENT = ROOT / "custom_components" / "navimower"

          manifest_path = COMPONENT / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "0.4.3-beta1":
              raise SystemExit(
                  f"Expected 0.4.3-beta1 base, got {manifest.get('version')!r}"
              )
          manifest["version"] = "0.4.3-beta2"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          discovery_path = COMPONENT / "maintenance_h5_discovery.py"
          discovery = discovery_path.read_text(encoding="utf-8")

          replacements = {
              r'r"<script\\b[^>]*\\bsrc\\s*=\\s*[\"\']([^\"\']+)[\"\']"': r'r"<script\b[^>]*\bsrc\s*=\s*[\"\']([^\"\']+)[\"\']"',
              r'r"[\"\']([^\"\'\\r\\n]{1,420}\\.js(?:\\?[^\"\'\\r\\n]{0,120})?)[\"\']"': r'r"[\"\']([^\"\'\r\n]{1,420}\.js(?:\?[^\"\'\r\n]{0,120})?)[\"\']"',
              r'r"[\"\'](/mowerbot/[^\"\'\\r\\n]{1,280})[\"\']"': r'r"[\"\'](/mowerbot/[^\"\'\r\n]{1,280})[\"\']"',
              r'r"method\\s*:\\s*[\"\']?(GET|POST|PUT|DELETE|PATCH)[\"\']?"': r'r"method\s*:\s*[\"\']?(GET|POST|PUT|DELETE|PATCH)[\"\']?"',
              r'r"skipEncryption\\s*:\\s*(true|false)"': r'r"skipEncryption\s*:\s*(true|false)"',
              r'r"(?:^|[,{])\\s*[\"\']?([A-Za-z_$][\\w$]{0,90})[\"\']?\\s*:"': r'r"(?:^|[,{])\s*[\"\']?([A-Za-z_$][\w$]{0,90})[\"\']?\s*:"',
              r'r"(?P<callee>(?:[A-Za-z_$][\\w$]*\\.)*(?:sendEncryptionData|callNative|sendMessageToNative))"': r'r"(?P<callee>(?:[A-Za-z_$][\w$]*\.)*(?:sendEncryptionData|callNative|sendMessageToNative))"',
              r'r"\\s*\\(\\s*[\"\'](?P<method>[^\"\']{1,160})[\"\']"': r'r"\s*\(\s*[\"\'](?P<method>[^\"\']{1,160})[\"\']"',
              r'r"\\s+"': r'r"\s+"',
              "NavimowerDiagnostics/0.4.3-beta1": "NavimowerDiagnostics/0.4.3-beta2",
              "0.4.3-beta1 records bounded public H5 source context only.": "0.4.3-beta2 records bounded public H5 source context only.",
          }
          for old, new in replacements.items():
              if old not in discovery:
                  raise SystemExit(f"maintenance discovery replacement marker missing: {old}")
              discovery = discovery.replace(old, new)
          discovery_path.write_text(discovery, encoding="utf-8")

          diagnostics_path = COMPONENT / "diagnostics.py"
          diagnostics = diagnostics_path.read_text(encoding="utf-8")
          diagnostics = diagnostics.replace(
              "0.4.3-beta1 additionally performs a bounded read-only public-H5 inspection",
              "0.4.3-beta2 performs the corrected bounded read-only public-H5 inspection",
          )
          diagnostics = diagnostics.replace(
              "0.4.3-beta1 additionally performs bounded public H5 Maintenance & Tools discovery.",
              "0.4.3-beta2 performs corrected bounded public H5 Maintenance & Tools discovery.",
          )
          diagnostics_path.write_text(diagnostics, encoding="utf-8")

          notes = '''title: Navimower 0.4.3-beta2

          Navimower 0.4.3-beta2 is a focused hotfix for the Maintenance & Tools discovery introduced in beta1.

          ### Fixed: Download diagnostics registration

          - Fixed an import-time `re.PatternError` in `maintenance_h5_discovery.py` caused by over-escaped generated regular expressions.
          - The failed diagnostics-module import prevented Home Assistant from detecting Navimower diagnostics support, so **Download diagnostics** disappeared from the device/config-entry menu in beta1.
          - Corrected the escaping of every H5 discovery regex, not only the pattern that raised immediately. The remaining beta1 expressions compiled but matched literal backslashes instead of the intended JavaScript syntax and therefore would not have produced useful discovery data.
          - Corrected whitespace normalization for captured JavaScript context for the same reason.

          ### Regression protection

          - Added a test that extracts and compiles every `re.compile(...)` pattern from the discovery module, so malformed import-time regexes are caught in CI instead of relying on Python `compileall` alone.
          - Added direct assertions for the intended regex syntax and beta2 diagnostics wiring.

          ### Scope

          Beta2 otherwise keeps the beta1 plan unchanged: Download diagnostics performs bounded public unauthenticated H5 discovery only when explicitly requested. No blade reset, maintenance-mode command, cutting-height mutation or other mower control is executed.
          '''
          (ROOT / ".github" / "release-notes" / "0.4.3-beta2.md").write_text(
              textwrap.dedent(notes), encoding="utf-8"
          )

          changelog_path = ROOT / "CHANGELOG.md"
          changelog = changelog_path.read_text(encoding="utf-8")
          header = "# Changelog\n\n"
          if not changelog.startswith(header):
              raise SystemExit("Unexpected changelog header")
          section = '''## 0.4.3-beta2

          Focused hotfix for beta1 Maintenance & Tools H5 discovery.

          ### Fixed

          - Fixed the import-time malformed `BRIDGE_RE` expression that prevented Home Assistant from loading `diagnostics.py` and therefore hid Download diagnostics.
          - Fixed over-escaping across all Maintenance H5 regexes and JavaScript whitespace normalization so discovery matches actual H5 source rather than literal backslashes.

          ### Validation

          - Added regression coverage that compiles every `re.compile(...)` expression from the discovery module and checks the intended regex syntax.
          - Maintenance discovery remains read-only and Download-diagnostics-only; no maintenance mutation is added in beta2.

          '''
          changelog_path.write_text(
              header + textwrap.dedent(section) + changelog[len(header):],
              encoding="utf-8",
          )

          test_content = r'''"""Regression contracts for Navimower 0.4.3-beta2 diagnostics hotfix."""
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path
          import re

          ROOT = Path(__file__).resolve().parents[1]
          COMPONENT = ROOT / "custom_components" / "navimower"


          def test_beta2_version_and_notes() -> None:
              manifest = json.loads((COMPONENT / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["version"] == "0.4.3-beta2"
              notes = (ROOT / ".github" / "release-notes" / "0.4.3-beta2.md").read_text(encoding="utf-8")
              assert notes.startswith("title: Navimower 0.4.3-beta2")
              assert "Download diagnostics" in notes
              assert "re.PatternError" in notes
              assert "literal backslashes" in notes


          def test_beta2_all_discovery_regexes_compile() -> None:
              source = (COMPONENT / "maintenance_h5_discovery.py").read_text(encoding="utf-8")
              tree = ast.parse(source)
              patterns: list[str] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  if not (
                      isinstance(node.func, ast.Attribute)
                      and isinstance(node.func.value, ast.Name)
                      and node.func.value.id == "re"
                      and node.func.attr == "compile"
                  ):
                      continue
                  assert node.args
                  pattern_node = node.args[0]
                  if isinstance(pattern_node, ast.Constant) and isinstance(pattern_node.value, str):
                      pattern = pattern_node.value
                  elif isinstance(pattern_node, ast.BinOp):
                      pattern = ast.literal_eval(pattern_node)
                  else:
                      raise AssertionError(f"Unsupported regex AST: {ast.dump(pattern_node)}")
                  patterns.append(pattern)
                  re.compile(pattern)
              assert len(patterns) >= 7


          def test_beta2_discovery_patterns_target_real_javascript_syntax() -> None:
              source = (COMPONENT / "maintenance_h5_discovery.py").read_text(encoding="utf-8")
              assert r'r"<script\b' in source
              assert r'r"method\s*:\s*' in source
              assert r'r"skipEncryption\s*:\s*' in source
              assert r'r"\s*\(\s*' in source
              assert r'r"\s+"' in source
              assert r'r"<script\\b' not in source
              assert r'r"\\s*\\(' not in source
              assert "NavimowerDiagnostics/0.4.3-beta2" in source


          def test_beta2_diagnostics_still_uses_read_only_maintenance_probe() -> None:
              diagnostics = (COMPONENT / "diagnostics.py").read_text(encoding="utf-8")
              discovery = (COMPONENT / "maintenance_h5_discovery.py").read_text(encoding="utf-8")
              assert "from .maintenance_h5_discovery import probe_maintenance_h5" in diagnostics
              assert "await hass.async_add_executor_job" in diagnostics
              assert '"maintenance_h5_discovery": maintenance_h5_discovery' in diagnostics
              assert '"mutation_calls_executed": False' in discovery
              assert "client.call(" not in discovery
          '''
          (ROOT / "tests" / "test_v043_beta2.py").write_text(
              textwrap.dedent(test_content), encoding="utf-8"
          )
          PY

          python /tmp/apply_beta.py
          python -m pip install --upgrade pytest voluptuous cryptography pyyaml
          python -m compileall -q custom_components/navimower
          python -m pytest -q

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/navimower/manifest.json \
            custom_components/navimower/diagnostics.py \
            custom_components/navimower/maintenance_h5_discovery.py \
            .github/release-notes/0.4.3-beta2.md \
            CHANGELOG.md \
            tests/test_v043_beta2.py
          git commit -m "Prepare Navimower 0.4.3-beta2 diagnostics hotfix"

          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${BUILD_BRANCH}" | awk '{print $1}')"
          if [ -n "${REMOTE_SHA}" ]; then
            git push \
              --force-with-lease="refs/heads/${BUILD_BRANCH}:${REMOTE_SHA}" \
              origin "HEAD:refs/heads/${BUILD_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${BUILD_BRANCH}"
          fi

      - name: Report result
        if: always()
        shell: bash
        run: |
          {
            echo "Navimower 0.4.3-beta2 remote build outcome: ${{ steps.build.outcome }}"
            echo
            echo "Target branch: \`${BUILD_BRANCH}\`"
            echo
            echo '```text'
            tail -n 180 /tmp/remote-beta-build.log 2>/dev/null || true
            echo '```'
          } > /tmp/result.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/result.md

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
