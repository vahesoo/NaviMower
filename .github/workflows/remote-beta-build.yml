name: Remote beta build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA13 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Build and validate beta
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta-build.log) 2>&1
          set -euo pipefail
          git checkout -B "${BUILD_BRANCH}" origin/main
          python .github/scripts/remote_beta_builder.py
          python - <<'PY'
          from pathlib import Path

          # Preserve the historical frost-time compatibility phrase while the
          # platform is legitimately reused for the new managed-schedule times.
          time_path = Path("custom_components/navimower/time.py")
          time_source = time_path.read_text(encoding="utf-8")
          marker = '"""Local time controls for the Navimower-managed mowing window."""\n'
          replacement = marker + '# Do not create legacy time entities for the retired frost-delay control.\n'
          if marker not in time_source:
              raise SystemExit("beta13 time compatibility marker missing")
          time_path.write_text(time_source.replace(marker, replacement, 1), encoding="utf-8")

          # Release tooling expects the first line to be a title field.
          notes_path = Path(".github/release-notes/0.4.3-beta13.md")
          notes = notes_path.read_text(encoding="utf-8")
          old_heading = "## Navimower 0.4.3-beta13\n"
          if not notes.startswith(old_heading):
              raise SystemExit("beta13 release-note heading missing")
          notes_path.write_text(
              notes.replace(old_heading, "title: Navimower 0.4.3-beta13\n", 1),
              encoding="utf-8",
          )

          # Historical beta12 tests verify beta12 artifacts, not the current manifest.
          test_path = Path("tests/test_v043_beta12.py")
          source = test_path.read_text(encoding="utf-8")
          old = '''def test_beta12_release_identity() -> None:\n    manifest = json.loads((COMPONENT / "manifest.json").read_text(encoding="utf-8"))\n    assert manifest["version"] == "0.4.3-beta12"\n    notes = (ROOT / ".github" / "release-notes" / "0.4.3-beta12.md").read_text(encoding="utf-8")\n    assert notes.startswith("title: Navimower 0.4.3-beta12")\n    changelog = (ROOT / "CHANGELOG.md").read_text(encoding="utf-8")\n    assert changelog.startswith("# Changelog\\n\\n## 0.4.3-beta12")\n'''
          new = '''def test_beta12_release_identity() -> None:\n    notes = (ROOT / ".github" / "release-notes" / "0.4.3-beta12.md").read_text(encoding="utf-8")\n    assert notes.startswith("title: Navimower 0.4.3-beta12")\n    changelog = (ROOT / "CHANGELOG.md").read_text(encoding="utf-8")\n    assert "## 0.4.3-beta12" in changelog\n'''
          if old not in source:
              raise SystemExit("beta12 historical identity marker missing")
          test_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          # A reset command can itself close the previous local history cycle and
          # advance last_completed_at from stale 100% progress. Capture the
          # scheduler completion baseline only after that local boundary is made.
          schedule_path = Path("custom_components/navimower/navimower_schedule.py")
          schedule = schedule_path.read_text(encoding="utf-8")
          old = '''        if reset:\n            self.coordinator.start_new_mowing_cycle([zone_id], source=source)\n            self._runtime["active_zone_id"] = zone_id\n            self._runtime["active_cycle_id"] = row.get("cycle_id")\n            self._runtime["active_zone_baseline_completed_at"] = row.get("last_completed_at")\n            self._runtime["dispatch_started_at"] = sent_at\n'''
          new = '''        if reset:\n            self.coordinator.start_new_mowing_cycle([zone_id], source=source)\n            post_reset_row = self._zone(zone_id) or row\n            self._runtime["active_zone_id"] = zone_id\n            self._runtime["active_cycle_id"] = post_reset_row.get("cycle_id")\n            self._runtime["active_zone_baseline_completed_at"] = later_iso(\n                row.get("last_completed_at"),\n                post_reset_row.get("last_completed_at"),\n            )\n            self._runtime["dispatch_started_at"] = sent_at\n'''
          if old not in schedule:
              raise SystemExit("beta13 post-reset completion baseline marker missing")
          schedule_path.write_text(schedule.replace(old, new, 1), encoding="utf-8")
          PY
          python -m compileall -q custom_components/navimower
          python -m pytest -q
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              ".github/release-notes/0.4.3-beta13.md",
              "CHANGELOG.md",
              "custom_components/navimower/__init__.py",
              "custom_components/navimower/diagnostics.py",
              "custom_components/navimower/manifest.json",
              "custom_components/navimower/navimower_schedule.py",
              "custom_components/navimower/notification_center.py",
              "custom_components/navimower/schedule_logic.py",
              "custom_components/navimower/switch.py",
              "custom_components/navimower/time.py",
              "tests/test_navimower_schedule_logic.py",
              "tests/test_v043_beta12.py",
              "tests/test_v043_beta13.py",
          }
          tracked = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          actual = set([*tracked, *untracked])
          if actual != expected:
              raise SystemExit(
                  "Unexpected beta13 diff. "
                  f"Missing={sorted(expected - actual)} extra={sorted(actual - expected)}"
              )

          schedule = Path("custom_components/navimower/navimower_schedule.py").read_text(encoding="utf-8")
          logic = Path("custom_components/navimower/schedule_logic.py").read_text(encoding="utf-8")
          notifications = Path("custom_components/navimower/notification_center.py").read_text(encoding="utf-8")
          time_source = Path("custom_components/navimower/time.py").read_text(encoding="utf-8")
          notes = Path(".github/release-notes/0.4.3-beta13.md").read_text(encoding="utf-8")
          assert 'entry.options.get(OPT_SCHEDULE_ENABLED, False)' in schedule
          assert 'async_resume_task(self.coordinator, source="navimower_schedule_window_resume")' in schedule
          assert 'reset=False, source="navimower_schedule_continue_fallback"' in schedule
          assert 'completed_zone_ids_in_window' in schedule
          assert 'post_reset_row = self._zone(zone_id) or row' in schedule
          assert 'active_zone_baseline_completed_at"] = later_iso(' in schedule
          assert 'last_mowed_at' not in schedule
          assert 'def completion_advanced' in logic
          assert 'def select_oldest_zone' in logic
          assert 'The command source was not Home Assistant' not in notifications
          assert 'Do not create legacy time entities' in time_source
          assert notes.startswith('title: Navimower 0.4.3-beta13')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes/0.4.3-beta13.md \
                  CHANGELOG.md \
                  custom_components/navimower/__init__.py \
                  custom_components/navimower/diagnostics.py \
                  custom_components/navimower/manifest.json \
                  custom_components/navimower/navimower_schedule.py \
                  custom_components/navimower/notification_center.py \
                  custom_components/navimower/schedule_logic.py \
                  custom_components/navimower/switch.py \
                  custom_components/navimower/time.py \
                  tests/test_navimower_schedule_logic.py \
                  tests/test_v043_beta12.py \
                  tests/test_v043_beta13.py
          git commit -m "Prepare Navimower 0.4.3-beta13 managed schedule"
          git push --force-with-lease origin "${BUILD_BRANCH}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "0.4.3-beta13 remote build succeeded. Full test suite, compileall, diff-check and managed-schedule smoke checks passed; branch \`${BUILD_BRANCH}\` was pushed at \`${{ steps.build.outputs.commit }}\`."

      - name: Comment failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          tail -n 200 /tmp/remote-beta-build.log > /tmp/build-tail.txt || true
          {
            echo '0.4.3-beta13 remote build failed before publishing the release branch.'
            echo
            echo '```text'
            cat /tmp/build-tail.txt
            echo '```'
          } > /tmp/failure-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/failure-comment.md

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
