name: Remote beta build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA21 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta21
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Build and validate beta
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta-build.log) 2>&1
          set -euo pipefail
          git checkout -B "${BUILD_BRANCH}" origin/main

          python .github/scripts/remote_beta21_builder_fix.py
          python -m pytest -q
          python -m compileall -q custom_components/navimower
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              ".github/release-notes/0.4.3-beta21.md",
              "CHANGELOG.md",
              "custom_components/navimower/history.py",
              "custom_components/navimower/manifest.json",
              "tests/test_history_merge.py",
              "tests/test_v043_beta20.py",
              "tests/test_v043_beta21.py",
          }
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          unstaged = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          changed = committed | unstaged | untracked
          if changed != expected:
              raise SystemExit(f"Unexpected beta21 diff scope: {sorted(changed)}")

          history = Path("custom_components/navimower/history.py").read_text(encoding="utf-8")
          completion = history[
              history.index("    def _confirm_coverage_completions_locked"):
              history.index("    def cycle_diagnostics", history.index("    def _confirm_coverage_completions_locked"))
          ]
          update = history[
              history.index("    def update_zone_history"):
              history.index("    def update_from_snapshot", history.index("    def update_zone_history"))
          ]
          assert 'row.get("pct")' in completion
          assert '"private_zone_coverage"' in completion
          assert 'if progress < 100:' in completion
          assert '"coverage_100_after_incomplete"' in completion
          assert 'relevant = sorted(seen_target | seen_incomplete)' in completion
          assert "mqtt_map_work_position" not in completion
          assert "mqtt_task_percentage" not in completion
          assert "current_cycle_cloud_end" not in history
          assert "waiting_for_second_fresh_sample" not in history
          assert "last_completed_at" not in update
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes/0.4.3-beta21.md \
                  CHANGELOG.md \
                  custom_components/navimower/history.py \
                  custom_components/navimower/manifest.json \
                  tests/test_history_merge.py \
                  tests/test_v043_beta20.py \
                  tests/test_v043_beta21.py
          git commit -m "Prepare Navimower 0.4.3-beta21 coverage completion"
          git push --force-with-lease origin "${BUILD_BRANCH}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "0.4.3-beta21 remote build succeeded. Full pytest, compileall, diff-check, exact diff-scope and coverage-authority checks passed; branch \`${BUILD_BRANCH}\` was pushed at \`${{ steps.build.outputs.commit }}\`."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Comment failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          tail -n 260 /tmp/remote-beta-build.log > /tmp/build-tail.txt || true
          {
            echo '0.4.3-beta21 remote build failed before publishing the completed release branch.'
            echo
            echo '```text'
            cat /tmp/build-tail.txt
            echo '```'
          } > /tmp/failure-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/failure-comment.md
          exit 1
