name: Remote beta build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA23 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Build and validate beta
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta-build.log) 2>&1
          set -euo pipefail
          git checkout -B "${BUILD_BRANCH}" origin/main
          python .github/scripts/remote_beta23_builder.py
          python -m pytest -q
          python -m compileall -q custom_components/navimower
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          expected = {
              ".github/release-notes/0.4.3-beta23.md",
              "CHANGELOG.md",
              "README.md",
              "custom_components/navimower/history.py",
              "custom_components/navimower/manifest.json",
              "tests/test_v043_beta22.py",
              "tests/test_v043_beta23.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          changed |= set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f"Unexpected beta23 diff scope: {sorted(changed)}")

          manifest = json.loads(Path("custom_components/navimower/manifest.json").read_text())
          assert manifest["version"] == "0.4.3-beta23"
          history = Path("custom_components/navimower/history.py").read_text()
          rows = history[history.index("    def _progress_rows"):history.index("    def start_new_cycle")]
          assert 'progress = _as_int(coverage.get("pct"))' in rows
          assert 'detail.get("progress")' not in rows
          assert "corroborated_regression" in history
          readme = Path("README.md").read_text()
          for text in ("## Navimower Schedule", "Time window", "24 hours", "Night mowing", "Rain delay"):
              assert text in readme
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes/0.4.3-beta23.md \
                  CHANGELOG.md README.md \
                  custom_components/navimower/history.py \
                  custom_components/navimower/manifest.json \
                  tests/test_v043_beta22.py tests/test_v043_beta23.py
          git commit -m "Prepare Navimower 0.4.3-beta23 progress stability"
          git push --force origin "${BUILD_BRANCH}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "0.4.3-beta23 remote build succeeded. Full pytest, compileall, diff-check, exact diff-scope and focused progress/README checks passed; branch \`${BUILD_BRANCH}\` was pushed at \`${{ steps.build.outputs.commit }}\`."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Comment failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          tail -n 260 /tmp/remote-beta-build.log > /tmp/build-tail.txt || true
          {
            echo '0.4.3-beta23 remote build failed before publishing the completed release branch.'
            echo
            echo '```text'
            cat /tmp/build-tail.txt
            echo '```'
          } > /tmp/failure-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/failure-comment.md
          exit 1
