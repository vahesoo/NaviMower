name: Remote beta build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA12 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Build and validate beta
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta-build.log) 2>&1
          set -euo pipefail
          git checkout -B "${BUILD_BRANCH}" origin/main
          python .github/scripts/remote_beta_builder.py
          python -m compileall -q custom_components/navimower
          python -m pytest -q
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              ".github/release-notes/0.4.3-beta12.md",
              "CHANGELOG.md",
              "custom_components/navimower/diagnostics.py",
              "custom_components/navimower/error_h5_discovery.py",
              "custom_components/navimower/manifest.json",
              "custom_components/navimower/notification_feed.py",
              "tests/test_v043_beta11.py",
              "tests/test_v043_beta12.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  "Unexpected beta12 diff. "
                  f"Missing={sorted(expected - actual)} extra={sorted(actual - expected)}"
              )

          error_source = Path("custom_components/navimower/error_h5_discovery.py").read_text(encoding="utf-8")
          assert "MAX_PROBE_SECONDS = 24.0" in error_source
          assert "MAX_PREFIX_REQUESTS = 32" in error_source
          assert "MAX_FULL_MATCHES = 6" in error_source
          assert "def _deadline_fetch" in error_source
          assert '"source": "observed_error_command_asset"' in error_source
          diagnostics = Path("custom_components/navimower/diagnostics.py").read_text(encoding="utf-8")
          assert "async with asyncio.timeout(ERROR_DISCOVERY_TIMEOUT_SECONDS):" in diagnostics
          notifications = Path("custom_components/navimower/notification_feed.py").read_text(encoding="utf-8")
          assert "_NOTIFICATION_ATTR_HISTORY_LIMIT = 5" in notifications
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes/0.4.3-beta12.md \
                  CHANGELOG.md \
                  custom_components/navimower/diagnostics.py \
                  custom_components/navimower/error_h5_discovery.py \
                  custom_components/navimower/manifest.json \
                  custom_components/navimower/notification_feed.py \
                  tests/test_v043_beta11.py \
                  tests/test_v043_beta12.py
          git commit -m "Prepare Navimower 0.4.3-beta12 bounded diagnostics"
          git push --force-with-lease origin "${BUILD_BRANCH}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "0.4.3-beta12 remote build succeeded. Full test suite, compileall, diff-check and bounded-diagnostics smoke checks passed; branch \`${BUILD_BRANCH}\` was pushed at \`${{ steps.build.outputs.commit }}\`."

      - name: Comment failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          tail -n 180 /tmp/remote-beta-build.log > /tmp/build-tail.txt || true
          {
            echo '0.4.3-beta12 remote build failed before publishing the release branch.'
            echo
            echo '```text'
            cat /tmp/build-tail.txt
            echo '```'
          } > /tmp/failure-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/failure-comment.md

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
