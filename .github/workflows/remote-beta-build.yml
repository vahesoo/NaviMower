name: Remote beta build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA2 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build and validate beta
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta-build.log) 2>&1
          set -euo pipefail
          git checkout -B "${BUILD_BRANCH}" origin/main

          cat > /tmp/apply_beta.py <<'PY'
          from __future__ import annotations

          import json
          import textwrap
          from pathlib import Path

          ROOT = Path.cwd()
          COMPONENT = ROOT / "custom_components" / "navimower"

          manifest_path = COMPONENT / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "0.4.3-beta1":
              raise SystemExit(
                  f"Expected 0.4.3-beta1 base, got {manifest.get('version')!r}"
              )
          manifest["version"] = "0.4.3-beta2"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          discovery_path = COMPONENT / "maintenance_h5_discovery.py"
          discovery = discovery_path.read_text(encoding="utf-8")
          if 'BRIDGE_RE = re.compile(' not in discovery:
              raise SystemExit("BRIDGE_RE marker missing")
          if "\\\\s*\\\\(" not in discovery:
              raise SystemExit("Expected beta1 double-escaped regex layer is missing")

          # beta1 was generated through an extra raw-string escaping layer. Every
          # regex backslash in this responsibility-isolated discovery module was
          # doubled once too many. Collapse exactly that one layer.
          discovery = discovery.replace("\\\\", "\\")
          discovery = discovery.replace(
              "NavimowerDiagnostics/0.4.3-beta1",
              "NavimowerDiagnostics/0.4.3-beta2",
          )
          discovery = discovery.replace(
              "0.4.3-beta1 records bounded public H5 source context only.",
              "0.4.3-beta2 records bounded public H5 source context only.",
          )
          discovery_path.write_text(discovery, encoding="utf-8")

          diagnostics_path = COMPONENT / "diagnostics.py"
          diagnostics = diagnostics_path.read_text(encoding="utf-8")
          diagnostics = diagnostics.replace(
              "0.4.3-beta1 additionally performs a bounded read-only public-H5 inspection",
              "0.4.3-beta2 performs the corrected bounded read-only public-H5 inspection",
          )
          diagnostics = diagnostics.replace(
              "0.4.3-beta1 additionally performs bounded public H5 Maintenance & Tools discovery.",
              "0.4.3-beta2 performs corrected bounded public H5 Maintenance & Tools discovery.",
          )
          diagnostics_path.write_text(diagnostics, encoding="utf-8")

          notes = '''title: Navimower 0.4.3-beta2

          Navimower 0.4.3-beta2 is a focused hotfix for the Maintenance & Tools discovery introduced in beta1.

          ### Fixed: Download diagnostics registration

          - Fixed an import-time `re.PatternError` in `maintenance_h5_discovery.py` caused by an extra regex escaping layer generated in beta1.
          - Because `diagnostics.py` imports that discovery module, the import failure prevented Home Assistant from detecting Navimower diagnostics support and **Download diagnostics** disappeared from the menu.
          - Removed the extra escaping layer from every Maintenance H5 regex, not only the `BRIDGE_RE` pattern that failed immediately. The other beta1 patterns compiled but matched literal backslashes instead of actual JavaScript syntax.
          - Corrected JavaScript whitespace normalization for the same escaping issue.

          ### Regression protection

          - Added a test that extracts and compiles every `re.compile(...)` expression from the discovery module so import-time regex failures are caught by CI rather than Python syntax compilation alone.
          - Added syntax assertions proving the discovery patterns now target real H5 JavaScript syntax.

          ### Scope

          Beta2 otherwise keeps the beta1 plan unchanged. Maintenance H5 discovery runs only when Download diagnostics is explicitly requested, remains public/unauthenticated/read-only, and executes no blade reset, maintenance-mode command, cutting-height mutation or other mower control.
          '''
          (ROOT / ".github" / "release-notes" / "0.4.3-beta2.md").write_text(
              textwrap.dedent(notes), encoding="utf-8"
          )

          changelog_path = ROOT / "CHANGELOG.md"
          changelog = changelog_path.read_text(encoding="utf-8")
          header = "# Changelog\n\n"
          if not changelog.startswith(header):
              raise SystemExit("Unexpected changelog header")
          section = '''## 0.4.3-beta2

          Focused hotfix for beta1 Maintenance & Tools H5 discovery.

          ### Fixed

          - Fixed the malformed import-time `BRIDGE_RE` expression that prevented Home Assistant from loading Navimower diagnostics and hid Download diagnostics.
          - Removed beta1's extra escaping layer from all Maintenance H5 regular expressions and JavaScript whitespace normalization.

          ### Validation

          - Added regression coverage that compiles every discovery `re.compile(...)` expression and verifies intended JavaScript regex syntax.
          - Maintenance discovery remains read-only and Download-diagnostics-only; no maintenance mutation is added in beta2.

          '''
          changelog_path.write_text(
              header + textwrap.dedent(section) + changelog[len(header):],
              encoding="utf-8",
          )

          test_content = r'''"""Regression contracts for Navimower 0.4.3-beta2 diagnostics hotfix."""
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path
          import re

          ROOT = Path(__file__).resolve().parents[1]
          COMPONENT = ROOT / "custom_components" / "navimower"


          def test_beta2_version_and_notes() -> None:
              manifest = json.loads((COMPONENT / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["version"] == "0.4.3-beta2"
              notes = (ROOT / ".github" / "release-notes" / "0.4.3-beta2.md").read_text(encoding="utf-8")
              assert notes.startswith("title: Navimower 0.4.3-beta2")
              assert "Download diagnostics" in notes
              assert "re.PatternError" in notes
              assert "literal backslashes" in notes


          def test_beta2_all_discovery_regexes_compile() -> None:
              source = (COMPONENT / "maintenance_h5_discovery.py").read_text(encoding="utf-8")
              tree = ast.parse(source)
              patterns: list[str] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  if not (
                      isinstance(node.func, ast.Attribute)
                      and isinstance(node.func.value, ast.Name)
                      and node.func.value.id == "re"
                      and node.func.attr == "compile"
                  ):
                      continue
                  assert node.args
                  pattern = ast.literal_eval(node.args[0])
                  assert isinstance(pattern, str)
                  patterns.append(pattern)
                  re.compile(pattern)
              assert len(patterns) >= 7


          def test_beta2_patterns_target_real_javascript_syntax() -> None:
              source = (COMPONENT / "maintenance_h5_discovery.py").read_text(encoding="utf-8")
              assert r'<script\b' in source
              assert r'method\s*:\s*' in source
              assert r'skipEncryption\s*:\s*' in source
              assert r'\s*\(\s*' in source
              assert r're.sub(r"\s+"' in source
              assert r'<script\\b' not in source
              assert r'\\s*\\(' not in source
              assert "NavimowerDiagnostics/0.4.3-beta2" in source


          def test_beta2_diagnostics_keeps_read_only_maintenance_probe() -> None:
              diagnostics = (COMPONENT / "diagnostics.py").read_text(encoding="utf-8")
              discovery = (COMPONENT / "maintenance_h5_discovery.py").read_text(encoding="utf-8")
              assert "from .maintenance_h5_discovery import probe_maintenance_h5" in diagnostics
              assert "await hass.async_add_executor_job" in diagnostics
              assert '"maintenance_h5_discovery": maintenance_h5_discovery' in diagnostics
              assert '"mutation_calls_executed": False' in discovery
              assert "client.call(" not in discovery
          '''
          (ROOT / "tests" / "test_v043_beta2.py").write_text(
              textwrap.dedent(test_content), encoding="utf-8"
          )
          PY

          python /tmp/apply_beta.py
          python -m pip install --upgrade pytest voluptuous cryptography pyyaml
          python -m compileall -q custom_components/navimower
          python -m pytest -q

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/navimower/manifest.json \
            custom_components/navimower/diagnostics.py \
            custom_components/navimower/maintenance_h5_discovery.py \
            .github/release-notes/0.4.3-beta2.md \
            CHANGELOG.md \
            tests/test_v043_beta2.py
          git commit -m "Prepare Navimower 0.4.3-beta2 diagnostics hotfix"

          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${BUILD_BRANCH}" | awk '{print $1}')"
          if [ -n "${REMOTE_SHA}" ]; then
            git push \
              --force-with-lease="refs/heads/${BUILD_BRANCH}:${REMOTE_SHA}" \
              origin "HEAD:refs/heads/${BUILD_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${BUILD_BRANCH}"
          fi

      - name: Report result
        if: always()
        shell: bash
        run: |
          {
            echo "Navimower 0.4.3-beta2 remote build outcome: ${{ steps.build.outcome }}"
            echo
            echo "Target branch: \`${BUILD_BRANCH}\`"
            echo
            echo '```text'
            tail -n 180 /tmp/remote-beta-build.log 2>/dev/null || true
            echo '```'
          } > /tmp/result.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/result.md

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
