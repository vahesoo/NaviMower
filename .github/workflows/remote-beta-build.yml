name: Remote beta build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA24 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Build and validate beta
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta-build.log) 2>&1
          set -euo pipefail
          git checkout -B "${BUILD_BRANCH}" origin/main

          python .github/scripts/remote_beta_builder.py
          python -m pytest -q
          python -m compileall -q custom_components/navimower
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              ".github/release-notes/0.4.3-beta24.md",
              "CHANGELOG.md",
              "README.md",
              "custom_components/navimower/manifest.json",
              "custom_components/navimower/navimower_schedule.py",
              "custom_components/navimower/notification_center.py",
              "custom_components/navimower/switch.py",
              "custom_components/navimower/time.py",
              "tests/test_v043_beta23.py",
              "tests/test_v043_beta24.py",
          }
          committed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
              ).splitlines()
          )
          unstaged = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          untracked = set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          changed = committed | unstaged | untracked
          if changed != expected:
              raise SystemExit(f"Unexpected beta24 diff scope: {sorted(changed)}")

          schedule = Path("custom_components/navimower/navimower_schedule.py").read_text(encoding="utf-8")
          notifications = Path("custom_components/navimower/notification_center.py").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          assert "def configured(self) -> bool:" in schedule
          assert "def _sync_active_cycle_id(self) -> bool:" in schedule
          assert 'self._runtime["active_cycle_id"] = None' in schedule
          assert '"Mowing task started"' in notifications
          assert 'kind="observed_mowing_started"' in notifications
          charging = notifications[
              notifications.index('        threshold = _as_float((snapshot.get("settings") or {}).get("return_battery_level"))'):
              notifications.index('        self._interrupted_reason = "unknown"')
          ]
          assert 'self._interrupted_reason = "charging"' in charging
          assert '_emit(' not in charging
          assert readme.index("## Installation") < readme.index("## Main features")
          assert "## 0.4.2 beta development" not in readme
          assert "## Upgrade from 0.4.0 to 0.4.1" not in readme
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes/0.4.3-beta24.md \
                  CHANGELOG.md \
                  README.md \
                  custom_components/navimower/manifest.json \
                  custom_components/navimower/navimower_schedule.py \
                  custom_components/navimower/notification_center.py \
                  custom_components/navimower/switch.py \
                  custom_components/navimower/time.py \
                  tests/test_v043_beta23.py \
                  tests/test_v043_beta24.py
          git commit -m "Prepare Navimower 0.4.3-beta24 release candidate"
          git push origin "${BUILD_BRANCH}" --force-with-lease
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "0.4.3-beta24 remote build succeeded. Full pytest, compileall, diff-check, exact diff-scope and focused schedule/notification/README checks passed; branch \`${BUILD_BRANCH}\` was pushed at \`${{ steps.build.outputs.commit }}\`."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Comment failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          tail -n 320 /tmp/remote-beta-build.log > /tmp/build-tail.txt || true
          {
            echo '0.4.3-beta24 remote build failed before publishing the completed release branch.'
            echo
            echo '```text'
            cat /tmp/build-tail.txt
            echo '```'
          } > /tmp/failure-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/failure-comment.md
          exit 1
