name: Build beta36 custom scheduler order

on:
  push:
    branches: [release/0.4.3-beta36]
    paths: [.github/workflows/build-beta36-custom-order.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.3-beta36
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply beta36 scheduler changes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path); s = p.read_text()
              if old not in s: raise SystemExit(f'missing marker in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # Constants
          p=Path('custom_components/navimower/const.py'); s=p.read_text()
          s=s.replace('OPT_SCHEDULE_ZONE_IDS: Final = "navimower_schedule_zone_ids"\n', 'OPT_SCHEDULE_ZONE_IDS: Final = "navimower_schedule_zone_ids"\nOPT_SCHEDULE_ORDER_MODE: Final = "navimower_schedule_order_mode"\nOPT_SCHEDULE_CUSTOM_QUEUE: Final = "navimower_schedule_custom_queue"\n\nSCHEDULE_ORDER_AUTOMATIC: Final = "automatic"\nSCHEDULE_ORDER_CUSTOM: Final = "custom"\nDEFAULT_SCHEDULE_ORDER_MODE: Final = SCHEDULE_ORDER_AUTOMATIC\n')
          p.write_text(s)

          # Runtime controller imports/options/state.
          p=Path('custom_components/navimower/navimower_schedule.py'); s=p.read_text()
          s=s.replace('    DEFAULT_SCHEDULE_MODE,\n', '    DEFAULT_SCHEDULE_MODE,\n    DEFAULT_SCHEDULE_ORDER_MODE,\n')
          s=s.replace('    OPT_SCHEDULE_MODE,\n', '    OPT_SCHEDULE_MODE,\n    OPT_SCHEDULE_ORDER_MODE,\n    OPT_SCHEDULE_CUSTOM_QUEUE,\n')
          s=s.replace('    SCHEDULE_MODE_CONTINUOUS,\n', '    SCHEDULE_MODE_CONTINUOUS,\n    SCHEDULE_ORDER_AUTOMATIC,\n    SCHEDULE_ORDER_CUSTOM,\n')
          s=s.replace('        self._selection_configured = OPT_SCHEDULE_ZONE_IDS in entry.options\n', '        order_mode = str(entry.options.get(OPT_SCHEDULE_ORDER_MODE, DEFAULT_SCHEDULE_ORDER_MODE))\n        self._order_mode = order_mode if order_mode in {SCHEDULE_ORDER_AUTOMATIC, SCHEDULE_ORDER_CUSTOM} else DEFAULT_SCHEDULE_ORDER_MODE\n        self._custom_queue = self._normalize_queue(entry.options.get(OPT_SCHEDULE_CUSTOM_QUEUE, []))\n        self._selection_configured = OPT_SCHEDULE_ZONE_IDS in entry.options\n')
          s=s.replace('    @staticmethod\n    def _empty_runtime()', '    @staticmethod\n    def _normalize_queue(values: Any) -> list[int]:\n        if isinstance(values, str):\n            values = [item.strip() for item in values.split(",") if item.strip()]\n        if not isinstance(values, (list, tuple)):\n            return []\n        result = []\n        for value in values:\n            try:\n                zone_id = int(value)\n            except (TypeError, ValueError):\n                continue\n            if zone_id > 0:\n                result.append(zone_id)\n        return result\n\n    @staticmethod\n    def _empty_runtime()')
          s=s.replace('            "completed_zone_ids_in_window": [],\n', '            "completed_zone_ids_in_window": [],\n            "completed_queue_slots": [],\n            "active_queue_slot": None,\n')
          s=s.replace('            "mode": self._mode,\n', '            "mode": self._mode,\n            "order_mode": self._order_mode,\n            "custom_queue": list(self._custom_queue),\n')
          s=s.replace('            self._runtime["completed_zone_ids_in_window"] = []\n', '            self._runtime["completed_zone_ids_in_window"] = []\n            self._runtime["completed_queue_slots"] = []\n            self._runtime["active_queue_slot"] = None\n', 1)

          marker='    def _eligible_zones(self) -> list[dict[str, Any]]:\n'
          helper='''    def _custom_queue_entries(self) -> list[dict[str, Any]]:\n        eligible = {int(row["id"]): row for row in self._eligible_zones() if row.get("id") is not None}\n        entries = []\n        for slot, zone_id in enumerate(self._custom_queue):\n            if zone_id in eligible and zone_id in self._selected_zone_ids:\n                entries.append({"slot": slot, "zone_id": zone_id, "zone": eligible[zone_id]})\n        return entries\n\n    def _next_custom_entry(self) -> dict[str, Any] | None:\n        completed = {int(v) for v in self._runtime.get("completed_queue_slots") or []}\n        for entry in self._custom_queue_entries():\n            if entry["slot"] not in completed:\n                return entry\n        return None\n\n'''
          s=s.replace(marker, helper+marker, 1)

          old='''        completed = {int(value) for value in self._runtime.get("completed_zone_ids_in_window") or []}\n        eligible = self._eligible_zones()\n        candidate = select_oldest_zone(\n            eligible,\n            completed_in_window=completed,\n            just_completed_zone_id=self._runtime.get("just_completed_zone_id"),\n            scheduler_completed_at=self._runtime.get("scheduler_completed_at") or {},\n        )\n'''
          new='''        completed = {int(value) for value in self._runtime.get("completed_zone_ids_in_window") or []}\n        eligible = self._eligible_zones()\n        custom_entry = self._next_custom_entry() if self._order_mode == SCHEDULE_ORDER_CUSTOM else None\n        candidate = custom_entry["zone"] if custom_entry is not None else (None if self._order_mode == SCHEDULE_ORDER_CUSTOM else select_oldest_zone(\n            eligible,\n            completed_in_window=completed,\n            just_completed_zone_id=self._runtime.get("just_completed_zone_id"),\n            scheduler_completed_at=self._runtime.get("scheduler_completed_at") or {},\n        ))\n'''
          if old not in s: raise SystemExit('candidate block missing')
          s=s.replace(old,new,1)
          old2='''        if candidate is None and self._mode == SCHEDULE_MODE_CONTINUOUS and eligible:\n            eligible_ids = {int(row["id"]) for row in eligible if row.get("id") is not None}\n            if eligible_ids and eligible_ids.issubset(completed):\n                self._runtime["completed_zone_ids_in_window"] = []\n                self._runtime["just_completed_zone_id"] = None\n                self._runtime["round_index"] = int(self._runtime.get("round_index") or 1) + 1\n                self._runtime["round_started_at"] = _utc_now()\n                await self._save()\n                candidate = select_oldest_zone(\n                    eligible,\n                    completed_in_window=set(),\n                    just_completed_zone_id=None,\n                    scheduler_completed_at=self._runtime.get("scheduler_completed_at") or {},\n                )\n'''
          new2='''        if candidate is None and self._mode == SCHEDULE_MODE_CONTINUOUS and eligible:\n            if self._order_mode == SCHEDULE_ORDER_CUSTOM and self._custom_queue_entries():\n                self._runtime["completed_queue_slots"] = []\n                self._runtime["completed_zone_ids_in_window"] = []\n                self._runtime["just_completed_zone_id"] = None\n                self._runtime["round_index"] = int(self._runtime.get("round_index") or 1) + 1\n                self._runtime["round_started_at"] = _utc_now()\n                await self._save()\n                custom_entry = self._next_custom_entry()\n                candidate = custom_entry["zone"] if custom_entry else None\n            else:\n                eligible_ids = {int(row["id"]) for row in eligible if row.get("id") is not None}\n                if eligible_ids and eligible_ids.issubset(completed):\n                    self._runtime["completed_zone_ids_in_window"] = []\n                    self._runtime["just_completed_zone_id"] = None\n                    self._runtime["round_index"] = int(self._runtime.get("round_index") or 1) + 1\n                    self._runtime["round_started_at"] = _utc_now()\n                    await self._save()\n                    candidate = select_oldest_zone(eligible, completed_in_window=set(), just_completed_zone_id=None, scheduler_completed_at=self._runtime.get("scheduler_completed_at") or {})\n'''
          if old2 not in s: raise SystemExit('round block missing')
          s=s.replace(old2,new2,1)
          s=s.replace('        await self._async_send_mow(zone_id, reset=True, source="navimower_schedule_next_zone")\n', '        queue_slot = custom_entry["slot"] if self._order_mode == SCHEDULE_ORDER_CUSTOM and custom_entry else None\n        await self._async_send_mow(zone_id, reset=True, source="navimower_schedule_next_zone", queue_slot=queue_slot)\n',1)
          s=s.replace('        completed.add(int(zone_id))\n        self._runtime["completed_zone_ids_in_window"] = sorted(completed)\n', '        completed.add(int(zone_id))\n        self._runtime["completed_zone_ids_in_window"] = sorted(completed)\n        active_slot = self._runtime.get("active_queue_slot")\n        if active_slot is not None:\n            slots = {int(v) for v in self._runtime.get("completed_queue_slots") or []}\n            slots.add(int(active_slot))\n            self._runtime["completed_queue_slots"] = sorted(slots)\n        self._runtime["active_queue_slot"] = None\n',1)
          s=s.replace('            self._runtime["active_zone_id"] = zone_id\n', '            self._runtime["active_zone_id"] = zone_id\n            self._runtime["active_queue_slot"] = pending.get("queue_slot")\n',1)
          s=s.replace('    async def _async_send_mow(self, zone_id: int, *, reset: bool, source: str) -> None:\n', '    async def _async_send_mow(self, zone_id: int, *, reset: bool, source: str, queue_slot: int | None = None) -> None:\n',1)
          s=s.replace('            "source": source,\n            "sent_at": sent_at,\n', '            "source": source,\n            "queue_slot": queue_slot,\n            "sent_at": sent_at,\n',1)
          p.write_text(s)

          # Options-flow extension: order mode + custom queue as ordered comma list.
          p=Path('custom_components/navimower/config_flow.py'); s=p.read_text()
          s=s.replace('    TextSelectorType,\n', '    TextSelectorType,\n    SelectSelector,\n    SelectSelectorConfig,\n    SelectSelectorMode,\n')
          s=s.replace('from .custom_area import (\n', 'from .const import OPT_SCHEDULE_ORDER_MODE, OPT_SCHEDULE_CUSTOM_QUEUE, SCHEDULE_ORDER_AUTOMATIC, SCHEDULE_ORDER_CUSTOM\nfrom .custom_area import (\n')
          s=s.replace('                "navimower_schedule",\n', '                "navimower_schedule",\n                "navimower_schedule_order",\n',1)
          insert='''\n    async def async_step_navimower_schedule_order(self, user_input: dict[str, Any] | None = None) -> ConfigFlowResult:\n        choices = self._schedule_zone_choices()\n        options = self._options()\n        if user_input is not None:\n            order_mode = str(user_input.get(OPT_SCHEDULE_ORDER_MODE) or SCHEDULE_ORDER_AUTOMATIC)\n            raw = str(user_input.get(OPT_SCHEDULE_CUSTOM_QUEUE) or "")\n            queue = []\n            invalid = []\n            for item in raw.split(","):\n                item = item.strip()\n                if not item:\n                    continue\n                if item not in choices:\n                    invalid.append(item)\n                else:\n                    queue.append(item)\n            if order_mode == SCHEDULE_ORDER_CUSTOM and (invalid or not queue):\n                return self.async_show_form(step_id="navimower_schedule_order", data_schema=self._schedule_order_schema(order_mode, raw), errors={"base": "schedule_custom_queue_invalid"})\n            return self._save(**{OPT_SCHEDULE_ORDER_MODE: order_mode, OPT_SCHEDULE_CUSTOM_QUEUE: queue})\n        mode = str(options.get(OPT_SCHEDULE_ORDER_MODE, SCHEDULE_ORDER_AUTOMATIC))\n        queue = ", ".join(str(v) for v in options.get(OPT_SCHEDULE_CUSTOM_QUEUE, []) or [])\n        return self.async_show_form(step_id="navimower_schedule_order", data_schema=self._schedule_order_schema(mode, queue), description_placeholders={"eligible_zones": ", ".join(f"{z}: {n}" for z,n in choices.items())})\n\n    def _schedule_order_schema(self, mode: str, queue: str) -> vol.Schema:\n        return vol.Schema({\n            vol.Required(OPT_SCHEDULE_ORDER_MODE, default=mode): SelectSelector(SelectSelectorConfig(options=[{"value": SCHEDULE_ORDER_AUTOMATIC, "label": "Automatic order"}, {"value": SCHEDULE_ORDER_CUSTOM, "label": "Custom order"}], mode=SelectSelectorMode.LIST)),\n            vol.Optional(OPT_SCHEDULE_CUSTOM_QUEUE, default=queue): TextSelector(TextSelectorConfig(type=TextSelectorType.TEXT)),\n        })\n\n'''
          s=s.replace('    async def async_step_custom_areas(', insert+'    async def async_step_custom_areas(',1)
          p.write_text(s)

          # Status sensor: expose custom slot queue without collapsing duplicates.
          p=Path('custom_components/navimower/schedule_status.py'); s=p.read_text()
          marker='    queue: list[dict[str, Any]] = []\n'
          repl='''    if diagnostics.get("order_mode") == "custom":\n        completed_slots = {int(v) for v in diagnostics.get("completed_queue_slots") or []}\n        active_slot = diagnostics.get("active_queue_slot")\n        custom_queue = diagnostics.get("custom_queue") or []\n        custom_items = []\n        for slot, raw in enumerate(custom_queue):\n            try: zone_id = int(raw)\n            except (TypeError, ValueError): continue\n            if zone_id not in by_id: continue\n            status = "completed" if slot in completed_slots else ("active" if active_slot is not None and int(active_slot) == slot else "upcoming")\n            custom_items.append({"slot": slot, "id": zone_id, "name": _zone_name(by_id[zone_id], zone_id), "status": status})\n        queue = custom_items\n    else:\n        queue = []\n'''
          s=s.replace(marker,repl,1)
          s=s.replace('    for zone_id in completed_ids:\n        queue.append', '    for zone_id in ([] if diagnostics.get("order_mode") == "custom" else completed_ids):\n        queue.append',1)
          s=s.replace('    if active_id is not None:\n        queue.append', '    if active_id is not None and diagnostics.get("order_mode") != "custom":\n        queue.append',1)
          s=s.replace('    for zone_id in remaining_ids:\n        queue.append', '    for zone_id in ([] if diagnostics.get("order_mode") == "custom" else remaining_ids):\n        queue.append',1)
          s=s.replace('        "mode": diagnostics.get("mode"),\n', '        "mode": diagnostics.get("mode"),\n        "order_mode": diagnostics.get("order_mode") or "automatic",\n        "custom_queue": diagnostics.get("custom_queue") or [],\n        "active_queue_slot": diagnostics.get("active_queue_slot"),\n        "completed_queue_slots": diagnostics.get("completed_queue_slots") or [],\n')
          p.write_text(s)

          # Version + notes + regression tests.
          p=Path('custom_components/navimower/manifest.json'); s=p.read_text().replace('"version": "0.4.3-beta35"','"version": "0.4.3-beta36"'); p.write_text(s)
          Path('.github/release-notes/0.4.3-beta36.md').write_text('''# Navimower 0.4.3-beta36\n\n## Navimower Schedule custom order\n- Adds Automatic order and Custom order modes while preserving the proven-zone allowlist.\n- Custom order is an ordered queue and may contain the same zone multiple times at arbitrary positions.\n- Each custom queue occurrence has its own slot identity, so duplicate zones are completed independently.\n- Schedule status exposes order mode, slot-aware queue, active slot and completed slots for Map Card visualization.\n- Continuous mode starts a new round after every custom queue slot is completed.\n''')
          Path('tests/test_v043_beta36.py').write_text('''from pathlib import Path\n\ndef test_beta36_version_and_constants():\n    assert '0.4.3-beta36' in Path('custom_components/navimower/manifest.json').read_text()\n    c=Path('custom_components/navimower/const.py').read_text()\n    assert 'OPT_SCHEDULE_CUSTOM_QUEUE' in c and 'SCHEDULE_ORDER_CUSTOM' in c\n\ndef test_custom_queue_keeps_duplicates_and_slots():\n    s=Path('custom_components/navimower/navimower_schedule.py').read_text()\n    assert '_custom_queue_entries' in s\n    assert 'completed_queue_slots' in s\n    assert 'active_queue_slot' in s\n    assert 'queue_slot=queue_slot' in s\n\ndef test_status_is_slot_aware():\n    s=Path('custom_components/navimower/schedule_status.py').read_text()\n    assert 'completed_slots' in s and '"slot": slot' in s\n\ndef test_options_expose_order_mode():\n    s=Path('custom_components/navimower/config_flow.py').read_text()\n    assert 'async_step_navimower_schedule_order' in s\n    assert 'Automatic order' in s and 'Custom order' in s\n''')
      - name: Run tests
        run: python -m pytest -q
      - name: Commit generated beta
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/navimower tests .github/release-notes/0.4.3-beta36.md
          git commit -m 'Add custom Navimower schedule order' || exit 0
          git push origin HEAD:release/0.4.3-beta36
