name: Temporary Navimower beta5 push trigger

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.head_commit.message == 'Trigger beta5 release v3'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply beta5 patch
        id: patch
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/beta5-passive-discovery-finalizer.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('beta5 patch marker not found')
          body = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())

          # The nested release workflow necessarily indents lines inside the
          # config-flow triple-quoted patch anchor. Replace that one fragile
          # source block with a whitespace-stable insertion before executing it.
          block_start = script.index("anchor = '''", script.index("flow_path = COMPONENT / 'config_flow.py'"))
          block_end_marker = "flow_path.write_text(flow, encoding='utf-8')"
          block_end = script.index(block_end_marker, block_start) + len(block_end_marker)
          stable = r'''schema_tail = '''                    ): vol.In(
                        {
                            "standard": "Standard",
                            "extended": "Extended",
                        }
                    ),
                }
'''
          passive_field = '''                    vol.Required(
                        OPT_PASSIVE_DISCOVERY,
                        default=bool(
                            options.get(
                                OPT_PASSIVE_DISCOVERY,
                                DEFAULT_PASSIVE_DISCOVERY,
                            )
                        ),
                    ): bool,
'''
          if schema_tail not in flow:
              raise SystemExit('general diagnostics schema tail missing')
          flow = flow.replace(
              schema_tail,
              schema_tail[:-18] + passive_field + '                }\n',
              1,
          )
          flow_path.write_text(flow, encoding='utf-8')'''
          script = script[:block_start] + stable + script[block_end:]
          exec(compile(script, 'beta5-passive-discovery-finalizer.yml', 'exec'))
          PY
          } 2>&1 | tee /tmp/beta5-patch.log
      - name: Validate full test suite
        id: tests
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python -m compileall -q custom_components/navimower
            python -m pip install --upgrade pytest voluptuous cryptography
            python -m pytest -q
          } 2>&1 | tee /tmp/beta5-tests.log
      - name: Commit and publish beta5
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/beta5-passive-discovery-finalizer.yml .github/workflows/beta5-push-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Navimower 0.4.1-beta5"
          git push origin HEAD:main
          gh release create v0.4.1-beta5 --prerelease --title "Navimower 0.4.1-beta5" --notes-file .github/release-notes/0.4.1-beta5.md
          gh issue close 27 --reason completed || true
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          {
            echo "beta5 push workflow failed"
            echo "patch: ${{ steps.patch.outcome }}"
            echo "tests: ${{ steps.tests.outcome }}"
            echo
            echo '```text'
            tail -n 100 /tmp/beta5-patch.log 2>/dev/null || true
            tail -n 100 /tmp/beta5-tests.log 2>/dev/null || true
            echo '```'
          } > /tmp/beta5-failure.md
          gh issue comment 27 --body-file /tmp/beta5-failure.md || true
