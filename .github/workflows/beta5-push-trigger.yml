name: Temporary Navimower beta5 push trigger

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.head_commit.message == 'Trigger beta5 release v5'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply beta5 patch
        id: patch
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python - <<'PY'
          from pathlib import Path
          import ast

          workflow = Path('.github/workflows/beta5-passive-discovery-finalizer.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('beta5 patch marker not found')
          body = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())

          # The extracted Python is already de-indented from the YAML block.
          # Remove the extra runtime 10-space stripping used by the embedded
          # writer strings; otherwise deep Python blocks lose indentation.
          script = script.replace(".replace('\\n          ', '\\n').lstrip()", ".lstrip()")
          script = script.replace(".replace('\\n          ', '\\n')", "")

          # Normalize the diagnostics option block to the literal expected by
          # the patch script. This avoids YAML indentation affecting that exact
          # string match while keeping the resulting config_flow unchanged.
          tree = ast.parse(script)
          expected_anchor = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'anchor':
                          expected_anchor = ast.literal_eval(node.value)
                          break
              if expected_anchor is not None:
                  break
          if not isinstance(expected_anchor, str):
              raise SystemExit('could not read config-flow anchor from beta5 patch')

          flow_path = Path('custom_components/navimower/config_flow.py')
          flow = flow_path.read_text(encoding='utf-8')
          if expected_anchor not in flow:
              start_marker = '                    vol.Required(\n                        OPT_DIAGNOSTICS_DETAIL,'
              start = flow.index(start_marker)
              extended = flow.index('                            "extended": "Extended",', start)
              end = flow.index('                    ),', extended) + len('                    ),\n')
              flow = flow[:start] + expected_anchor + flow[end:]
              flow_path.write_text(flow, encoding='utf-8')

          exec(compile(script, 'beta5-passive-discovery-finalizer.yml', 'exec'))
          PY
          } 2>&1 | tee /tmp/beta5-patch.log
      - name: Validate full test suite
        id: tests
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python -m compileall -q custom_components/navimower
            python -m pip install --upgrade pytest voluptuous cryptography
            python -m pytest -q
          } 2>&1 | tee /tmp/beta5-tests.log
      - name: Commit and publish beta5
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/beta5-passive-discovery-finalizer.yml .github/workflows/beta5-push-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Navimower 0.4.1-beta5"
          git push origin HEAD:main
          gh release create v0.4.1-beta5 --prerelease --title "Navimower 0.4.1-beta5" --notes-file .github/release-notes/0.4.1-beta5.md
          gh issue close 27 --reason completed || true
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          {
            echo "beta5 push workflow failed"
            echo "patch: ${{ steps.patch.outcome }}"
            echo "tests: ${{ steps.tests.outcome }}"
            echo
            echo '```text'
            tail -n 140 /tmp/beta5-patch.log 2>/dev/null || true
            tail -n 140 /tmp/beta5-tests.log 2>/dev/null || true
            echo '```'
          } > /tmp/beta5-failure.md
          gh issue comment 27 --body-file /tmp/beta5-failure.md || true
