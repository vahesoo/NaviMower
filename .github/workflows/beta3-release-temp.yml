name: Build and release Navimower 0.4.1-beta3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/beta3-release-temp.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply beta3 raw-first telemetry patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Public telemetry sensors should expose selected vendor values, not
          # integration-reconstructed/monotonic substitutes.
          sensor = Path("custom_components/navimower/sensor.py")
          text = sensor.read_text(encoding="utf-8")
          marker = '''def _schedule_summary(schedule: list | None) -> str | None:\n    """Short human summary of the weekly schedule for the sensor state."""\n    if not schedule:\n        return None\n    days = [d.get("weekday") for d in schedule if d.get("enabled") and d.get("periods")]\n    return ", ".join(d for d in days if d) if days else "Off"\n\n\n'''
          helpers = marker + '''def _vendor_map_mowed_area(data: dict) -> float | None:\n    """Return the vendor coverage snapshot's summed finished area."""\n    coverage = data.get("coverage") or {}\n    try:\n        value = float(coverage.get("finished_area"))\n    except (TypeError, ValueError):\n        return None\n    return value if value >= 0 else None\n\n\ndef _vendor_map_coverage(data: dict) -> float | None:\n    """Return coverage derived only from the current vendor area snapshot."""\n    coverage = data.get("coverage") or {}\n    try:\n        area = float(coverage.get("total_area"))\n        finished = float(coverage.get("finished_area"))\n    except (TypeError, ValueError):\n        return None\n    if area <= 0 or finished < 0:\n        return None\n    return round(max(0.0, min(100.0, 100.0 * finished / area)), 1)\n\n\n'''
          if marker not in text:
              raise SystemExit("sensor helper insertion marker missing")
          text = text.replace(marker, helpers, 1)
          sensor.write_text(text, encoding="utf-8")

          replace_once(
              "custom_components/navimower/sensor.py",
              '        value_fn=lambda d: (d.get("totals") or {}).get("task_progress_pct"),\n',
              '        value_fn=lambda d: d.get("mowing_progress"),\n',
              "task progress raw state",
          )
          replace_once(
              "custom_components/navimower/sensor.py",
              '''            "source": (d.get("totals") or {}).get("task_progress_source"),\n            "zone_weighted_fallback_pct": (d.get("totals") or {}).get(\n                "task_zone_progress_weighted_pct"\n            ),\n            "meaning": "vendor_overall_selected_task_progress",\n''',
              '''            "source": d.get("mowing_progress_source"),\n            "source_age": d.get("mowing_progress_source_age"),\n            "mqtt_task_percentage": (d.get("mowing_progress_mqtt") or {}).get("mowing_percentage"),\n            "private_cloud_task_percentage": d.get("task_progress_private_cloud"),\n            "zone_weighted_fallback_pct": (d.get("totals") or {}).get(\n                "task_zone_progress_weighted_pct"\n            ),\n            "meaning": "vendor_overall_selected_task_progress_raw_first",\n''',
              "task progress attrs",
          )
          replace_once(
              "custom_components/navimower/sensor.py",
              '''        value_fn=lambda d: (d.get("totals") or {}).get("map_coverage_pct"),\n        attrs_fn=lambda d: {\n            "map_area_m2": (d.get("totals") or {}).get("map_area_m2"),\n            "map_mowed_area_m2": (d.get("totals") or {}).get("map_mowed_area_m2"),\n            "zone_count": (d.get("totals") or {}).get("zone_count"),\n            "completed_zone_count": (d.get("totals") or {}).get("completed_zone_count"),\n            "calculation": "area_weighted_latest_zone_cycles",\n            "zone_states_revision": d.get("zone_states_revision"),\n        },\n''',
              '''        value_fn=lambda d: _vendor_map_coverage(d),\n        attrs_fn=lambda d: {\n            "map_area_m2": (d.get("coverage") or {}).get("total_area"),\n            "map_mowed_area_m2": _vendor_map_mowed_area(d),\n            "source": "private_cloud_coverage",\n            "calculation": "vendor_finished_area_over_vendor_area",\n            "interpreted_zone_model_pct": (d.get("totals") or {}).get("map_coverage_pct"),\n            "zone_count": (d.get("totals") or {}).get("zone_count"),\n            "completed_zone_count": (d.get("totals") or {}).get("completed_zone_count"),\n            "zone_states_revision": d.get("zone_states_revision"),\n        },\n''',
              "map coverage raw state",
          )
          replace_once(
              "custom_components/navimower/sensor.py",
              '        value_fn=lambda d: (d.get("totals") or {}).get("task_mowed_area_m2"),\n',
              '        value_fn=lambda d: d.get("session_area"),\n',
              "task area raw state",
          )
          replace_once(
              "custom_components/navimower/sensor.py",
              '''            "source": (d.get("totals") or {}).get("task_mowed_area_source"),\n''',
              '''            "source": d.get("session_area_source"),\n            "source_age": d.get("session_area_source_age"),\n            "mqtt_subtotal_area_m2": d.get("session_area_mqtt"),\n            "private_cloud_subtotal_area_m2": d.get("session_area_private_cloud"),\n            "interpreted_task_mowed_area_m2": (d.get("totals") or {}).get("task_mowed_area_m2"),\n''',
              "task area attrs",
          )
          replace_once(
              "custom_components/navimower/sensor.py",
              '''        value_fn=lambda d: (d.get("totals") or {}).get("map_mowed_area_m2"),\n        attrs_fn=lambda d: {\n            "map_area_m2": (d.get("totals") or {}).get("map_area_m2"),\n            "map_coverage_pct": (d.get("totals") or {}).get("map_coverage_pct"),\n        },\n''',
              '''        value_fn=lambda d: _vendor_map_mowed_area(d),\n        attrs_fn=lambda d: {\n            "map_area_m2": (d.get("coverage") or {}).get("total_area"),\n            "map_coverage_pct": _vendor_map_coverage(d),\n            "source": "private_cloud_coverage",\n            "interpreted_zone_model_mowed_area_m2": (d.get("totals") or {}).get("map_mowed_area_m2"),\n        },\n''',
              "map area raw state",
          )

          # Fresh source selection remains, but valid decreases are no longer
          # rewritten into previous larger values or artificial reset holds.
          coordinator = Path("custom_components/navimower/coordinator.py")
          c = coordinator.read_text(encoding="utf-8")
          old = '''        progress_was_pending = self._progress_reset_pending\n        if progress_was_pending and reset_guard:\n            if progress is not None and progress <= 25:\n                self._progress_reset_pending = False\n            else:\n                progress = 0\n                progress_source = "cycle_reset_hold"\n        elif self._progress_reset_pending:\n            self._progress_reset_pending = False\n        if (\n            not progress_was_pending\n            and not reset_marked\n            and active\n            and previous_progress is not None\n            and progress is not None\n            and progress < previous_progress\n        ):\n            progress = previous_progress\n            progress_source = "last_known_monotonic"\n'''
          if c.count(old) != 1:
              raise SystemExit(f"progress smoothing block count {c.count(old)}")
          c = c.replace(old, "", 1)
          old = '''        if (\n            active\n            and same_zone\n            and not reset_marked\n            and not progress_was_pending\n            and previous_zone_progress is not None\n            and active_zone_progress is not None\n            and active_zone_progress < previous_zone_progress\n        ):\n            active_zone_progress = previous_zone_progress\n            active_zone_progress_source = "last_known_zone_monotonic"\n'''
          if c.count(old) != 1:
              raise SystemExit(f"zone smoothing block count {c.count(old)}")
          c = c.replace(old, "", 1)
          old = '''        area_was_pending = self._area_reset_pending\n        if area_was_pending and reset_guard:\n            reset_reference = self._cycle_reset_previous_area or previous_area or 0.0\n            acceptable = max(250.0, reset_reference * 0.25)\n            low_progress = any(\n                value is not None and value <= 25\n                for value in (\n                    _progress_percent(snapshot.get("mowing_progress")),\n                    _progress_percent((snapshot.get("coverage") or {}).get("overall_pct")),\n                )\n            )\n            if session_area is not None and (\n                session_area <= acceptable\n                or (low_progress and session_area <= max(500.0, reset_reference * 0.5))\n            ):\n                self._area_reset_pending = False\n            else:\n                session_area = 0.0\n                session_area_source = "cycle_reset_hold"\n        elif self._area_reset_pending:\n            self._area_reset_pending = False\n        if (\n            not area_was_pending\n            and not reset_marked\n            and active\n            and previous_area is not None\n            and session_area is not None\n            and session_area < previous_area\n        ):\n            session_area = previous_area\n            session_area_source = "last_known_monotonic"\n'''
          if c.count(old) != 1:
              raise SystemExit(f"area smoothing block count {c.count(old)}")
          c = c.replace(old, "", 1)
          old = '''        snapshot["cycle_value_reset_pending"] = bool(\n            self._progress_reset_pending\n            or self._coverage_reset_pending\n            or self._area_reset_pending\n        )\n        snapshot["cycle_value_reset_reason"] = self._cycle_reset_reason\n        snapshot["cycle_value_reset_age"] = self._age_since(\n            self._cycle_reset_started_mono\n        )\n'''
          new = '''        # Raw-first telemetry never holds a valid vendor value behind an\n        # integration-generated reset state. Reset detection still belongs to\n        # history/cycle interpretation, not the public numeric telemetry.\n        self._progress_reset_pending = False\n        self._coverage_reset_pending = False\n        self._area_reset_pending = False\n        snapshot["cycle_value_reset_pending"] = False\n        snapshot["cycle_value_reset_reason"] = self._cycle_reset_reason\n        snapshot["cycle_value_reset_age"] = None\n'''
          if c.count(old) != 1:
              raise SystemExit(f"reset diagnostics block count {c.count(old)}")
          c = c.replace(old, new, 1)
          c = c.replace(
              '        """Resolve telemetry by freshness and keep one logical cycle monotonic."""',
              '        """Resolve telemetry by freshness without rewriting valid vendor values."""',
              1,
          )
          c = c.replace(
              '        # Session area can arrive both in the official location stream and the\n        # private cloud. Reject transient zero/regressions unless a cycle reset\n        # has been confirmed.\n',
              '        # Session area can arrive both in the official location stream and the\n        # private cloud. Prefer the freshest source and preserve valid decreases.\n',
              1,
          )
          coordinator.write_text(c, encoding="utf-8")

          # Bump manifest.
          manifest_path = Path("custom_components/navimower/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "0.4.1-beta2":
              raise SystemExit(f"unexpected starting version {manifest.get('version')}")
          manifest["version"] = "0.4.1-beta3"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          notes = '''title: Navimower 0.4.1-beta3\n\n## Raw-first telemetry sensors\n\nThis beta deliberately reduces integration-side interpretation of public numeric telemetry. Field graphs from H-series and i-series mowers showed that valid vendor counters can decrease during one logical mowing run, especially around charging and internal work transitions. Treating those decreases as impossible can manufacture values that the mower never reported.\n\n- **Task progress** now displays the selected fresh vendor `mowingPercentage` value directly. MQTT remains preferred while fresh during activity, with private cloud as fallback. A valid lower value is no longer replaced by the previous higher value.\n- **Task mowed area** now displays the selected fresh vendor `subtotalArea` directly. Valid decreases and resets are preserved instead of being forced monotonic.\n- **Map mowed area** now displays the current private-cloud coverage snapshot's summed vendor `finishedArea`.\n- **Map coverage** is calculated only from the same current vendor coverage snapshot (`finishedArea / area`) rather than from retained per-zone cycle history.\n- Source, source age, MQTT/private raw values and the previous interpreted zone-model result are exposed as attributes where useful for field comparison.\n\n## What remains interpreted\n\nSession history, cycle boundaries, per-zone daily trails, gate/channel presence and map rendering still need integration-side interpretation because the vendor does not provide those as ready-to-use Home Assistant entities. Those internal models no longer override the four public telemetry sensors above.\n\n## Validation goal\n\nThe purpose of beta3 is to make field graphs auditable: when a value moves backwards, testers should be seeing a vendor value/source transition rather than a hidden Navimower monotonic guard. This is especially intended for comparison across H1/H2, i-series and X-series behaviour.\n\nThis is a prerelease for field validation before stable 0.4.1.\n'''
          Path(".github/release-notes/0.4.1-beta3.md").write_text(notes, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          ch = changelog.read_text(encoding="utf-8")
          entry = '''# Changelog\n\n## 0.4.1-beta3 — raw-first telemetry\n\n- Publish Task progress from the selected fresh vendor `mowingPercentage` value without monotonic rewriting.\n- Publish Task mowed area from the selected fresh vendor `subtotalArea` without suppressing valid decreases.\n- Publish Map mowed area from the current coverage snapshot's summed vendor `finishedArea`.\n- Calculate Map coverage directly from the same current vendor coverage snapshot instead of retained per-zone cycle history.\n- Keep source/raw comparison attributes so field diagnostics can distinguish vendor behaviour from integration interpretation.\n- Keep session, daily-trail and cycle interpretation internal; those models no longer override the public telemetry sensors above.\n\n'''
          if not ch.startswith("# Changelog\n"):
              raise SystemExit("unexpected changelog header")
          changelog.write_text(entry + ch[len("# Changelog\n\n"):], encoding="utf-8")

          # Older beta2 regression should keep validating beta2 itself, not pin
          # the repository forever to beta2.
          beta2 = Path("tests/test_v041_beta2.py")
          b = beta2.read_text(encoding="utf-8")
          old = '''def test_release_version_and_notes():\n    manifest = json.loads((COMPONENT / "manifest.json").read_text()); assert manifest["version"] == "0.4.1-beta2"\n    notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta2.md").read_text(); assert "Zone progress and coverage ownership" in notes; assert "Mowing-footprint width" in notes; assert "316" in notes\n'''
          new = '''def test_beta2_release_notes():\n    notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta2.md").read_text(); assert "Zone progress and coverage ownership" in notes; assert "Mowing-footprint width" in notes; assert "316" in notes\n'''
          if b.count(old) != 1:
              raise SystemExit("beta2 release assertion block missing")
          beta2.write_text(b.replace(old, new, 1), encoding="utf-8")

          release_test = Path("tests/test_v034_release.py")
          r = release_test.read_text(encoding="utf-8")
          r = r.replace('assert manifest["version"] == "0.4.1-beta2"', 'assert manifest["version"] == "0.4.1-beta3"', 1)
          r = r.replace('/ "0.4.1-beta2.md").read_text()', '/ "0.4.1-beta3.md").read_text()', 1)
          r = r.replace('assert notes.startswith("title: Navimower 0.4.1-beta2")', 'assert notes.startswith("title: Navimower 0.4.1-beta3")', 1)
          old = '''    assert "Zone progress and coverage ownership" in notes\n    assert "Session and daily-trail stability" in notes\n    assert "Mowing-footprint width" in notes\n    assert "316" in notes\n'''
          new = '''    assert "Raw-first telemetry sensors" in notes\n    assert "mowingPercentage" in notes\n    assert "subtotalArea" in notes\n    assert "finishedArea" in notes\n'''
          if r.count(old) != 1:
              raise SystemExit("current release note assertions missing")
          release_test.write_text(r.replace(old, new, 1), encoding="utf-8")

          beta3_test = '''"""Regression contracts for Navimower 0.4.1-beta3 raw-first telemetry."""\nfrom __future__ import annotations\nimport json\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nCOMPONENT = ROOT / "custom_components" / "navimower"\n\n\ndef test_beta3_version_and_notes() -> None:\n    manifest = json.loads((COMPONENT / "manifest.json").read_text())\n    assert manifest["version"] == "0.4.1-beta3"\n    notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta3.md").read_text()\n    assert "Raw-first telemetry sensors" in notes\n    assert "valid lower value" in notes\n\n\ndef test_public_progress_and_area_sensors_are_raw_first() -> None:\n    source = (COMPONENT / "sensor.py").read_text()\n    task = source.split('key="task_progress"', 1)[1].split('key="cutting_height"', 1)[0]\n    assert 'value_fn=lambda d: d.get("mowing_progress")' in task\n    assert 'mqtt_task_percentage' in task\n    task_area = source.split('key="task_mowed_area"', 1)[1].split('key="map_mowed_area"', 1)[0]\n    assert 'value_fn=lambda d: d.get("session_area")' in task_area\n    assert 'mqtt_subtotal_area_m2' in task_area\n\n\ndef test_public_map_sensors_use_current_vendor_coverage_snapshot() -> None:\n    source = (COMPONENT / "sensor.py").read_text()\n    coverage = source.split('key="map_coverage"', 1)[1].split('key="task_mowed_area"', 1)[0]\n    assert 'value_fn=lambda d: _vendor_map_coverage(d)' in coverage\n    assert 'vendor_finished_area_over_vendor_area' in coverage\n    area = source.split('key="map_mowed_area"', 1)[1].split('key="weekly_mowed_area"', 1)[0]\n    assert 'value_fn=lambda d: _vendor_map_mowed_area(d)' in area\n    assert 'private_cloud_coverage' in area\n\n\ndef test_stabilizer_does_not_rewrite_valid_vendor_regressions() -> None:\n    source = (COMPONENT / "coordinator.py").read_text()\n    block = source.split("def _stabilize_telemetry", 1)[1].split("def _schedule_state_save", 1)[0]\n    assert "last_known_monotonic" not in block\n    assert "last_known_zone_monotonic" not in block\n    assert "cycle_reset_hold" not in block\n    assert 'snapshot["cycle_value_reset_pending"] = False' in block\n'''
          Path("tests/test_v041_beta3.py").write_text(beta3_test, encoding="utf-8")
          PY

      - name: Compile and test beta3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pytest voluptuous cryptography
          python -m compileall -q custom_components/navimower
          python -m pytest -q

      - name: Commit tested beta3 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/beta3-release-temp.yml
          git add -A
          git commit -m "Release Navimower 0.4.1-beta3"
          git push origin HEAD:main

      - name: Publish beta3 prerelease
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.4.1-beta3"
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          NOTES=".github/release-notes/${VERSION}.md"
          BODY="${RUNNER_TEMP}/release-notes.md"
          TITLE="$(sed -n '1s/^title: //p' "${NOTES}")"
          tail -n +3 "${NOTES}" > "${BODY}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 0
          fi
          git fetch --tags origin
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            git tag "${TAG}" "${RELEASE_SHA}"
            git push origin "${TAG}"
          fi
          gh release create "${TAG}" \
            --target "${RELEASE_SHA}" \
            --title "${TITLE}" \
            --notes-file "${BODY}" \
            --prerelease
