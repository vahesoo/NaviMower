name: Publish prerelease

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: navimower-prerelease
  cancel-in-progress: false

jobs:
  release:
    if: >-
      startsWith(github.event.issue.title, 'PUBLISH NAVIMOWER PRERELEASE ') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release metadata
        id: version
        shell: bash
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          VERSION="${TITLE#PUBLISH NAVIMOWER PRERELEASE }"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          VERSION="${VERSION}" python - <<'PY'
          import json, os, re
          from pathlib import Path

          version = os.environ['VERSION']
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid version: {version!r}")
          manifest = json.loads(Path('custom_components/navimower/manifest.json').read_text())
          if manifest.get('version') != version:
              raise SystemExit(f"Manifest version {manifest.get('version')!r} does not match requested {version!r}")
          notes = Path(f'.github/release-notes/{version}.md')
          if not notes.is_file():
              raise SystemExit(f'Missing release notes: {notes}')
          expected = f'title: Navimower {version}\n'
          if not notes.read_text().startswith(expected):
              raise SystemExit(f'Release notes must start with {expected.strip()!r}')
          PY

      - name: Create tag and prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TARGET_SHA="$(git rev-parse HEAD)"
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            test "${TAG_SHA}" = "${TARGET_SHA}"
          else
            git tag "${TAG}" "${TARGET_SHA}"
            git push origin "${TAG}"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --prerelease --title "Navimower ${VERSION}" --notes-file ".github/release-notes/${VERSION}.md"
          else
            gh release create "${TAG}" --target "${TARGET_SHA}" --title "Navimower ${VERSION}" --notes-file ".github/release-notes/${VERSION}.md" --prerelease
          fi

      - name: Confirm request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Published Navimower \`${VERSION}\` as GitHub prerelease and verified tag \`v${VERSION}\`."
          gh issue close "${{ github.event.issue.number }}" --reason completed
