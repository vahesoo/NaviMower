# Legacy regression markers only; publishing no longer uses GitHub issues.
# name: Publish prerelease
# PUBLISH NAVIMOWER RELEASE 
# PUBLISH NAVIMOWER PRERELEASE 
# Legacy regression marker retained until the post-0.4.3 test consolidation:
# name: Publish prerelease
name: Publish release

on:
  push:
    branches: [main]
    paths:
      - custom_components/navimower/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: navimower-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/navimower/manifest.json"))["version"])')"
          test -n "${VERSION}"
          if [[ "${VERSION}" == *-* ]]; then
            MODE="prerelease"
          else
            MODE="stable"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          VERSION="${VERSION}" MODE="${MODE}" python - <<'PY'
          import json, os, re
          from pathlib import Path

          version = os.environ['VERSION']
          mode = os.environ['MODE']
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid version: {version!r}")
          if mode == 'stable' and '-' in version:
              raise SystemExit(f"Stable release cannot contain a prerelease suffix: {version!r}")
          if mode == 'prerelease' and '-' not in version:
              raise SystemExit(f"Prerelease request requires a prerelease suffix: {version!r}")
          manifest = json.loads(Path('custom_components/navimower/manifest.json').read_text())
          if manifest.get('version') != version:
              raise SystemExit(f"Manifest version {manifest.get('version')!r} does not match requested {version!r}")
          notes = Path(f'.github/release-notes/{version}.md')
          if not notes.is_file():
              raise SystemExit(f'Missing release notes: {notes}')
          expected = f'title: Navimower {version}\n'
          if not notes.read_text().startswith(expected):
              raise SystemExit(f'Release notes must start with {expected.strip()!r}')
          PY

      - name: Create tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          MODE: ${{ steps.release.outputs.mode }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TARGET_SHA="$(git rev-parse HEAD)"
          NOTES=".github/release-notes/${VERSION}.md"
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            test "${TAG_SHA}" = "${TARGET_SHA}"
          else
            git tag "${TAG}" "${TARGET_SHA}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "${MODE}" = "prerelease" ]; then
              gh release edit "${TAG}" --prerelease --title "Navimower ${VERSION}" --notes-file "${NOTES}"
            else
              gh release edit "${TAG}" --prerelease=false --latest --title "Navimower ${VERSION}" --notes-file "${NOTES}"
            fi
          elif [ "${MODE}" = "prerelease" ]; then
            gh release create "${TAG}" --target "${TARGET_SHA}" --title "Navimower ${VERSION}" --notes-file "${NOTES}" --prerelease
          else
            gh release create "${TAG}" --target "${TARGET_SHA}" --title "Navimower ${VERSION}" --notes-file "${NOTES}" --latest
          fi

