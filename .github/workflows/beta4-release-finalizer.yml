name: Finalize Navimower 0.4.1-beta4

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.number == 26 && github.event.comment.body == 'RUN-BETA4-RELEASE'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply beta4 MQTT stability patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Add a bounded re-subscribe cooldown. Pose loss alone must not rebuild
          # a healthy broker connection.
          replace_once(
              'custom_components/navimower/const.py',
              'MQTT_RESUBSCRIBE_GRACE_SECONDS: Final = 10\nMQTT_DISCONNECT_TIMEOUT_SECONDS: Final = 15\n',
              'MQTT_RESUBSCRIBE_GRACE_SECONDS: Final = 10\n# When broker/current-device traffic is alive but type=1 pose is absent, retry\n# the location subscription only occasionally. Never rebuild the client solely\n# because pose is missing.\nMQTT_POSE_RESUBSCRIBE_COOLDOWN_SECONDS: Final = 120\nMQTT_DISCONNECT_TIMEOUT_SECONDS: Final = 15\n',
              'const cooldown',
          )

          replace_once(
              'custom_components/navimower/mqtt.py',
              '    MQTT_POSE_RECOVERY_STALE_SECONDS,\n    MQTT_POSE_STALE_SECONDS,\n    MQTT_RECOVERY_BACKOFF_SECONDS,\n',
              '    MQTT_POSE_RECOVERY_STALE_SECONDS,\n    MQTT_POSE_RESUBSCRIBE_COOLDOWN_SECONDS,\n    MQTT_POSE_STALE_SECONDS,\n    MQTT_RECOVERY_BACKOFF_SECONDS,\n',
              'mqtt import',
          )

          # last_any_message_age must describe the selected mower, not any mower
          # on a shared account. Keep inventory account-wide for discovery.
          replace_once(
              'custom_components/navimower/mqtt.py',
              '''            now = time.monotonic()\n            self._last_any_message_mono = now\n            self._record_message_inventory(topic, payload, incoming_device_id)\n            if incoming_device_id == device_id and topic.endswith(\n''',
              '''            now = time.monotonic()\n            self._record_message_inventory(topic, payload, incoming_device_id)\n            if incoming_device_id == device_id:\n                self._last_any_message_mono = now\n            if incoming_device_id == device_id and topic.endswith(\n''',
              'current device any-message age',
          )

          old = '''    async def _async_recovery_cycle(self, reason: str) -> None:\n        try:\n            self._recovery_total += 1\n            sdk = self.sdk\n            generation = self._generation\n            device_id = self._device_id\n            self._set_recovery_state("resubscribing", reason)\n            _LOGGER.warning(\n                "Navimower MQTT %s while mower is active; re-subscribing to location",\n                reason,\n            )\n            if sdk is not None:\n                await self._async_subscribe_location(sdk, device_id, generation)\n            await asyncio.sleep(MQTT_RESUBSCRIBE_GRACE_SECONDS)\n            if self._unloading or self._quiescing or self._stopped:\n                return\n            if not self.coordinator.mqtt_stream_expected():\n                return\n            age = self.coordinator.pose_age()\n            if age is not None and age <= MQTT_POSE_STALE_SECONDS:\n                self._mark_pose_recovered()\n                return\n            await self._async_rebuild_client(reason)\n        except asyncio.CancelledError:\n            raise\n        finally:\n            if self._recovery_task is asyncio.current_task():\n                self._recovery_task = None\n'''
          new = '''    async def _async_recovery_cycle(self, reason: str) -> None:\n        \"\"\"Re-subscribe a degraded pose stream without rebuilding MQTT.\n\n        Field diagnostics show that Navimow can keep the broker connection and\n        current-device state traffic alive while type=1 location/pose packets\n        disappear for minutes. Rebuilding the whole SDK in that condition can\n        create a reconnect storm and does not fix the vendor-side publisher.\n        \"\"\"\n        try:\n            self._recovery_total += 1\n            sdk = self.sdk\n            generation = self._generation\n            device_id = self._device_id\n            self._set_recovery_state("resubscribing", reason)\n            _LOGGER.warning(\n                "Navimower MQTT %s while mower is active; re-subscribing to location",\n                reason,\n            )\n            if sdk is not None:\n                await self._async_subscribe_location(sdk, device_id, generation)\n            await asyncio.sleep(MQTT_RESUBSCRIBE_GRACE_SECONDS)\n            if self._unloading or self._quiescing or self._stopped:\n                return\n            if not self.coordinator.mqtt_stream_expected():\n                return\n            age = self.coordinator.pose_age()\n            if age is not None and age <= MQTT_POSE_STALE_SECONDS:\n                self._mark_pose_recovered()\n                return\n            # Transport can be healthy while only pose is missing. Preserve the\n            # client and useful MQTT state/progress traffic; position continues\n            # through the private-cloud freshness fallback.\n            self._set_recovery_state("pose_degraded", reason)\n            self._next_recovery_mono = (\n                time.monotonic() + MQTT_POSE_RESUBSCRIBE_COOLDOWN_SECONDS\n            )\n        except asyncio.CancelledError:\n            raise\n        finally:\n            if self._recovery_task is asyncio.current_task():\n                self._recovery_task = None\n'''
          replace_once('custom_components/navimower/mqtt.py', old, new, 'pose recovery')

          # Do not report a cooldown as generic backoff: pose_degraded is the
          # useful state for users and diagnostics.
          replace_once(
              'custom_components/navimower/mqtt.py',
              '''                if time.monotonic() < self._next_recovery_mono:\n                    self._set_recovery_state("backoff")\n                    continue\n''',
              '''                if time.monotonic() < self._next_recovery_mono:\n                    self._set_recovery_state("pose_degraded")\n                    continue\n''',
              'watchdog degraded state',
          )

          replace_once(
              'custom_components/navimower/mqtt.py',
              '''            "recovery_count": self._recovery_total,\n            "consecutive_rebuild_count": self._recovery_count,\n''',
              '''            "recovery_count": self._recovery_total,\n            "pose_resubscribe_count": self._recovery_total,\n            "consecutive_rebuild_count": self._recovery_count,\n            "last_any_message_scope": "current_device",\n''',
              'diagnostic fields',
          )

          # Version and release docs.
          manifest_path = Path('custom_components/navimower/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '0.4.1-beta3':
              raise SystemExit(f"unexpected version {manifest.get('version')}")
          manifest['version'] = '0.4.1-beta4'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          notes = '''title: Navimower 0.4.1-beta4\n\n## MQTT pose-stream stability\n\nField diagnostics from an H1500 showed a repeatable vendor-side failure mode: the MQTT broker/SDK remained connected while `realtimeDate/location` type=1 pose packets disappeared or arrived in bursts. The previous watchdog treated missing pose as a reason to rebuild the complete MQTT client, causing several rebuilds within tens of seconds without restoring the vendor pose publisher.\n\n- Missing/stale type=1 pose now enters **`pose_degraded`** instead of rebuilding the MQTT client.\n- The integration performs a location-topic re-subscribe, then waits 120 seconds before trying another pose re-subscribe.\n- Private-cloud position fallback continues while pose is degraded. Useful MQTT state/progress traffic is preserved.\n- Full SDK rebuild is no longer triggered solely by missing/stale pose. Real broker disconnect handling remains separate.\n- `last_any_message_age_s` is now current-device scoped on shared accounts, so other mowers cannot make the selected mower look alive.\n- Diagnostics add `pose_resubscribe_count` and `last_any_message_scope`.\n\nBeta3 raw-first telemetry behaviour is unchanged.\n\nThis is a prerelease for field validation before stable 0.4.1.\n'''
          Path('.github/release-notes/0.4.1-beta4.md').write_text(notes, encoding='utf-8')

          ch = Path('CHANGELOG.md')
          text = ch.read_text(encoding='utf-8')
          entry = '''# Changelog\n\n## 0.4.1-beta4 — MQTT pose-stream stability\n\n- Stop rebuilding the complete MQTT client solely because type=1 pose is absent or stale.\n- Enter `pose_degraded`, retain private-cloud position fallback and preserve useful MQTT traffic.\n- Rate-limit location re-subscribe attempts to one per 120 seconds while pose remains degraded.\n- Scope `last_any_message_age_s` to the current mower on shared accounts.\n- Add pose re-subscribe diagnostics.\n\n'''
          if not text.startswith('# Changelog\n'):
              raise SystemExit('unexpected changelog header')
          ch.write_text(entry + text[len('# Changelog\n\n'):], encoding='utf-8')

          # Update release contract test to current prerelease if present.
          p = Path('tests/test_v034_release.py')
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t = t.replace('assert manifest["version"] == "0.4.1-beta3"', 'assert manifest["version"] == "0.4.1-beta4"', 1)
              t = t.replace('/ "0.4.1-beta3.md").read_text()', '/ "0.4.1-beta4.md").read_text()', 1)
              t = t.replace('assert notes.startswith("title: Navimower 0.4.1-beta3")', 'assert notes.startswith("title: Navimower 0.4.1-beta4")', 1)
              t = t.replace('    assert "Raw-first telemetry sensors" in notes\n    assert "mowingPercentage" in notes\n    assert "subtotalArea" in notes\n    assert "finishedArea" in notes\n', '    assert "MQTT pose-stream stability" in notes\n    assert "pose_degraded" in notes\n    assert "120 seconds" in notes\n', 1)
              p.write_text(t, encoding='utf-8')

          test = '''\"\"\"Regression contracts for Navimower 0.4.1-beta4 MQTT recovery.\"\"\"\nfrom pathlib import Path\nimport json\n\nROOT = Path(__file__).resolve().parents[1]\nCOMPONENT = ROOT / "custom_components" / "navimower"\n\n\ndef test_beta4_version_and_notes():\n    manifest = json.loads((COMPONENT / "manifest.json").read_text())\n    assert manifest["version"] == "0.4.1-beta4"\n    notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta4.md").read_text()\n    assert "pose_degraded" in notes\n    assert "120 seconds" in notes\n\n\ndef test_pose_recovery_does_not_rebuild_client():\n    source = (COMPONENT / "mqtt.py").read_text()\n    block = source.split("async def _async_recovery_cycle", 1)[1].split("async def _async_rebuild_client", 1)[0]\n    assert "_async_rebuild_client" not in block\n    assert 'self._set_recovery_state("pose_degraded", reason)' in block\n    assert "MQTT_POSE_RESUBSCRIBE_COOLDOWN_SECONDS" in block\n\n\ndef test_current_device_message_age_is_not_account_wide():\n    source = (COMPONENT / "mqtt.py").read_text()\n    msg = source.split("async def _on_message", 1)[1].split("mqtt.on_connected", 1)[0]\n    assert "if incoming_device_id == device_id:" in msg\n    assert "self._last_any_message_mono = now" in msg\n    assert '"last_any_message_scope": "current_device"' in source\n\n\ndef test_pose_resubscribe_cooldown_constant():\n    source = (COMPONENT / "const.py").read_text()\n    assert "MQTT_POSE_RESUBSCRIBE_COOLDOWN_SECONDS: Final = 120" in source\n'''
          Path('tests/test_v041_beta4.py').write_text(test, encoding='utf-8')
          PY

      - name: Compile and test beta4
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pytest voluptuous cryptography
          python -m compileall -q custom_components/navimower
          python -m pytest -q

      - name: Commit tested beta4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/beta4-release-finalizer.yml
          git add -A
          git commit -m 'Release Navimower 0.4.1-beta4'
          git push origin HEAD:main

      - name: Publish beta4 prerelease
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.4.1-beta4'
          TAG="v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          NOTES=".github/release-notes/${VERSION}.md"
          BODY="${RUNNER_TEMP}/release-notes.md"
          TITLE="$(sed -n '1s/^title: //p' "${NOTES}")"
          tail -n +3 "${NOTES}" > "${BODY}"
          git fetch --tags origin
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            git tag "${TAG}" "${SHA}"
            git push origin "${TAG}"
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --target "${SHA}" --title "${TITLE}" --notes-file "${BODY}" --prerelease
          fi

      - name: Report success
        if: success()
        run: gh issue comment 26 --body 'beta4 finalizer outcome: success'

      - name: Report failure
        if: failure()
        run: gh issue comment 26 --body 'beta4 finalizer outcome: failure — inspect Actions run logs.'
