name: Verify beta5 schedule fix once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/beta5-schedule-fix-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml
      - name: Compile integration
        run: python -m compileall -q custom_components/navimower
      - name: Run full regression suite
        run: python -m pytest -q
