name: Patch schedule zone encoding for beta5 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/beta5-schedule-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Apply schedule encoder fix, tests and docs
        run: |
          set -euo pipefail
          python .github/scripts/apply_beta5_schedule_fix.py
          python -m compileall -q custom_components/navimower
          python -m pip install --upgrade pytest
          python -m pytest -q tests/test_v042_beta5_schedule_encoding.py
          git diff --check

      - name: Commit beta5 schedule fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/navimower/api/client.py tests/test_v042_beta5_schedule_encoding.py CHANGELOG.md .github/release-notes/0.4.2-beta5.md
          git commit -m "Fix schedule zone encoding for beta5"
          git push origin HEAD:main
