name: Remote beta22 build

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: >-
      github.event.issue.title == 'RUN NAVIMOWER 0.4.3-BETA22 BUILD' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_BRANCH: release/0.4.3-beta22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Build and validate beta22
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/remote-beta22-build.log) 2>&1
          set -euo pipefail
          git fetch origin "${BUILD_BRANCH}"
          git checkout -B "${BUILD_BRANCH}" "origin/${BUILD_BRANCH}"

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from textwrap import dedent

          ROOT = Path.cwd()
          COMPONENT = ROOT / "custom_components" / "navimower"

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def write(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(dedent(text).lstrip(), encoding="utf-8")

          manifest_path = COMPONENT / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "0.4.3-beta21":
              raise SystemExit(f"Expected beta21 base, got {manifest.get('version')!r}")
          manifest["version"] = "0.4.3-beta22"
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          history_path = COMPONENT / "history.py"
          replace_once(
              history_path,
              '''            if progress < 100:\n                seen_incomplete.add(zone_id)\n                completion_candidates.pop(zone_key, None)\n''',
              '''            if progress < 100:\n                # Keep the per-zone session display cache aligned with fresh\n                # authoritative coverage. This cache is display state only; it\n                # never writes Last completed.\n                active.setdefault("task_zone_progress", {})[zone_key] = progress\n                seen_incomplete.add(zone_id)\n                completion_candidates.pop(zone_key, None)\n''',
              "coverage display progress",
          )
          replace_once(
              history_path,
              '''            if zone_id in confirmed:\n                coverage_state[zone_key] = {\n''',
              '''            if zone_id in confirmed:\n                active.setdefault("task_zone_progress", {})[zone_key] = 100\n                coverage_state[zone_key] = {\n''',
              "confirmed coverage display progress",
          )
          replace_once(
              history_path,
              '''            self._zone_history[zone_key] = zone_record\n            active.setdefault("final_progress", {})[zone_key] = 100\n            coverage_state[zone_key] = {\n''',
              '''            self._zone_history[zone_key] = zone_record\n            active.setdefault("final_progress", {})[zone_key] = 100\n            active.setdefault("task_zone_progress", {})[zone_key] = 100\n            coverage_state[zone_key] = {\n''',
              "completed coverage display progress",
          )
          replace_once(
              history_path,
              '''            active = self._cache.get(self._active_id or "")\n            if active is not None:\n                if active.get("cutting_height_mm") is None:\n''',
              '''            active = self._cache.get(self._active_id or "")\n            if active is not None:\n                # Restore the dense per-zone display cache removed by beta21.\n                # Only truly fresh MQTT work/route counters are persisted here;\n                # private mapWorkPosition is intentionally excluded because a\n                # fresh HTTP poll can still carry an old semantic value after an\n                # interruption. Completion remains coverage-only above.\n                live_zone_id = _as_int(active_progress_zone_id)\n                live_progress = _as_int(active_zone_progress)\n                live_source = str(active_zone_progress_source or "")\n                live_age = _as_float(active_zone_progress_source_age)\n                fresh_live_zone_progress = bool(\n                    str(activity or "").lower() == "mowing"\n                    and live_source in {\n                        "mqtt_map_work_position",\n                        "mqtt_route_progress",\n                    }\n                    and live_zone_id is not None\n                    and live_progress is not None\n                    and 0 <= live_progress <= 100\n                    and live_age is not None\n                    and 0 <= live_age <= _COMPLETION_EVIDENCE_MAX_AGE_SECONDS\n                )\n                if fresh_live_zone_progress:\n                    active.setdefault("task_zone_progress", {})[\n                        str(live_zone_id)\n                    ] = live_progress\n\n                if active.get("cutting_height_mm") is None:\n''',
              "fresh MQTT display cache",
          )

          zone_state_path = COMPONENT / "zone_state.py"
          replace_once(
              zone_state_path,
              '''        live_display_pct = display_pct\n        current_task_pct = clamp_pct(task_progress.get(str(zone_id)))\n        task_override = (\n            cycle_id is not None\n            and zone_id in visited_zone_ids\n            and current_task_pct is not None\n        )\n''',
              '''        live_display_pct = display_pct\n        current_task_pct = clamp_pct(task_progress.get(str(zone_id)))\n        # The active zone already has the normalized dense live value in\n        # zone_details. Never let a reset-time session-cache zero hide it.\n        active_live_progress = bool(\n            zone_id == active_zone_id and live_display_pct is not None\n        )\n        if active_live_progress:\n            current_task_pct = live_display_pct\n        task_override = (\n            not active_live_progress\n            and cycle_id is not None\n            and zone_id in visited_zone_ids\n            and current_task_pct is not None\n        )\n''',
              "active live progress priority",
          )

          beta21_test = ROOT / "tests" / "test_v043_beta21.py"
          replace_once(
              beta21_test,
              '''def test_beta21_identity():\n    manifest = json.loads((COMPONENT / "manifest.json").read_text(encoding="utf-8"))\n    assert manifest["version"] == "0.4.3-beta21"\n    notes = (ROOT / ".github" / "release-notes" / "0.4.3-beta21.md").read_text(encoding="utf-8")\n    assert notes.startswith("title: Navimower 0.4.3-beta21")\n''',
              '''def test_beta21_release_notes_remain_available():\n    notes = (ROOT / ".github" / "release-notes" / "0.4.3-beta21.md").read_text(encoding="utf-8")\n    assert notes.startswith("title: Navimower 0.4.3-beta21")\n''',
              "beta21 historical identity",
          )
          replace_once(beta21_test, "import json\n", "", "remove beta21 json import")

          write(ROOT / "tests" / "test_v043_beta22.py", r'''
          import json
          from pathlib import Path

          from custom_components.navimower.zone_state import build_zone_model

          ROOT = Path(__file__).resolve().parents[1]
          COMPONENT = ROOT / "custom_components" / "navimower"


          def test_beta22_identity():
              manifest = json.loads((COMPONENT / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["version"] == "0.4.3-beta22"
              notes = (ROOT / ".github" / "release-notes" / "0.4.3-beta22.md").read_text(encoding="utf-8")
              assert notes.startswith("title: Navimower 0.4.3-beta22")


          def test_active_zone_live_progress_wins_over_reset_zero_cache():
              rows, totals = build_zone_model(
                  map_zones=[{"id": 24, "name": "Street", "area": 82.0}],
                  zone_details=[{
                      "id": 24,
                      "name": "Street",
                      "area_m2": 82.0,
                      "progress": 33,
                      "vendor_percentage": 32,
                      "progress_source": "mqtt_map_work_position",
                  }],
                  coverage={"zones": [{
                      "id": 24,
                      "name": "Street",
                      "area": 82.0,
                      "finished": 26.24,
                      "pct": 32,
                  }]},
                  zone_history={},
                  active_session={
                      "id": "cycle-1",
                      "zone_ids": [24],
                      "visited_zone_ids": [24],
                      "task_zone_progress": {"24": 0},
                  },
                  active_zone_id=24,
                  task_progress_pct=33,
                  task_mowed_area_m2=27.06,
                  task_progress_source="mqtt_task_percentage",
                  task_area_source="mqtt_location",
              )
              street = rows[0]
              assert street["coverage_pct"] == 33.0
              assert street["task_progress_pct"] == 33.0
              assert street["mowed_area_m2"] == 27.06
              assert street["progress_source"] == "mqtt_map_work_position"
              assert totals["task_progress_pct"] == 33.0


          def test_session_display_cache_tracks_coverage_and_fresh_mqtt_only():
              history = (COMPONENT / "history.py").read_text(encoding="utf-8")
              completion_start = history.index("    def _confirm_coverage_completions_locked")
              completion_end = history.index("    def cycle_diagnostics", completion_start)
              completion = history[completion_start:completion_end]
              assert 'active.setdefault("task_zone_progress", {})[zone_key] = progress' in completion
              assert 'active.setdefault("task_zone_progress", {})[zone_key] = 100' in completion

              update_start = history.index("    def update_zone_history")
              update_end = history.index("    def update_from_snapshot", update_start)
              update = history[update_start:update_end]
              assert '"mqtt_map_work_position"' in update
              assert '"mqtt_route_progress"' in update
              assert 'live_source in {' in update
              assert 'str(live_zone_id)' in update
              assert '"private_map_work_position"' not in update
              assert "last_completed_at" not in update


          def test_active_zone_projection_explicitly_rejects_reset_cache_override():
              source = (COMPONENT / "zone_state.py").read_text(encoding="utf-8")
              assert "active_live_progress = bool(" in source
              assert "current_task_pct = live_display_pct" in source
              assert "not active_live_progress" in source
          ''')

          changelog_path = ROOT / "CHANGELOG.md"
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "# Changelog\n\n\n"
          if not changelog.startswith(marker):
              raise SystemExit("Unexpected changelog header")
          section = '''## 0.4.3-beta22\n\nRestore live per-zone progress projection without weakening beta21 completion safety.\n\n### Fixed\n\n- Fix active zone Progress being pinned to 0% after a confirmed vendor cycle reset even while MQTT and cloud coverage continue to advance.\n- Let the active zone use its normalized live progress instead of an older session-cache value.\n- Refill the per-zone session display cache from fresh vendor coverage, with fresh MQTT work/route progress providing the dense active-zone updates between cloud polls.\n- Set the display cache to 100% when the beta21 coverage completion resolver confirms the zone.\n\n### Safety\n\n- `task_zone_progress` is display/session state only and cannot write `Last completed`.\n- Private `mapWorkPosition` is deliberately not persisted into the dense display cache because a fresh HTTP poll can still carry an old semantic value after rain/charging interruptions.\n- `Last completed` remains exclusively owned by fresh current-cycle vendor per-zone coverage reaching 100%.\n\n\n'''
          changelog_path.write_text(
              marker + section + changelog[len(marker):], encoding="utf-8"
          )

          write(ROOT / ".github" / "release-notes" / "0.4.3-beta22.md", r'''
          title: Navimower 0.4.3-beta22

          Restore live per-zone progress projection while keeping the beta21 completion contract unchanged.

          ### Fixed
          - Active zone **Progress** no longer stays at 0% after a new vendor zone cycle resets the session cache.
          - The active zone now prefers its normalized live progress over an older `task_zone_progress` cache value.
          - Fresh vendor per-zone coverage continuously refills the session display cache; fresh MQTT work/route progress supplies denser active-zone updates between cloud polls.
          - A confirmed vendor coverage completion also settles the session display cache to 100%.

          ### Safety
          - `task_zone_progress` remains display/session state only. It has no path to `last_completed_at`.
          - Private `mapWorkPosition` is not persisted as dense display-cache evidence because a successful HTTP poll can still carry an old progress value after an interruption.
          - **Last completed remains beta21 behavior:** only fresh current-cycle vendor per-zone coverage reaching 100% can advance the sensor.

          ### Verified regression
          - Covers the observed Street case where Navimow advanced 0 -> 33 -> 100 while Home Assistant stayed at 0% because the reset-time session cache was never repopulated.
          ''')
          PY

          python -m pytest -q
          python -m compileall -q custom_components/navimower
          git diff --check

          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          expected = {
              ".github/release-notes/0.4.3-beta22.md",
              "CHANGELOG.md",
              "custom_components/navimower/history.py",
              "custom_components/navimower/manifest.json",
              "custom_components/navimower/zone_state.py",
              "tests/test_v043_beta21.py",
              "tests/test_v043_beta22.py",
          }
          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          ) | set(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(f"Unexpected beta22 diff scope: {sorted(changed)}")

          manifest = json.loads(Path("custom_components/navimower/manifest.json").read_text())
          assert manifest["version"] == "0.4.3-beta22"
          history = Path("custom_components/navimower/history.py").read_text()
          zone_state = Path("custom_components/navimower/zone_state.py").read_text()
          assert 'active.setdefault("task_zone_progress", {})[zone_key] = progress' in history
          assert 'live_source in {' in history
          update = history[history.index("    def update_zone_history"):history.index("    def update_from_snapshot")]
          assert '"private_map_work_position"' not in update
          assert "last_completed_at" not in update
          assert "active_live_progress = bool(" in zone_state
          assert "current_task_pct = live_display_pct" in zone_state
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-notes/0.4.3-beta22.md \
                  CHANGELOG.md \
                  custom_components/navimower/history.py \
                  custom_components/navimower/manifest.json \
                  custom_components/navimower/zone_state.py \
                  tests/test_v043_beta21.py \
                  tests/test_v043_beta22.py
          git commit -m "Prepare Navimower 0.4.3-beta22 progress projection fix"
          git push origin "${BUILD_BRANCH}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "0.4.3-beta22 remote build succeeded. Full pytest, compileall, diff-check, exact diff-scope and progress/completion separation checks passed; branch \`${BUILD_BRANCH}\` was pushed at \`${{ steps.build.outputs.commit }}\`."
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Comment failure
        if: steps.build.outcome != 'success'
        shell: bash
        run: |
          tail -n 260 /tmp/remote-beta22-build.log > /tmp/build-tail.txt || true
          {
            echo '0.4.3-beta22 remote build failed before publishing the completed release branch.'
            echo
            echo '```text'
            cat /tmp/build-tail.txt
            echo '```'
          } > /tmp/failure-comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/failure-comment.md
          exit 1
