name: Temporary Navimower beta8 release v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.number == 30 && github.event.comment.body == 'RUN-BETA8-RELEASE-V2'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply beta8 changes
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/beta8_release.py
          python .github/beta8_release_fix.py

      - name: Validate full test suite
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/navimower
          python -m pip install --upgrade pytest voluptuous cryptography pyyaml
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          manifest = json.loads(Path('custom_components/navimower/manifest.json').read_text())
          if manifest.get('version') != '0.4.1-beta8':
              raise SystemExit(f"unexpected manifest version: {manifest.get('version')}")
          yaml.safe_load(Path('custom_components/navimower/services.yaml').read_text())
          source = Path('custom_components/navimower/coordinator.py').read_text()
          required = [
              'state_name == "isLifted"',
              'snapshot["state"] = "Lifted"',
              '"errors": lambda: self.client.errors(sn, vtype)',
              '"hint_error_compress": hint_errors',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'missing beta8 contracts: {missing}')
          PY

      - name: Publish beta8
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/beta8-release.yml .github/workflows/beta8-push-release.yml .github/workflows/beta8-finalizer.yml .github/workflows/beta8-finalizer-v2.yml
          rm -f .github/beta8_release.py .github/beta8_release_fix.py .github/beta8-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Navimower 0.4.1-beta8"
          git push origin HEAD:main
          RELEASE_SHA="$(git rev-parse HEAD)"
          gh release create v0.4.1-beta8 --prerelease --target "$RELEASE_SHA" --title "Navimower 0.4.1-beta8" --notes-file .github/release-notes/0.4.1-beta8.md
          gh issue comment 30 --body "beta8 release published successfully at commit $RELEASE_SHA; full test suite and lifted/error-catalog validation passed."
          gh issue close 30 --reason completed

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          gh issue comment 30 --body "beta8 v2 release workflow failed. patch=${{ steps.patch.outcome }}, tests=${{ steps.tests.outcome }}, publish=${{ steps.publish.outcome }}" || true
