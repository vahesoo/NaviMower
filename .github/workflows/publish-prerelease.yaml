name: Publish integration prerelease

on:
  push:
    branches:
      - main
    paths:
      - custom_components/navimower/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("custom_components/navimower/manifest.json")
          print(json.loads(manifest.read_text(encoding="utf-8"))["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          case "${VERSION}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish GitHub prerelease
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          NOTES=".github/release-notes/${VERSION}.md"
          BODY="${RUNNER_TEMP}/release-notes.md"

          test -f "${NOTES}"
          TITLE="$(sed -n '1s/^title: //p' "${NOTES}")"
          test -n "${TITLE}"
          tail -n +3 "${NOTES}" > "${BODY}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            exit 0
          fi

          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAG_SHA}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already points to ${TAG_SHA}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --notes-file "${BODY}" \
            --prerelease
