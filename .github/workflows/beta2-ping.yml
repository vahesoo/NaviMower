name: Beta2 ping
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  ping:
    if: github.event.issue.title == 'PING BETA2'
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "PING-OK"
