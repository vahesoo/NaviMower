name: Emergency unpublish beta41

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-unpublish-beta41.yml

permissions:
  contents: write

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Remove beta41 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.4.5-beta41 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          if gh release view v0.4.5-beta41 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "beta41 release still exists"
            exit 1
          fi
