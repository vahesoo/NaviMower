name: Finalize Navimower 0.4.1-beta3 v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.comment.body == 'RUN-BETA3-RELEASE-V2'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and test beta3
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/beta3-v2.log) 2>&1
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/beta3-release-temp.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(script, 'beta3-release-temp.yml', 'exec'))

          p = Path('tests/test_telemetry_stability.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '# Starting a new cycle clears task counters, but raw per-zone map coverage is retained.',
              '# Starting a new cycle preserves the valid vendor counters exactly as received.',
              1,
          )
          old = '''assert snapshot["mowing_progress"] == 0\nassert snapshot["coverage"]["overall_pct"] == 95\nassert snapshot["session_area"] == 0.0\nassert snapshot["cycle_value_reset_pending"] is True\n'''
          new = '''assert snapshot["mowing_progress"] == 95\nassert snapshot["coverage"]["overall_pct"] == 95\nassert snapshot["session_area"] == 1773.48\nassert snapshot["cycle_value_reset_pending"] is False\n'''
          if old not in s:
              raise SystemExit('new-cycle telemetry assertions missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              '# A low fresh row confirms the new cycle and releases the hold.',
              '# A low fresh row is accepted directly as the next vendor value.',
              1,
          )
          s = s.replace(
              '# A one-off zero/regression inside the same cycle is rejected.',
              '# A valid zero/regression inside the same cycle is preserved.',
              1,
          )
          old = '''assert snapshot["mowing_progress"] == 51\nassert snapshot["session_area"] == 903.39\nassert snapshot["total_area"] == 1751.884\n'''
          new = '''assert snapshot["mowing_progress"] == 48\nassert snapshot["session_area"] == 0.0\nassert snapshot["total_area"] == 1751.884\n'''
          if old not in s:
              raise SystemExit('regression telemetry assertions missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install --upgrade pytest voluptuous cryptography
          python -m compileall -q custom_components/navimower
          python -m pytest -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/beta3-release-temp.yml .github/workflows/beta3-finalizer-temp.yml .github/workflows/beta3-finalizer-v2-temp.yml
          git add -A
          git commit -m "Release Navimower 0.4.1-beta3"
          git push origin HEAD:main
          VERSION="0.4.1-beta3"
          TAG="v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          NOTES=".github/release-notes/${VERSION}.md"
          BODY="${RUNNER_TEMP}/release-notes.md"
          TITLE="$(sed -n '1s/^title: //p' "${NOTES}")"
          tail -n +3 "${NOTES}" > "${BODY}"
          git fetch --tags origin
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            git tag "${TAG}" "${SHA}"
            git push origin "${TAG}"
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --target "${SHA}" --title "${TITLE}" --notes-file "${BODY}" --prerelease
          fi
      - name: Report result
        if: always()
        shell: bash
        run: |
          {
            echo "beta3 v2 finalizer outcome: ${{ steps.build.outcome }}"
            echo
            echo '```text'
            tail -n 180 /tmp/beta3-v2.log 2>/dev/null || true
            echo '```'
          } > /tmp/result.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/result.md
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
