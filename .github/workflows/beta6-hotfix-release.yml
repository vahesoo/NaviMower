name: Temporary Navimower beta6 hotfix release

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.number == 28 && github.event.comment.body == 'RUN-BETA6-RELEASE'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply beta6 hotfix
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          root = Path('.')
          component = root / 'custom_components' / 'navimower'

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Runtime fix: beta5 used OPT_PASSIVE_DISCOVERY in NavimowerMqttBridge
          # without importing it from const.py.
          replace_once(
              component / 'mqtt.py',
              '    DEFAULT_PASSIVE_DISCOVERY,\n    MQTT_BROKER,\n',
              '    DEFAULT_PASSIVE_DISCOVERY,\n    MQTT_BROKER,\n    OPT_PASSIVE_DISCOVERY,\n',
          )

          manifest_path = component / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '0.4.1-beta5':
              raise SystemExit(f"unexpected manifest version: {manifest.get('version')}")
          manifest['version'] = '0.4.1-beta6'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          # Keep beta5 discovery feature tests, but make the historical beta5 notes
          # independent of the current manifest version.
          beta5_test = root / 'tests' / 'test_v041_beta5.py'
          beta5_text = beta5_test.read_text(encoding='utf-8')
          old_beta5 = '''def test_beta5_version_and_notes():\n    manifest = json.loads((COMPONENT / "manifest.json").read_text())\n    assert manifest["version"] == "0.4.1-beta5"\n    notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta5.md").read_text()\n'''
          new_beta5 = '''def test_beta5_discovery_notes():\n    notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta5.md").read_text()\n'''
          if old_beta5 not in beta5_text:
              raise SystemExit('beta5 test anchor missing')
          beta5_test.write_text(beta5_text.replace(old_beta5, new_beta5, 1), encoding='utf-8')

          current_test = root / 'tests' / 'test_v034_release.py'
          current_text = current_test.read_text(encoding='utf-8')
          old_current = '''    assert manifest["version"] == "0.4.1-beta5"\n    notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta5.md").read_text()\n    assert notes.startswith("title: Navimower 0.4.1-beta5")\n    assert "Passive protocol discovery" in notes\n    assert "current-device-only" in notes\n    assert "off by default" in notes\n'''
          new_current = '''    assert manifest["version"] == "0.4.1-beta6"\n    notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta6.md").read_text()\n    assert notes.startswith("title: Navimower 0.4.1-beta6")\n    assert "startup hotfix" in notes.lower()\n    assert "OPT_PASSIVE_DISCOVERY" in notes\n    assert "Passive protocol discovery" in notes\n'''
          if old_current not in current_text:
              raise SystemExit('current release test anchor missing')
          current_test.write_text(current_text.replace(old_current, new_current, 1), encoding='utf-8')

          beta6_test = textwrap.dedent('''\
              """Regression contracts for Navimower 0.4.1-beta6 startup hotfix."""
              from __future__ import annotations

              import ast
              import json
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              COMPONENT = ROOT / "custom_components" / "navimower"


              def test_beta6_version_and_notes() -> None:
                  manifest = json.loads((COMPONENT / "manifest.json").read_text())
                  assert manifest["version"] == "0.4.1-beta6"
                  notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta6.md").read_text()
                  assert "OPT_PASSIVE_DISCOVERY" in notes
                  assert "startup" in notes.lower()


              def test_mqtt_bridge_imports_passive_discovery_option() -> None:
                  source = (COMPONENT / "mqtt.py").read_text()
                  tree = ast.parse(source)
                  imported_from_const: set[str] = set()
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ImportFrom) and node.module == "const":
                          imported_from_const.update(alias.name for alias in node.names)
                  assert "DEFAULT_PASSIVE_DISCOVERY" in imported_from_const
                  assert "OPT_PASSIVE_DISCOVERY" in imported_from_const
                  assert "entry.options.get(OPT_PASSIVE_DISCOVERY, DEFAULT_PASSIVE_DISCOVERY)" in source


              def test_passive_discovery_option_exists_in_const() -> None:
                  source = (COMPONENT / "const.py").read_text()
                  assert 'OPT_PASSIVE_DISCOVERY: Final = "passive_discovery"' in source
                  assert "DEFAULT_PASSIVE_DISCOVERY: Final = False" in source
          ''')
          (root / 'tests' / 'test_v041_beta6.py').write_text(beta6_test, encoding='utf-8')

          notes = textwrap.dedent('''\
              title: Navimower 0.4.1-beta6

              ## Passive discovery startup hotfix

              Beta5 introduced **Passive protocol discovery**, but its MQTT bridge referenced `OPT_PASSIVE_DISCOVERY` without importing that constant from `const.py`. This caused Navimower config entries to fail during setup before MQTT could start.

              - Import `OPT_PASSIVE_DISCOVERY` in `mqtt.py`, restoring normal config-entry startup for all mowers.
              - Add a regression contract that parses the MQTT bridge and verifies both passive-discovery constants are imported before a release can pass CI.
              - Keep the beta5 Passive protocol discovery feature unchanged: it remains opt-in and off by default.
              - Keep beta4 pose-degraded recovery and beta3 raw-first telemetry behaviour unchanged.

              Beta6 supersedes the withdrawn beta5 prerelease. Users who installed beta5 should update to beta6 and restart or reload Navimower.
          ''')
          notes_path = root / '.github' / 'release-notes' / '0.4.1-beta6.md'
          notes_path.write_text(notes, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          changelog_text = changelog.read_text(encoding='utf-8')
          heading = '# Changelog\n\n'
          if not changelog_text.startswith(heading):
              raise SystemExit('changelog heading missing')
          entry = textwrap.dedent('''\
              ## 0.4.1-beta6 - passive discovery startup hotfix

              - Fix the beta5 startup regression by importing `OPT_PASSIVE_DISCOVERY` in the MQTT bridge.
              - Add a release regression test that verifies the passive-discovery option constants are actually imported where they are used.
              - Preserve beta5 Passive protocol discovery behaviour unchanged; the feature remains opt-in and off by default.

          ''')
          changelog.write_text(heading + entry + changelog_text[len(heading):], encoding='utf-8')
          PY

      - name: Validate full test suite
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/navimower
          python -m pip install --upgrade pytest voluptuous cryptography
          python -m pytest -q

      - name: Publish beta6
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/beta6-hotfix-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Navimower 0.4.1-beta6"
          git push origin HEAD:main
          RELEASE_SHA="$(git rev-parse HEAD)"
          gh release create v0.4.1-beta6 --prerelease --target "$RELEASE_SHA" --title "Navimower 0.4.1-beta6" --notes-file .github/release-notes/0.4.1-beta6.md
          gh issue comment 28 --body "beta6 release published successfully at commit $RELEASE_SHA; full test suite passed."
          gh issue close 28 --reason completed

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          gh issue comment 28 --body "beta6 release workflow failed. patch=${{ steps.patch.outcome }}, tests=${{ steps.tests.outcome }}, publish=${{ steps.publish.outcome }}" || true
