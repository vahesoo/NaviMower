name: Prepare 0.4.1-beta2 patch

on:
  push:
    branches:
      - release/0.4.1-beta2
    paths:
      - .github/workflows/beta2-prep-temp.yaml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.1-beta2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply beta2 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_regex(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, found {count}')
              return updated

          # ---------------------------------------------------------------- coordinator
          path = 'custom_components/navimower/coordinator.py'
          text = read(path)

          old = '''        encoded_zone_height = any(\n            value not in (None, 0, 256)\n            and _normalize_cutting_height_mm(value) is None\n            for value in raw_zone_heights\n        )\n        cutting_height_supported = bool(\n            not encoded_zone_height\n            and (\n                normalized_cut_height is not None\n                or any(value is not None for value in zone_height_values)\n            )\n        )\n'''
          new = '''        # A vendor-specific/encoded zone value must not disable cutting-height\n        # support for the whole mower. Known global/zone heights prove the\n        # feature exists; unknown raw zone markers are handled per-zone below.\n        cutting_height_supported = bool(\n            normalized_cut_height is not None\n            or any(value is not None for value in zone_height_values)\n        )\n'''
          text = replace_once(text, old, new, 'cutting-height capability')

          old = '''            raw_height = _as_int(boundary.get("height_set"))\n            inherits = raw_height in (None, 0, 256)\n            configured_height = None if inherits else _normalize_cutting_height_mm(raw_height)\n            effective_height = None\n            if cutting_height_supported:\n                effective_height = global_height if inherits else configured_height\n'''
          new = '''            raw_height = _as_int(boundary.get("height_set"))\n            normalized_height = _normalize_cutting_height_mm(raw_height)\n            known_inherit = raw_height in (None, 0, 256)\n            unknown_encoded = (\n                raw_height not in (None, 0, 256) and normalized_height is None\n            )\n            configured_height = None if known_inherit or unknown_encoded else normalized_height\n            effective_height = None\n            if cutting_height_supported:\n                # Do not invent a numeric meaning for encoded markers such as\n                # 316. The global height is the safest effective display value\n                # while inheritance itself remains unknown.\n                effective_height = (\n                    global_height\n                    if known_inherit or unknown_encoded\n                    else configured_height\n                )\n            inherits = True if known_inherit else None if unknown_encoded else False\n'''
          text = replace_once(text, old, new, 'per-zone cutting height')

          old = '''        map_geom = self._map_geometry or {}\n\n        # Coverage and position. MQTT is authoritative while fresh; private\n'''
          new = '''        map_geom = self._map_geometry or {}\n        device_info = raw.get("device_info") or {}\n        mowing_extend = _find(device_info, "mowingExtend", "mowing_extend") or {}\n        mowing_path_width_raw = _as_float(\n            _find(mowing_extend, "mowingPathWidth", "mowing_path_width")\n        )\n        mowing_path_width_m = None\n        if mowing_path_width_raw is not None and mowing_path_width_raw > 0:\n            candidate_width = (\n                mowing_path_width_raw / 1000.0\n                if mowing_path_width_raw > 10\n                else mowing_path_width_raw\n            )\n            if 0.1 <= candidate_width <= 2.0:\n                mowing_path_width_m = candidate_width\n\n        # Coverage and position. MQTT is authoritative while fresh; private\n'''
          text = replace_once(text, old, new, 'mowing path width parsing')

          old = '''            "cutting_height_supported": cutting_height_supported,\n            # groups\n'''
          new = '''            "cutting_height_supported": cutting_height_supported,\n            "mowing_path_width_m": mowing_path_width_m,\n            # groups\n'''
          text = replace_once(text, old, new, 'mowing path width snapshot')

          old = '''        active_progress_zone = mqtt_zone_id or cloud_zone_id or physical_zone_id\n'''
          new = '''        # Work/zone progress belongs only to an explicit work target. A mower\n        # can physically cross another zone while the vendor progress counter\n        # still belongs to the target zone; never reassign it by physical pose.\n        active_progress_zone = mqtt_zone_id or cloud_zone_id\n        if active_progress_zone is None and active:\n            active_progress_zone = previous_zone_id = _valid_zone_id(\n                previous.get("active_zone_progress_zone_id")\n            )\n        else:\n            previous_zone_id = _valid_zone_id(\n                previous.get("active_zone_progress_zone_id")\n            )\n'''
          text = replace_once(text, old, new, 'active progress owner')

          old = '''        previous_zone_id = _valid_zone_id(\n            previous.get("active_zone_progress_zone_id")\n        )\n        previous_zone_progress = _progress_percent(\n'''
          new = '''        previous_zone_progress = _progress_percent(\n'''
          text = replace_once(text, old, new, 'dedupe previous progress owner')

          old = '''        active_zone_id = _as_int(snapshot.get("current_physical_zone_id"))\n        if active_zone_id is None:\n            candidates = snapshot.get("current_zone_ids") or []\n            if len(candidates) == 1:\n                active_zone_id = _as_int(candidates[0])\n'''
          new = '''        # The zone model's active progress owner is the vendor work target,\n        # not necessarily the polygon the mower is physically crossing.\n        active_zone_id = _as_int(snapshot.get("active_zone_progress_zone_id"))\n        if active_zone_id is None:\n            active_zone_id = _as_int(snapshot.get("current_physical_zone_id"))\n        if active_zone_id is None:\n            candidates = snapshot.get("current_zone_ids") or []\n            if len(candidates) == 1:\n                active_zone_id = _as_int(candidates[0])\n'''
          text = replace_once(text, old, new, 'zone model progress owner')
          write(path, text)

          # ---------------------------------------------------------------- history
          path = 'custom_components/navimower/history.py'
          text = read(path)

          old = '''    merged["cycle_reset_zone_ids"] = _unique_ints(\n        previous.get("cycle_reset_zone_ids"),\n        continuation.get("cycle_reset_zone_ids"),\n    )\n\n    points = [\n'''
          new = '''    merged["cycle_reset_zone_ids"] = _unique_ints(\n        previous.get("cycle_reset_zone_ids"),\n        continuation.get("cycle_reset_zone_ids"),\n    )\n    merged["zone_cycle_boundaries"] = sorted(\n        [\n            dict(item)\n            for item in [\n                *(previous.get("zone_cycle_boundaries") or []),\n                *(continuation.get("zone_cycle_boundaries") or []),\n            ]\n            if isinstance(item, dict)\n        ],\n        key=lambda item: _as_int(item.get("at_ms")) or 0,\n    )\n\n    points = [\n'''
          text = replace_once(text, old, new, 'merge zone cycle boundaries')

          text = replace_regex(
              text,
              r'''    def prepare_cycle\(\n        self,\n        snapshot: dict\[str, Any\],\n        \*,\n        pose_time: Any,\n    \) -> bool:\n.*?\n    def cycle_diagnostics\(self\) -> dict\[str, Any\]:''',
              '''    def prepare_cycle(\n        self,\n        snapshot: dict[str, Any],\n        *,\n        pose_time: Any,\n    ) -> bool:\n        """Record confirmed per-zone vendor cycle boundaries without splitting a task.\n\n        The vendor work counter belongs to one explicit work-target zone. A\n        reset in that counter starts a new cycle for that zone only; it must not\n        finalize the whole multi-zone mowing session.\n        """\n        rows = self._progress_rows(snapshot)\n        if not rows:\n            return False\n        owner_zone_id = _as_int(snapshot.get("active_zone_progress_zone_id"))\n        reset_rows: list[tuple[dict[str, Any], dict[str, Any], int]] = []\n        with self._lock:\n            active = self._cache.get(self._active_id or "")\n            for row in rows:\n                zone_id = _as_int(row.get("id"))\n                if zone_id is None:\n                    continue\n                # While mowing, only the explicit vendor work target may own a\n                # live progress reset. This prevents physical zone transitions\n                # from reassigning one counter to a neighbouring zone.\n                if active is not None and owner_zone_id is not None and zone_id != owner_zone_id:\n                    continue\n                previous = dict(self._zone_progress_state.get(str(zone_id)) or {})\n                old_progress = _as_int(previous.get("progress"))\n                peak_progress = _as_int(previous.get("peak_progress"))\n                if peak_progress is None:\n                    peak_progress = old_progress\n                new_progress = _as_int(row.get("progress"))\n                old_start = _as_int(previous.get("start_time"))\n                new_start = _as_int(row.get("start_time"))\n                drop = (\n                    peak_progress - new_progress\n                    if peak_progress is not None and new_progress is not None\n                    else None\n                )\n                hard_reset = bool(\n                    drop is not None and (\n                        (peak_progress >= 15 and new_progress <= 5 and drop >= 15)\n                        or (peak_progress >= 50 and new_progress <= 20 and drop >= 30)\n                    )\n                )\n                timestamp_reset = bool(\n                    old_progress is not None and new_progress is not None\n                    and old_start is not None and new_start is not None\n                    and new_start > old_start and new_progress <= 25\n                    and old_progress - new_progress >= 10\n                )\n                if active is not None and (hard_reset or timestamp_reset):\n                    reset_rows.append((previous, row, peak_progress or old_progress or 0))\n\n            if reset_rows and active is not None:\n                boundary_ms = _timestamp_ms(pose_time)\n                reset_zone_ids: list[int] = []\n                final_progress: dict[str, int] = {}\n                completed_flags: list[bool] = []\n                boundaries = active.setdefault("zone_cycle_boundaries", [])\n                for _previous, row, previous_peak in reset_rows:\n                    zone_id = _as_int(row.get("id"))\n                    if zone_id is None:\n                        continue\n                    new_start = _as_int(row.get("start_time"))\n                    at_ms = _timestamp_ms(new_start) if new_start is not None else boundary_ms\n                    duplicate = any(\n                        _as_int(item.get("zone_id")) == zone_id\n                        and abs((_as_int(item.get("at_ms")) or 0) - at_ms) <= 60_000\n                        for item in boundaries\n                        if isinstance(item, dict)\n                    )\n                    if not duplicate:\n                        boundaries.append({\n                            "zone_id": zone_id,\n                            "at_ms": at_ms,\n                            "at": _iso(at_ms),\n                            "reason": "vendor_progress_reset",\n                            "previous_peak": previous_peak,\n                        })\n                    reset_zone_ids.append(zone_id)\n                    final_progress[str(zone_id)] = previous_peak\n                    completed_zone = previous_peak >= VENDOR_COMPLETION_PROGRESS_MIN\n                    completed_flags.append(completed_zone)\n                    if completed_zone:\n                        record = dict(self._zone_history.get(str(zone_id)) or {})\n                        record.update({\n                            "id": zone_id,\n                            "name": row.get("name") or record.get("name") or f"Zone {zone_id}",\n                            "last_completed_at": _iso(at_ms),\n                            "last_completed_progress": previous_peak,\n                        })\n                        self._zone_history[str(zone_id)] = record\n                self._update_active_metadata_locked(active)\n                self._last_cycle_event = {\n                    "reason": "vendor_zone_cycle_reset",\n                    "at_ms": boundary_ms,\n                    "at": _iso(boundary_ms),\n                    "zone_ids": _unique_ints(reset_zone_ids),\n                    "completed": bool(completed_flags) and all(completed_flags),\n                    "final_progress": final_progress,\n                    "source": "vendor_progress",\n                }\n                self._trail_revision += 1\n                self._schedule_active_save()\n                _LOGGER.info(\n                    "Recorded Navimower zone cycle boundary for zone(s) %s without splitting session %s",\n                    ", ".join(str(value) for value in reset_zone_ids),\n                    active.get("id"),\n                )\n\n            reset_zone_ids = {\n                _as_int(row.get("id")) for _previous, row, _peak in reset_rows\n            }\n            for row in rows:\n                zone_id = _as_int(row.get("id"))\n                if zone_id is None:\n                    continue\n                progress = _as_int(row.get("progress"))\n                previous = self._zone_progress_state.get(str(zone_id)) or {}\n                previous_peak = _as_int(previous.get("peak_progress"))\n                if previous_peak is None:\n                    previous_peak = _as_int(previous.get("progress"))\n                if zone_id in reset_zone_ids:\n                    peak = progress\n                else:\n                    known = [value for value in (previous_peak, progress) if value is not None]\n                    peak = max(known) if known else None\n                self._zone_progress_state[str(zone_id)] = {\n                    "progress": progress,\n                    "peak_progress": peak,\n                    "start_time": _as_int(row.get("start_time")),\n                    "end_time": _as_int(row.get("end_time")),\n                    "observed_at_ms": _timestamp_ms(pose_time),\n                }\n        self._schedule_index_save()\n        return bool(reset_rows)\n\n    def cycle_diagnostics(self) -> dict[str, Any]:''',
              'prepare_cycle implementation',
          )

          old = '''        active_zone_progress: Any = None,\n        cycle_reset_pending: bool = False,\n    ) -> None:\n'''
          new = '''        active_zone_progress: Any = None,\n        active_progress_zone_id: Any = None,\n        cycle_reset_pending: bool = False,\n    ) -> None:\n'''
          text = replace_once(text, old, new, 'zone history signature')

          old = '''                active_zone_id = None\n                if active.get("visited_zone_ids"):\n                    active_zone_id = _as_int(active.get("visited_zone_ids")[-1])\n'''
          new = '''                # Progress ownership comes from the explicit vendor work\n                # target, never from the last polygon the mower physically visited.\n                active_zone_id = _as_int(active_progress_zone_id)\n'''
          text = replace_once(text, old, new, 'history progress owner')

          old = '''            active_zone_progress=snapshot.get("active_zone_progress"),\n            cycle_reset_pending=bool(snapshot.get("cycle_value_reset_pending")),\n'''
          new = '''            active_zone_progress=snapshot.get("active_zone_progress"),\n            active_progress_zone_id=snapshot.get("active_zone_progress_zone_id"),\n            cycle_reset_pending=bool(snapshot.get("cycle_value_reset_pending")),\n'''
          text = replace_once(text, old, new, 'history snapshot progress owner')
          write(path, text)

          # ---------------------------------------------------------------- daily trails
          path = 'custom_components/navimower/zone_state.py'
          text = read(path)
          replacement = '''def build_daily_trails(\n    *,\n    sessions: list[dict[str, Any]],\n    map_zones: list[dict[str, Any]],\n    local_date: date,\n    to_local_date,\n    revision: int,\n) -> dict[str, Any]:\n    """Keep today's route for the latest confirmed mowing cycle of every zone.\n\n    One multi-zone mowing task stays one history session. Per-zone vendor cycle\n    boundaries can therefore occur inside a session; only the affected zone is\n    cleared when the route first reaches that boundary. The active route remains\n    owned by the card's live layer.\n    """\n    by_zone: dict[int, dict[str, Any]] = {}\n    boundary_before_next: set[int] = set()\n    ordered = sorted(\n        (item for item in sessions if isinstance(item, dict)),\n        key=lambda item: as_int(item.get("started_at_ms")) or 0,\n    )\n\n    for session in ordered:\n        session_id = str(session.get("id") or "")\n        if not session_id:\n            continue\n        points = session.get("points") or []\n        if not isinstance(points, list) or not points:\n            continue\n        active = bool(session.get("active"))\n        starts = {\n            value\n            for value in (as_int(item) for item in session.get("segment_starts_ms") or [])\n            if value is not None\n        }\n        explicit_reset_zones = {\n            value\n            for value in (as_int(item) for item in session.get("cycle_reset_zone_ids") or [])\n            if value is not None\n        }\n        boundary_times: dict[int, list[int]] = {}\n        for item in session.get("zone_cycle_boundaries") or []:\n            if not isinstance(item, dict):\n                continue\n            zone_id = as_int(item.get("zone_id"))\n            at_ms = as_int(item.get("at_ms"))\n            if zone_id is not None and at_ms is not None:\n                boundary_times.setdefault(zone_id, []).append(at_ms)\n        for values in boundary_times.values():\n            values.sort()\n        boundary_index = {zone_id: 0 for zone_id in boundary_times}\n\n        encountered_zones: set[int] = set()\n        current_zone: int | None = None\n        current_segment: list[list[float]] = []\n\n        def flush() -> None:\n            nonlocal current_segment\n            if current_zone is not None and len(current_segment) >= 2 and not active:\n                simplified = simplify_xy_points(current_segment)\n                if len(simplified) >= 2:\n                    row = by_zone.get(current_zone)\n                    if row is None:\n                        row = {\n                            "zone_id": current_zone,\n                            "cycle_id": session_id,\n                            "active": False,\n                            "segments": [],\n                            "point_count": 0,\n                        }\n                        by_zone[current_zone] = row\n                    row["segments"].append(simplified)\n                    row["point_count"] += len(current_segment)\n            current_segment = []\n\n        for raw in points:\n            if not isinstance(raw, list) or len(raw) < 3:\n                continue\n            stamp = as_int(raw[0])\n            x, y = as_float(raw[1]), as_float(raw[2])\n            if (\n                stamp is None\n                or x is None\n                or y is None\n                or to_local_date(stamp) != local_date\n            ):\n                flush()\n                current_zone = None\n                continue\n            zone_id = as_int(raw[7]) if len(raw) > 7 else None\n            if zone_id is None:\n                zone_id = zone_id_for_point(x, y, map_zones)\n            if zone_id is None:\n                flush()\n                current_zone = None\n                continue\n            encountered_zones.add(zone_id)\n\n            # A completed previous cycle or explicit reset clears this zone only\n            # when the new route actually enters it.\n            if zone_id in boundary_before_next or zone_id in explicit_reset_zones:\n                flush()\n                by_zone.pop(zone_id, None)\n                boundary_before_next.discard(zone_id)\n                explicit_reset_zones.discard(zone_id)\n                current_zone = None\n\n            # Apply any in-session per-zone cycle boundary before the first point\n            # at/after its vendor timestamp. Pre-boundary fragments are flushed\n            # first, then removed, so only the new zone cycle survives.\n            values = boundary_times.get(zone_id) or []\n            index = boundary_index.get(zone_id, 0)\n            while index < len(values) and stamp >= values[index]:\n                flush()\n                by_zone.pop(zone_id, None)\n                current_zone = None\n                index += 1\n            boundary_index[zone_id] = index\n\n            fragment_boundary = stamp in starts and current_segment\n            if zone_id != current_zone or fragment_boundary:\n                flush()\n                current_zone = zone_id\n            current_segment.append([x, y])\n        flush()\n\n        reason = str(session.get("completion_reason") or "").lower()\n        final_progress_zone_ids = {\n            value\n            for value in (\n                as_int(item) for item in (session.get("final_progress") or {}).keys()\n            )\n            if value is not None\n        }\n        if "reset" in reason or session.get("completed") is True:\n            boundary_zones = (\n                final_progress_zone_ids\n                or encountered_zones\n                or {\n                    value\n                    for value in (as_int(item) for item in session.get("zone_ids") or [])\n                    if value is not None\n                }\n            )\n            boundary_before_next.update(boundary_zones)\n\n    result = []\n    for zone_id in sorted(by_zone):\n        row = deepcopy(by_zone[zone_id])\n        row["segments"] = [segment for segment in row["segments"] if len(segment) >= 2]\n        row["render_point_count"] = sum(len(segment) for segment in row["segments"])\n        if row["segments"]:\n            result.append(row)\n    return {\n        "date": local_date.isoformat(),\n        "revision": revision,\n        "zones": result,\n    }\n'''
          text = replace_regex(text, r'def build_daily_trails\(.*\Z', replacement, 'daily trail builder')
          write(path, text)

          # ---------------------------------------------------------------- session SVG width
          path = 'custom_components/navimower/session_svg.py'
          text = read(path)
          text = replace_once(text, 'SESSION_SVG_ARCHIVE_VERSION = 1', 'SESSION_SVG_ARCHIVE_VERSION = 2', 'SVG archive version')
          old = '''def _adaptive_grid_size(cutting_segments: list[list[list[float]]]) -> float:\n    length = _polyline_length(cutting_segments)\n    estimated_area = max(SWATH_WIDTH_M * length, SWATH_WIDTH_M**2)\n'''
          new = '''def _adaptive_grid_size(\n    cutting_segments: list[list[list[float]]],\n    width_m: float = SWATH_WIDTH_M,\n) -> float:\n    length = _polyline_length(cutting_segments)\n    estimated_area = max(width_m * length, width_m**2)\n'''
          text = replace_once(text, old, new, 'adaptive SVG width')
          text = replace_once(text, '    cell = _adaptive_grid_size(cutting_segments)\n', '    cell = _adaptive_grid_size(cutting_segments, width_m)\n', 'raster SVG width')
          old = '''    occupied, grid_size = _rasterize_swath(cutting_segments)\n    loops = _boundary_loops(occupied) if occupied else []\n'''
          new = '''    swath_width = _as_float(session.get("mowing_path_width_m"))\n    if swath_width is None or not 0.1 <= swath_width <= 2.0:\n        swath_width = SWATH_WIDTH_M\n    occupied, grid_size = _rasterize_swath(\n        cutting_segments, width_m=swath_width\n    )\n    loops = _boundary_loops(occupied) if occupied else []\n'''
          text = replace_once(text, old, new, 'archive swath width')
          text = replace_once(text, '            "swath_width_m": SWATH_WIDTH_M,\n', '            "swath_width_m": swath_width,\n', 'archive width metadata')
          write(path, text)

          # ---------------------------------------------------------------- archive uses current mower width for legacy sessions
          path = 'custom_components/navimower/session_archive.py'
          text = read(path)
          old = '''            artifact = await self.hass.async_add_executor_job(\n                build_session_svg_archive,\n                deepcopy(session),\n            )\n'''
          new = '''            render_session = deepcopy(session)\n            if render_session.get("mowing_path_width_m") is None:\n                width = (self.coordinator.data or {}).get("mowing_path_width_m")\n                if width is not None:\n                    render_session["mowing_path_width_m"] = width\n            artifact = await self.hass.async_add_executor_job(\n                build_session_svg_archive,\n                render_session,\n            )\n'''
          text = replace_once(text, old, new, 'legacy session render width')
          write(path, text)

          # ---------------------------------------------------------------- manifest
          path = 'custom_components/navimower/manifest.json'
          manifest = json.loads(read(path))
          manifest['version'] = '0.4.1-beta2'
          write(path, json.dumps(manifest, indent=2) + '\n')

          # ---------------------------------------------------------------- release notes
          notes = '''title: Navimower 0.4.1-beta2\n\n## Zone progress and coverage ownership\n\nThis beta fixes the field-reported i105 case where coverage percentages could move to the wrong zone while the mower crossed between mapped areas. The vendor work-progress counter is now owned only by its explicit work-target zone; the physical polygon under the mower remains a separate position signal and can no longer steal that progress value.\n\n- Zone coverage/progress no longer follows `current_physical_zone_id` or the last visited polygon.\n- The previous explicit work target is retained briefly when a live target packet is missing instead of falling back to physical position.\n- The central zone model uses the resolved progress owner for active progress while keeping physical-zone and gate/channel logic separate.\n- This directly addresses reports where, for example, a 26% West Strasse work counter appeared on Nord-Seite or West Haus.\n\n## Session and daily-trail stability\n\nPer-zone vendor progress resets no longer split an entire multi-zone mowing task into a chain of tiny history sessions. A confirmed reset is recorded as a boundary for that zone inside the existing session.\n\n- Multi-zone mowing remains one history session across normal zone transitions.\n- Confirmed vendor resets are accepted only for the explicit progress-owner zone while a task is active.\n- Daily trails clear only the affected zone when the new zone cycle actually reaches its boundary.\n- Completed trails in unrelated zones remain visible for the rest of the local day.\n- The fix prevents the repeated 4-6 second `vendor_cycle_reset_partial` session fragments seen in the supplied i105 diagnostics.\n\n## Cutting-height compatibility\n\nA vendor-specific raw zone height must no longer disable cutting-height support for the whole mower. Known global or per-zone millimetre values prove support; unknown encoded markers are handled only for the affected zone.\n\n- Raw markers such as `316` are not decoded into an invented millimetre value.\n- When an encoded marker is unknown, the current global cutting height is used as the safe effective display value while inheritance remains unknown.\n- Other zones with normal numeric heights continue to expose their real values.\n\n## Mowing-footprint width\n\nCompleted-session SVG footprints now use the mower's reported `mowingPathWidth` instead of assuming a universal 0.25 m swath. This fixes visible unmowed-looking stripes on wider-path models such as the X-series. Existing cached render archives are versioned forward and are rebuilt lazily; legacy sessions can use the current mower's reported width when they do not contain one themselves.\n\n## Carried forward from 0.4.1-beta1\n\nThe beta1 fixes remain included: docked `Live position valid`/custom Channel stability, the pending-start exception, and the guarded private-cloud polling task that prevents dense MQTT pose pushes from starving normal private-cloud refreshes. Navimower does not require the older NavimowHA integration to remain enabled.\n\n## Testing\n\nRegression coverage includes progress-owner isolation, in-session zone-cycle boundaries, same-day trail replacement for only the affected zone, dynamic SVG swath width, encoded cutting-height handling, the beta1 stability contracts, compile checks and the full existing pytest suite.\n\nThis is a prerelease intended for field validation before stable 0.4.1.\n'''
          write('.github/release-notes/0.4.1-beta2.md', notes)

          # ---------------------------------------------------------------- beta2 regressions
          tests = '''"""Regression contracts for Navimower 0.4.1-beta2."""\nfrom __future__ import annotations\n\nfrom datetime import date\nimport importlib.util\nimport json\nfrom pathlib import Path\nimport sys\nimport types\n\nROOT = Path(__file__).resolve().parents[1]\nCOMPONENT = ROOT / "custom_components" / "navimower"\nPACKAGE = "navimower_v041_beta2_test"\n\n\ndef _load(name: str, path: Path):\n    spec = importlib.util.spec_from_file_location(name, path)\n    assert spec and spec.loader\n    module = importlib.util.module_from_spec(spec)\n    sys.modules[name] = module\n    spec.loader.exec_module(module)\n    return module\n\n\ndef test_release_version_and_notes() -> None:\n    manifest = json.loads((COMPONENT / "manifest.json").read_text())\n    assert manifest["version"] == "0.4.1-beta2"\n    notes = (ROOT / ".github" / "release-notes" / "0.4.1-beta2.md").read_text()\n    assert "Zone progress and coverage ownership" in notes\n    assert "Mowing-footprint width" in notes\n    assert "316" in notes\n\n\ndef test_progress_owner_never_falls_back_to_physical_zone() -> None:\n    source = (COMPONENT / "coordinator.py").read_text()\n    block = source.split("mqtt_zone_id = _valid_zone_id", 1)[1].split("snapshot[\"coverage\"]", 1)[0]\n    assert "active_progress_zone = mqtt_zone_id or cloud_zone_id" in block\n    assert "or physical_zone_id" not in block\n    refresh = source.split("def _refresh_zone_model", 1)[1].split("def _session_completed", 1)[0]\n    assert 'snapshot.get("active_zone_progress_zone_id")' in refresh\n\n\ndef test_history_uses_explicit_progress_owner_and_does_not_split_session() -> None:\n    source = (COMPONENT / "history.py").read_text()\n    update = source.split("def update_zone_history", 1)[1].split("def update_from_snapshot", 1)[0]\n    assert "active_progress_zone_id" in update\n    assert 'active.get("visited_zone_ids")[-1]' not in update\n    prepare = source.split("def prepare_cycle", 1)[1].split("def cycle_diagnostics", 1)[0]\n    assert 'snapshot.get("active_zone_progress_zone_id")' in prepare\n    assert 'active.setdefault("zone_cycle_boundaries", [])' in prepare\n    assert "_finish_active_locked" not in prepare\n    assert "_discard_active_locked" not in prepare\n\n\ndef test_unknown_zone_height_does_not_disable_whole_mower() -> None:\n    source = (COMPONENT / "coordinator.py").read_text()\n    capability = source.split("raw_zone_heights =", 1)[1].split("settings =", 1)[0]\n    assert "encoded_zone_height" not in capability\n    assert "any(value is not None for value in zone_height_values)" in capability\n    detail = source.split("def _build_zone_details", 1)[1].split("def _apply_active_zone_progress", 1)[0]\n    assert "unknown_encoded" in detail\n    assert "global_height" in detail\n\n\ndef test_daily_trail_zone_boundary_replaces_only_that_zone_inside_one_session() -> None:\n    package = types.ModuleType(PACKAGE)\n    package.__path__ = [str(COMPONENT)]\n    sys.modules.setdefault(PACKAGE, package)\n    _load(f"{PACKAGE}.const", COMPONENT / "const.py")\n    zone_state = _load(f"{PACKAGE}.zone_state", COMPONENT / "zone_state.py")\n    day = date(2026, 8, 7)\n    def point(stamp, x, zone):\n        return [stamp, x, 1.0, 0.0, "mowing", 4, -1, zone]\n    payload = zone_state.build_daily_trails(\n        sessions=[{\n            "id": "one-task",\n            "started_at_ms": 1000,\n            "active": False,\n            "completed": False,\n            "segment_starts_ms": [1000],\n            "zone_cycle_boundaries": [{"zone_id": 13, "at_ms": 5000}],\n            "points": [\n                point(1000, 1.0, 13), point(2000, 2.0, 13),\n                point(3000, 10.0, 24), point(4000, 11.0, 24),\n                point(5000, 3.0, 13), point(6000, 4.0, 13),\n            ],\n        }],\n        map_zones=[],\n        local_date=day,\n        to_local_date=lambda _stamp: day,\n        revision=1,\n    )\n    zones = {row["zone_id"]: row for row in payload["zones"]}\n    assert zones[13]["segments"] == [[[3.0, 1.0], [4.0, 1.0]]]\n    assert zones[24]["segments"] == [[[10.0, 1.0], [11.0, 1.0]]]\n\n\ndef test_session_svg_uses_reported_swath_width() -> None:\n    package = types.ModuleType(PACKAGE + "_svg")\n    package.__path__ = [str(COMPONENT)]\n    sys.modules.setdefault(PACKAGE + "_svg", package)\n    _load(f"{PACKAGE}_svg.const", COMPONENT / "const.py")\n    _load(f"{PACKAGE}_svg.zone_state", COMPONENT / "zone_state.py")\n    svg = _load(f"{PACKAGE}_svg.session_svg", COMPONENT / "session_svg.py")\n    session = {\n        "id": "x-series",\n        "active": False,\n        "ended_at_ms": 3000,\n        "segment_starts_ms": [1000],\n        "mowing_path_width_m": 0.5,\n        "points": [\n            [1000, 0.0, 0.0, 0.0, "mowing", 4, 5, 1],\n            [2000, 2.0, 0.0, 0.0, "mowing", 4, 5, 1],\n            [3000, 4.0, 0.0, 0.0, "mowing", 4, 5, 1],\n        ],\n    }\n    artifact = svg.build_session_svg_archive(session)\n    assert artifact is not None\n    assert artifact["version"] == 2\n    assert artifact["mowed_area"]["swath_width_m"] == 0.5\n'''
          write('tests/test_v041_beta2.py', tests)

          # Remove this one-shot workflow from the resulting release branch.
          (root / '.github/workflows/beta2-prep-temp.yaml').unlink()
          PY

      - name: Validate patched tree
        run: |
          python -m compileall -q custom_components/navimower
          python -m pip install --upgrade pytest voluptuous cryptography
          python -m pytest -q

      - name: Commit beta2 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Navimower 0.4.1-beta2"
          git push origin HEAD:release/0.4.1-beta2
