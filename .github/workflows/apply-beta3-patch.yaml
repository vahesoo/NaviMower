name: Apply beta3 patch

on:
  push:
    branches:
      - fix/v0.3.4-beta3-progress-mapdata
    paths:
      - tools/apply_beta3.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.3.4-beta3-progress-mapdata
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python tools/apply_beta3.py

      - name: Remove one-shot patch tooling
        run: git rm tools/apply_beta3.py .github/workflows/apply-beta3-patch.yaml

      - name: Commit generated beta3 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix active-zone progress and map-data performance for v0.3.4-beta3"
          git push origin HEAD:fix/v0.3.4-beta3-progress-mapdata
