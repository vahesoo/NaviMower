name: Finalize Navimower 0.4.1-beta2 v5

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.comment.body == 'RUN-BETA2-FINALIZE-V5'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build clean beta2 from beta1
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee /tmp/beta2.log) 2>&1
          set -euo pipefail
          git fetch origin release/0.4.1-beta2
          git show origin/release/0.4.1-beta2:.github/workflows/beta2-prep-temp.yaml > /tmp/beta2-patch.yaml
          git checkout -B release/0.4.1-beta2 75aa6ce2bdae2cc70f8335abefda61cf842109e4
          mkdir -p .github/workflows
          cp /tmp/beta2-patch.yaml .github/workflows/beta2-prep-temp.yaml
          python - <<'PY'
          from pathlib import Path
          workflow = Path('/tmp/beta2-patch.yaml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(script, 'beta2-patch.yaml', 'exec'))
          PY
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/test_history_merge.py')
          s = p.read_text(encoding='utf-8')
          old = '''        active_zone_progress=97,\n    )\n    active = manager.active_session\n'''
          new = '''        active_zone_progress=97,\n        active_progress_zone_id=13,\n    )\n    active = manager.active_session\n'''
          if old not in s:
              raise SystemExit('practical completion owner block missing')
          s = s.replace(old, new, 1)
          old = '''    assert manager.prepare_cycle(high, pose_time=2_600_000_010) is False\n    assert manager.prepare_cycle(low, pose_time=2_600_000_020) is True\n    first = manager._sessions[0]\n    assert first["completed"] is False\n    assert first["completion_reason"] == "vendor_cycle_reset_partial"\n    assert "last_completed_at" not in manager.zone_history().get("13", {})\n'''
          new = '''    high["active_zone_progress_zone_id"] = 13\n    low["active_zone_progress_zone_id"] = 13\n    first_id = manager._active_id\n    assert manager.prepare_cycle(high, pose_time=2_600_000_010) is False\n    assert manager.prepare_cycle(low, pose_time=2_600_000_020) is True\n    assert manager._active_id == first_id\n    assert len(manager._sessions) == 1\n    first = manager._cache[first_id]\n    assert first["completed"] is None\n    assert first["completion_reason"] is None\n    boundaries = first.get("zone_cycle_boundaries") or []\n    assert len(boundaries) == 1\n    assert boundaries[0]["zone_id"] == 13\n    assert boundaries[0]["previous_peak"] == 50\n    assert "last_completed_at" not in manager.zone_history().get("13", {})\n'''
          if old not in s:
              raise SystemExit('vendor partial reset block missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once('tests/test_session_svg.py', 'assert artifact["version"] == 1', 'assert artifact["version"] == 2', 'svg archive version test')
          replace_once('tests/test_session_archive.py', 'return {"version": 1, "source": fingerprint(session), "mowed_area": {"path_d": "M0 0Z"}}', 'return {"version": 2, "source": fingerprint(session), "mowed_area": {"path_d": "M0 0Z"}}', 'archive stub version')
          replace_once('tests/test_session_archive.py', 'self.history = History()\n                self.listeners = []', 'self.history = History()\n                self.data = {"mowing_path_width_m": 0.25}\n                self.listeners = []', 'archive coordinator data')

          p = Path('tests/test_v034_release.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assert manifest["version"] == "0.4.1-beta1"', 'assert manifest["version"] == "0.4.1-beta2"', 1)
          s = s.replace('/ "0.4.1-beta1.md").read_text()', '/ "0.4.1-beta2.md").read_text()', 1)
          s = s.replace('assert notes.startswith("title: Navimower 0.4.1-beta1")', 'assert notes.startswith("title: Navimower 0.4.1-beta2")', 1)
          old = '''    assert "Live position valid" in notes\n    assert "channel" in notes\n    assert "Private-cloud polling starvation fix" in notes\n    assert "5 seconds" in notes\n'''
          new = '''    assert "Zone progress and coverage ownership" in notes\n    assert "Mowing-footprint width" in notes\n    assert "316" in notes\n    assert "0.4.1-beta1" in notes\n'''
          if old not in s:
              raise SystemExit('release notes assertions missing')
          s = s.replace(old, new, 1)
          s = s.replace('assert "SESSION_SVG_ARCHIVE_VERSION = 1" in svg', 'assert "SESSION_SVG_ARCHIVE_VERSION = 2" in svg', 1)
          s = s.replace('assert \'"swath_width_m": SWATH_WIDTH_M\' in svg', 'assert \'"swath_width_m": swath_width\' in svg', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_v033_features.py')
          s = p.read_text(encoding='utf-8')
          old = '''def test_daily_trails_do_not_treat_every_dock_session_as_new_cycle() -> None:\n    source = (COMPONENT / "zone_state.py").read_text()\n    assert "boundary_before_next" in source\n    assert 'if active:' in source\n    assert 'if "reset" in reason:' in source\n    assert 'elif session.get("completed") is True:' in source\n    assert "by_zone.pop(zone_id, None)" in source\n'''
          new = '''def test_daily_trails_do_not_treat_every_dock_session_as_new_cycle() -> None:\n    source = (COMPONENT / "zone_state.py").read_text()\n    assert "boundary_before_next" in source\n    assert "zone_cycle_boundaries" in source\n    assert "by_zone.pop(zone_id, None)" in source\n'''
          if old not in s:
              raise SystemExit('daily trail stale contract missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q custom_components/navimower
          python -m pip install --upgrade pytest voluptuous cryptography
          python -m pytest -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Navimower 0.4.1-beta2"
          git push --force origin HEAD:release/0.4.1-beta2
      - name: Report result
        if: always()
        shell: bash
        run: |
          {
            echo "beta2 finalizer v5 outcome: ${{ steps.build.outcome }}"
            echo
            echo '```text'
            tail -n 180 /tmp/beta2.log 2>/dev/null || true
            echo '```'
          } > /tmp/result.md
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/result.md
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
