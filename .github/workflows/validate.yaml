name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest voluptuous cryptography pyyaml

      - name: Compile integration
        run: python -m compileall -q custom_components/navimower

      - name: Run regression tests
        run: python -m pytest -q

      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/navimower/manifest.json >/dev/null
          python -m json.tool custom_components/navimower/strings.json >/dev/null
          python -m json.tool custom_components/navimower/translations/en.json >/dev/null

      - name: Verify standalone-card separation
        run: |
          test ! -d custom_components/navimower/www
          ! grep -R --line-number --fixed-strings 'add_extra_js_url' custom_components/navimower
          ! grep -R --line-number --fixed-strings '/local/navimower/' custom_components/navimower

      - name: Verify clean test tree
        run: git diff --exit-code

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
