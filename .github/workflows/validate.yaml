name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components/navimower
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/navimower/manifest.json >/dev/null
          python -m json.tool custom_components/navimower/strings.json >/dev/null
          python -m json.tool custom_components/navimower/translations/en.json >/dev/null
      - name: Check card JavaScript
        run: |
          node --check custom_components/navimower/www/navimower-map-card.js
          node --check custom_components/navimower/www/navimower-mow-card.js
          node --check custom_components/navimower/www/navimower-scheduler-card.js

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
